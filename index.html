<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STEK</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png?v=4">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=4">
<meta name="theme-color" content="#07040d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="STEK">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Exo+2:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Tema: HUD de RPG escuro. Painéis com cantos chanfrados e brilho azul; uma coluna, celular primeiro. */
:root {
  --bg: #07040d;
  --surface: rgba(17, 10, 33, 0.9);
  --surface-2: rgba(29, 17, 54, 0.92);
  --ink: #efe6ff;
  --muted: #9d8fbd;
  --line: #35245e;
  --accent: #b07cff;
  --accent-soft: rgba(166, 107, 255, 0.12);
  --glow: 0 0 0 1px rgba(166, 107, 255, .55), 0 0 18px rgba(166, 107, 255, .22), inset 0 0 22px rgba(166, 107, 255, .07);
  --good: #3cf0a5;
  --good-soft: rgba(60, 240, 165, 0.12);
  --warn: #ffc24b;
  --bad: #ff5c7a;
  --font-display: "Rajdhani", "Arial Narrow", sans-serif;
  --font-body: "Exo 2", system-ui, -apple-system, "Segoe UI", sans-serif;
  --cut: 12px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
html { background: #07040d; }
body {
  background:
    radial-gradient(900px 500px at 50% -120px, rgba(122, 52, 255, .24), transparent 70%),
    repeating-linear-gradient(0deg, rgba(166, 107, 255, .035) 0 1px, transparent 1px 4px),
    var(--bg);
  background-attachment: fixed;
  color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45;
}
.panel, .card, .guide, .datebar, .banner {
  background: var(--surface);
  clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
  border: 1px solid rgba(166, 107, 255, .38);
  box-shadow: var(--glow);
  position: relative;
}
.card::before, .guide::before {
  content: ""; position: absolute; left: var(--cut); right: 30%; top: 0; height: 2px;
  background: linear-gradient(90deg, var(--accent), transparent);
}
header.top { position: sticky; top: 0; z-index: 5; background: rgba(4, 6, 12, .92); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px 2px; max-width: 720px; margin: 0 auto; }
.brand h1 img { border-radius: 8px; }
.brand h1 { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: .08em; text-transform: uppercase; margin: 0; white-space: nowrap; text-shadow: 0 0 12px rgba(166, 107, 255, .55); }
#status { font-size: 12px; color: var(--muted); white-space: nowrap; letter-spacing: .04em; }
#status.ok { color: var(--good); }
#status.err { color: var(--warn); }
.lvl { max-width: 720px; margin: 0 auto; padding: 4px 16px 0; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; font-family: var(--font-display); font-weight: 600; letter-spacing: .08em; font-size: 14px; }
.lvl-badge { color: var(--accent); text-shadow: 0 0 8px rgba(166, 107, 255, .6); }
.lvl-bar { height: 6px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; transform: skewX(-20deg); }
.lvl-fill { height: 100%; background: linear-gradient(90deg, #6a2bff, var(--accent)); box-shadow: 0 0 10px var(--accent); }
.lvl-xp { color: var(--muted); font-variant-numeric: tabular-nums; }
nav.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px 10px; max-width: 720px; margin: 0 auto; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button { flex: 0 0 auto; font: 600 15px var(--font-display); letter-spacing: .08em; text-transform: uppercase; padding: 7px 14px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%); }
nav.tabs button[aria-selected="true"] { color: var(--bg); background: var(--accent); border-color: var(--accent); box-shadow: 0 0 14px rgba(166, 107, 255, .6); }
main { max-width: 720px; margin: 0 auto; padding: 16px 16px calc(48px + env(safe-area-inset-bottom)); display: grid; gap: 14px; }
.banner { padding: 12px 14px; font-size: 14px; }
.wk-head { display: grid; gap: 4px; }
.wk-head h2 { font-family: var(--font-display); font-weight: 700; font-size: 30px; text-transform: uppercase; margin: 0; letter-spacing: .1em; text-wrap: balance; }
.wk-head h2::before { content: "◆ "; color: var(--accent); font-size: .6em; vertical-align: middle; text-shadow: 0 0 8px var(--accent); }
.wk-head p { margin: 0; color: var(--muted); }
.datebar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; }
.datebar label { font-family: var(--font-display); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 14px; }
.datebar input { font: 500 16px var(--font-body); color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); padding: 6px 8px; color-scheme: dark; }
.datebar .hint { font-size: 13px; color: var(--muted); }
.card { padding: 16px 14px 14px; display: grid; gap: 10px; }
.card-top { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; }
.num { font-family: var(--font-display); font-weight: 700; font-size: 24px; color: var(--accent); line-height: 1.05; font-variant-numeric: tabular-nums; text-shadow: 0 0 10px rgba(166, 107, 255, .6); }
.ex-name { font-weight: 600; margin: 0; }
.ex-note { font-size: 13px; color: var(--muted); margin: 2px 0 0; }
.howto { display: inline-block; margin-top: 6px; font: 600 13px var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); text-decoration: none; padding: 4px 10px; border: 1px solid rgba(166, 107, 255, .5); background: var(--accent-soft); }
.howto:active { opacity: .7; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; }
.presc { font-family: var(--font-display); font-weight: 600; font-size: 16px; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.chip { font: 700 12px var(--font-display); letter-spacing: .1em; text-transform: uppercase; padding: 2px 8px; background: var(--good-soft); color: var(--good); border: 1px solid var(--good); box-shadow: 0 0 10px rgba(60, 240, 165, .35); }
.chip::before { content: "▲ "; }
.last { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.last b { color: var(--ink); font-weight: 600; }
.inputs { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 8px; }
.field { display: grid; gap: 4px; }
.field label { font: 600 12px var(--font-display); color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
.field input { width: 100%; font: 600 20px var(--font-body); font-variant-numeric: tabular-nums; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); padding: 8px 10px; }
.field input:focus { border-color: var(--accent); box-shadow: 0 0 12px rgba(166, 107, 255, .4); outline: none; }
.field input:disabled { opacity: .55; }
input:focus-visible, button:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
details summary { cursor: pointer; font: 600 14px var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.hist { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; font-size: 14px; font-variant-numeric: tabular-nums; }
.hist li { display: flex; justify-content: space-between; border-bottom: 1px dashed var(--line); padding: 4px 0; }
.hist li span:first-child { color: var(--muted); }
.guide { padding: 18px 16px 16px; display: grid; gap: 10px; }
.guide h3 { font-family: var(--font-display); font-weight: 700; font-size: 22px; text-transform: uppercase; margin: 0; letter-spacing: .1em; }
.guide p, .guide li { max-width: 65ch; }
.guide ul { margin: 0; padding-left: 18px; display: grid; gap: 8px; }
.guide li::marker { color: var(--accent); }
.week { width: 100%; border-collapse: collapse; font-size: 15px; }
.week td { padding: 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.week td:first-child { font-family: var(--font-display); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); width: 96px; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { font: 600 15px var(--font-display); letter-spacing: .08em; text-transform: uppercase; padding: 10px 14px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); cursor: pointer; }
.pick { text-align: left; color: var(--ink); font: inherit; cursor: pointer; width: 100%; }
.pick .chip::before { content: ""; }
.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 560px) { .tiles { grid-template-columns: repeat(4, 1fr); } }
.tile { background: var(--surface-2); border: 1px solid var(--line); padding: 10px 12px; display: grid; gap: 2px; align-content: start; }
.tile-label { font: 600 12px var(--font-display); color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
.tile-num { font-family: var(--font-display); font-weight: 700; font-size: 38px; line-height: 1; font-variant-numeric: tabular-nums; }
.tile-sub { font-size: 13px; color: var(--muted); }
.tile.good { border-color: var(--good); box-shadow: 0 0 12px rgba(60, 240, 165, .25); }
.tile.good .tile-num { color: var(--good); text-shadow: 0 0 10px rgba(60, 240, 165, .5); }
.tile.warn { border-color: var(--warn); }
.tile.warn .tile-num { color: var(--warn); }
.tile.bad { border-color: var(--bad); box-shadow: 0 0 12px rgba(255, 92, 122, .25); }
.tile.bad .tile-num, .tile.bad .tile-sub { color: var(--bad); }
.stepper { display: flex; align-items: center; gap: 8px; }
.step { width: 32px; height: 32px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); font: 700 18px var(--font-body); cursor: pointer; }
.note { margin: 0; font-size: 15px; }
.note.muted { font-size: 13px; color: var(--muted); }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; max-width: 360px; }
.cal-h { text-align: center; font: 600 12px var(--font-display); color: var(--muted); letter-spacing: .1em; }
.cal-d { text-align: center; font-size: 13px; padding: 6px 0; font-variant-numeric: tabular-nums; border: 1px solid transparent; }
.cal-d.done { background: var(--accent); color: var(--bg); font-weight: 700; box-shadow: 0 0 10px rgba(166, 107, 255, .5); }
.cal-d.plan { border: 1px dashed var(--accent); }
.cal-d.miss { color: var(--bad); opacity: .7; text-decoration: line-through; }
.cal-d.today { outline: 2px solid var(--ink); outline-offset: -2px; }
button.cal-d { appearance: none; font: inherit; font-size: 13px; color: inherit; background: none; cursor: pointer; }
button.cal-d:hover { border-color: var(--accent); }
button.cal-d:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.step:disabled { opacity: .35; cursor: not-allowed; }
.linkbtn { appearance: none; background: none; border: 0; padding: 0; font: inherit; color: var(--accent); text-decoration: underline; cursor: pointer; text-align: left; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 13px; color: var(--muted); }
.lg { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 14px; height: 14px; display: inline-block; border: 1px solid transparent; }
.sw.done { background: var(--accent); }
.sw.plan { border: 1px dashed var(--accent); }
.sw.miss { background: var(--bad); opacity: .6; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.gchip { font: 600 14px var(--font-display); letter-spacing: .06em; text-transform: uppercase; padding: 5px 12px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); cursor: pointer; }
.gchip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 10px rgba(166, 107, 255, .35); }
.chart-t { margin: 6px 0 0; font: 600 13px var(--font-display); letter-spacing: .1em; text-transform: uppercase; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .grid.zero { stroke: var(--muted); stroke-dasharray: 3 3; }
.chart .ax { fill: var(--muted); font: 10px var(--font-body); }
.chart .val { fill: var(--ink); font: 700 12px var(--font-display); }
.chart .bar { fill: var(--accent); opacity: .35; }
.chart .bar.last { opacity: 1; filter: drop-shadow(0 0 6px rgba(166, 107, 255, .8)); }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; filter: drop-shadow(0 0 4px rgba(166, 107, 255, .7)); }
.chart .area { fill: var(--accent); opacity: .1; }
.chart .dot { fill: var(--bg); stroke: var(--accent); stroke-width: 2; }
.chart .dot.last { fill: var(--accent); }
@media (prefers-reduced-motion: no-preference) {
  nav.tabs button, .gchip { transition: background .15s, color .15s, box-shadow .15s; }
  .lvl-fill { transition: width .6s ease; }
  .card, .guide { animation: rise .35s ease both; }
  @keyframes rise { from { transform: translateY(6px); } to { transform: none; } }
}

/* ---------- Tela inicial: módulos ---------- */
.home-btn { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; margin: 0; color: inherit; font: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; }
.crumb { font-size: 15px; color: var(--muted); letter-spacing: .1em; }
.crumb:empty { display: none; }
body[data-view="home"] nav.tabs { display: none; }
body[data-view="home"] header.top { padding-bottom: 8px; }
.mods { display: grid; gap: 14px; }
@media (min-width: 640px) { .mods { grid-template-columns: 1fr 1fr; align-items: start; } }
.module { display: grid; }
.mod-head { display: grid; grid-template-columns: 1fr auto; }
.mod-enter { display: grid; grid-template-columns: 50px 1fr; gap: 14px; align-items: center; padding: 16px 8px 16px 16px; background: none; border: 0; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.mod-enter:disabled { cursor: default; }
.mod-ico { width: 50px; height: 50px; display: grid; place-items: center; border: 1px solid var(--line); background: var(--accent-soft); color: var(--accent); clip-path: polygon(9px 0, 100% 0, 100% calc(100% - 9px), calc(100% - 9px) 100%, 0 100%, 0 9px); }
.mod-ico svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 5px rgba(166, 107, 255, .8)); }
.mod-name { display: block; font: 700 22px var(--font-display); letter-spacing: .12em; text-transform: uppercase; }
.mod-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 4px; font-size: 13px; color: var(--muted); }
.st { font: 700 12px var(--font-display); letter-spacing: .1em; text-transform: uppercase; padding: 2px 8px; border: 1px solid var(--line); color: var(--muted); }
.st.pend { color: var(--warn); border-color: var(--warn); box-shadow: 0 0 10px rgba(255, 194, 75, .3); }
.st.ok { color: var(--good); border-color: var(--good); box-shadow: 0 0 10px rgba(60, 240, 165, .3); }
.mod-toggle { width: 54px; border: 0; border-left: 1px solid var(--line); background: none; color: var(--accent); cursor: pointer; display: grid; place-items: center; }
.mod-toggle svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.mod-toggle[aria-expanded="true"] svg { transform: rotate(180deg); }
.mod-body { border-top: 1px solid var(--line); padding: 12px 16px 16px; display: grid; gap: 10px; }
.mod-body[hidden] { display: none; }
.module.soon .mod-ico { color: var(--muted); }
.module.soon .mod-ico svg { filter: none; }
.module.soon .mod-name { color: var(--muted); }
.task { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; width: 100%; text-align: left; font: inherit; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-left: 3px solid var(--warn); padding: 10px 12px; cursor: pointer; }
.task.done { border-left-color: var(--good); }
.task.opt { border-left-color: var(--muted); }
.task-t { font: 700 17px var(--font-display); letter-spacing: .06em; text-transform: uppercase; }
.task-s { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
.task-n { font: 700 14px var(--font-display); letter-spacing: .06em; color: var(--warn); font-variant-numeric: tabular-nums; }
.task.done .task-n { color: var(--good); }
.task.opt .task-n { color: var(--muted); }
.task-bar { grid-column: 1 / -1; height: 4px; background: var(--bg); border: 1px solid var(--line); overflow: hidden; }
.task-bar > span { display: block; height: 100%; background: var(--warn); }
.task.done .task-bar > span { background: var(--good); }
.task.opt .task-bar > span { background: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .mod-toggle svg { transition: transform .2s ease; } .module { animation: rise .35s ease both; } }

/* ---------- Módulo Inteligência ---------- */
.tiles.tiles-3 { grid-template-columns: repeat(3, 1fr); }
.tiles.tiles-3 .tile-num { font-size: 30px; white-space: nowrap; }
@media (max-width: 460px) { body:not([data-view="home"]) #status { display: none; } .crumb { font-size: 13px; } }
.goalbar { position: relative; height: 10px; background: var(--surface-2); border: 1px solid var(--line); }
.goalbar > span { display: block; height: 100%; background: linear-gradient(90deg, #6a2bff, var(--accent)); box-shadow: 0 0 10px rgba(166, 107, 255, .6); }
.goalbar.thin { height: 6px; }
.goalbar > i { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--ink); }
.timer-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--line); }
.timer-row.running { border-color: var(--accent); box-shadow: 0 0 14px rgba(166, 107, 255, .35); }
.timer { font: 700 34px var(--font-display); letter-spacing: .06em; font-variant-numeric: tabular-nums; line-height: 1; }
.timer-row.running .timer { color: var(--accent); text-shadow: 0 0 12px rgba(166, 107, 255, .6); }
.timer-btns { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.step.wide { width: auto; padding: 0 10px; font: 600 13px var(--font-display); letter-spacing: .06em; }
.btn.stop { background: var(--accent); color: var(--bg); box-shadow: 0 0 14px rgba(166, 107, 255, .6); }
.btn.danger { border-color: var(--bad); color: var(--bad); background: transparent; }
.plan { display: grid; gap: 6px; padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--accent-soft); }
.plan-t { font: 700 12px var(--font-display); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.plan-items { margin: 0; font-size: 15px; }
.theory { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; cursor: pointer; }
.theory input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: #b07cff; flex: 0 0 auto; }
.count-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.field-l { font: 600 13px var(--font-display); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.count-in { width: 64px; text-align: center; font: 700 20px var(--font-body); font-variant-numeric: tabular-nums; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); padding: 4px 6px; }
.subj-prog, .subj-sum { display: grid; gap: 6px; }
.subj-sum + .subj-sum { border-top: 1px dashed var(--line); padding-top: 10px; }
.inputs.two { grid-template-columns: 1fr 1fr; }
.sel { width: 100%; font: 600 16px var(--font-body); color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); padding: 10px; color-scheme: dark; }
.st.run { color: var(--accent); border-color: var(--accent); font-variant-numeric: tabular-nums; }
.chart .goal { stroke: var(--ink); stroke-width: 2; opacity: .8; }

/* ---------- Módulo Finanças ---------- */
.tiles, .fin-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.tile { min-width: 0; }
.tiles.tiles-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (min-width: 560px) { .fin-tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile-num.money { font-size: clamp(17px, 5.4vw, 24px); white-space: nowrap; letter-spacing: .01em; }
.tiles-3 .tile-num.money { font-size: clamp(15px, 4.2vw, 22px); }
.tile-sub.up { color: var(--good); }
.tile-sub.down { color: var(--bad); }
details.imp > summary, details.tok > summary { cursor: pointer; font: 700 18px var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
details.tok > summary { font-size: 14px; }
details.imp[open] { gap: 10px; }
.search { width: 100%; font: 500 16px var(--font-body); color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); padding: 8px 10px; flex: 1 1 200px; }
.txlist { display: grid; gap: 10px; }
.card.tx { padding: 0; gap: 0; }

function todayISO() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
function fmtDate(iso) { const [y, m, d] = iso.split("-"); return d + "/" + m + "/" + y.slice(2); }
function parseNum(v) { if (v == null) return null; const s = String(v).trim().replace(",", "."); if (s === "") return null; const n = Number(s); return isFinite(n) && n >= 0 ? n : null; }
function fmtNum(n) { return n == null ? "" : String(n).replace(".", ","); }
function entryText(e) {
  const parts = [];
  if (e.kg != null) parts.push(fmtNum(e.kg) + " kg");
  if (e.sets != null && e.reps != null) parts.push(fmtNum(e.sets) + " × " + fmtNum(e.reps) + " reps");
  else if (e.sets != null) parts.push(fmtNum(e.sets) + " séries");
  else if (e.reps != null) parts.push(fmtNum(e.reps) + " reps");
  return parts.length ? parts.join(" · ") : "—";
}

function buildCard(ex, n) {

  meta.appendChild(pr);

    const inp = document.createElement("input"); inp.id = ex.id + "-" + k; inp.inputMode = k === "kg" ? "decimal" : "numeric";
    inp.autocomplete = "off"; inp.placeholder = "—"; inp.disabled = !state.canWrite; inp.dataset.field = k;

  det.append(sum, ul);

  card.append(top, meta, last, inputs, det);

  return card;
}

function fillCard(card, ex) {
  const cur = state.logs[state.date] && state.logs[state.date].e && state.logs[state.date].e[ex.id];
  card.querySelectorAll("input[data-field]").forEach(inp => {
    inp.disabled = !state.canWrite;
    if (document.activeElement === inp) return;
    inp.value = cur ? fmtNum(cur[inp.dataset.field]) : "";
  });
  const all = entriesFor(ex.id);
  const prev = all.find(x => x.date < state.date);
  const last = card.querySelector('[data-role="last"]');
  last.textContent = "";
  if (prev) {
    last.append("Última vez (" + fmtDate(prev.date) + "): ");
    const b = document.createElement("b"); b.textContent = entryText(prev.e); last.appendChild(b);
  } else {
    last.textContent = state.loaded === true ? "Sem registro anterior." : "";
  }
  card.querySelector('[data-role="chip"]').hidden = !(prev && prev.e.reps != null && prev.e.reps >= ex.hi);
  const sum = card.querySelector('[data-role="sum"]');
  sum.textContent = "Histórico (" + all.length + ")";
  const ul = card.querySelector('[data-role="hist"]');
  ul.innerHTML = "";
  if (!all.length) { const li = document.createElement("li"); li.textContent = "Nenhum registro ainda."; ul.appendChild(li); }
  all.forEach(x => {
    const li = document.createElement("li");
    const a = document.createElement("span"); a.textContent = fmtDate(x.date);
    const b = document.createElement("span"); b.textContent = entryText(x.e);
    li.append(a, b); ul.appendChild(li);
  });
}

function onEdit(ex, field, raw) {
  if (!state.canWrite) return;
  const date = state.date;
  const doc = state.logs[date] || { date, e: {} };
  if (!doc.e) doc.e = {};
  const e = Object.assign({ kg: null, sets: null, reps: null }, doc.e[ex.id]);
  e[field] = parseNum(raw);
  if (e.kg == null && e.reps == null && e.sets == null) delete doc.e[ex.id]; else doc.e[ex.id] = e;
  if (Object.keys(doc.e).length) state.logs[date] = doc; else delete state.logs[date];
  setStatus("Salvando…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { saveLogs(); refreshCards(); }, 400);
}

function importBackup(file, msg) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      const logs = (data && data.logs) || {};
      if (typeof logs !== "object" || (!data.logs && !data.intel && !data.fin && !data.stamina && !data.graca && !data.missoes)) throw new Error();
      let n = 0;
      Object.keys(logs).forEach(date => {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !logs[date] || !logs[date].e) return;
        const cur = state.logs[date] || { date, e: {} };
        Object.assign(cur.e, logs[date].e);
        state.logs[date] = cur; n++;
      });
      saveLogs();
      let ni = 0;
      if (data.intel && Array.isArray(data.intel.subjects)) {
        if (!intel) { intel = data.intel; intel.timer = null; }
        else {
          data.intel.subjects.forEach(s => { if (!intel.subjects.some(x => x.id === s.id)) intel.subjects.push(s); });
          Object.keys(data.intel.days || {}).forEach(d => { intel.days[d] = intel.days[d] || {}; Object.keys(data.intel.days[d]).forEach(sid => { if (!intel.days[d][sid]) intel.days[d][sid] = data.intel.days[d][sid]; }); });
        }
        loadIntelDefaults(); saveIntel(); ni = Object.keys(data.intel.days || {}).length;
      }
      let nf = 0;
      if (data.fin && Array.isArray(data.fin.tx)) {
        nf = mergeTx(data.fin.tx.map(t => Object.assign({}, t))).added;
        Object.assign(fin.rules, data.fin.rules || {});
        const ids = new Set(fin.invest.ops.map(o => o.id));
        ((data.fin.invest && data.fin.invest.ops) || []).forEach(o => { if (!ids.has(o.id)) fin.invest.ops.push(o); });
        Object.assign(fin.invest.quotes, (data.fin.invest && data.fin.invest.quotes) || {});
        if (!fin.invest.token && data.fin.invest && data.fin.invest.token) fin.invest.token = data.fin.invest.token;
        Object.assign(fin.habit, data.fin.habit || {});
        if (!ofReady() && data.fin.of && data.fin.of.url) fin.of = Object.assign({}, data.fin.of, { last: null });
        saveFin();
      }
      if (data.missoes && Array.isArray(data.missoes.tasks)) {
        const gm = ensureMs();
        data.missoes.tasks.forEach(x => { const i = gm.tasks.findIndex(y => y.id === x.id); if (i < 0) gm.tasks.push(x); else if ((x.upd || 0) > (gm.tasks[i].upd || 0)) gm.tasks[i] = x; });
        Object.keys(data.missoes.days || {}).forEach(d => { gm.days[d] = gm.days[d] || {}; Object.keys(data.missoes.days[d] || {}).forEach(id => { gm.days[d][id] = Math.max(gm.days[d][id] || 0, data.missoes.days[d][id] || 0); }); });
        saveMs();
      }
      if (data.graca && Array.isArray(data.graca.rituals)) {
        const gg = ensureGraca();
        data.graca.rituals.forEach(x => { if (!gg.rituals.some(y => y.id === x.id)) gg.rituals.push(x); });
        Object.keys(data.graca.days || {}).forEach(d => { gg.days[d] = gg.days[d] || {}; Object.keys(data.graca.days[d] || {}).forEach(id => { const v = data.graca.days[d][id], cur = gg.days[d][id]; if (v && (!cur || (v.count || 0) > (cur.count || 0) || (v.sec || 0) > (cur.sec || 0))) gg.days[d][id] = v; }); });
        saveGraca();
      }
      if (data.stamina && data.stamina.days) {
        const st = ensureStamina();
        Object.keys(data.stamina.days).forEach(d => { st.days[d] = st.days[d] || {}; Object.keys(data.stamina.days[d] || {}).forEach(pid => { const v = data.stamina.days[d][pid]; if (v && (!st.days[d][pid] || (v.sec || 0) > (st.days[d][pid].sec || 0))) st.days[d][pid] = v; }); });
        if (!st.age && data.stamina.age) st.age = data.stamina.age;
        saveStamina();
      }
      if (nf) { flashAuto(msg, "Backup importado: " + n + " dia(s) de treino, " + ni + " dia(s) de estudo e " + nf + " lançamento(s) financeiro(s)."); return; }
      flashAuto(msg, (n || ni) ? "Backup importado: " + n + " dia(s) de treino" + (data.intel ? " e " + ni + " dia(s) de estudo." : ".") : "O arquivo não tinha registros.");
    } catch (e) { flashAuto(msg, "Arquivo inválido. Escolha um backup gerado por este app."); }
  };
  r.readAsText(file);
}

const DOW_NAMES = ["domingos", "segundas", "terças", "quartas", "quintas", "sextas", "sábados"];
function listPt(a) { return a.length > 1 ? a.slice(0, -1).join(", ") + " e " + a[a.length - 1] : a.join(""); }
let settings = { goals: {} };
function loadSettings() { settings = { goals: {} }; try { const s = JSON.parse(localStorage.getItem(prof().setKey)); if (s && typeof s === "object") settings = s; if (!settings.goals) settings.goals = {}; } catch (e) {} }
function saveSettings() { try { localStorage.setItem(prof().setKey, JSON.stringify(settings)); } catch (e) {} }
function ymd(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function hasEntries(date) { const l = state.logs[date]; return !!(l && l.e && Object.keys(l.e).length); }

// Dias de treino do mês: seguem o plano (ex.: seg, ter, qui, sex) até você marcar ou desmarcar dias no calendário.
function defaultPlanDays(y, m) { const last = new Date(y, m + 1, 0).getDate(), out = []; for (let d = 1; d <= last; d++) if (prof().dow.includes(new Date(y, m, d).getDay())) out.push(ymd(new Date(y, m, d))); return out; }
function planDays(y, m) { const key = y + "-" + String(m + 1).padStart(2, "0"); return settings.days && settings.days[key] ? settings.days[key].slice() : defaultPlanDays(y, m); }
function setPlanDays(key, arr) { settings.days = settings.days || {}; settings.days[key] = Array.from(new Set(arr)).sort(); delete settings.goals[key]; saveSettings(); }
function isPlannedDay(iso) { const [y, m] = iso.split("-").map(Number); return planDays(y, m - 1).includes(iso); }
function monthStats() {
  const now = new Date(); const y = now.getFullYear(), m = now.getMonth();
  const key = y + "-" + String(m + 1).padStart(2, "0");
  const last = new Date(y, m + 1, 0).getDate();
  const today = ymd(now);
  const planned = defaultPlanDays(y, m).length;
  // meta antiga (só o número, sem dias): vira dias no calendário, completando a partir de hoje
  if (settings.goals[key] != null && !(settings.days && settings.days[key])) {
    const want = settings.goals[key]; let arr = defaultPlanDays(y, m);
    for (let d = now.getDate(); d <= last && arr.length < want; d++) { const iso = ymd(new Date(y, m, d)); if (!arr.includes(iso)) arr.push(iso); }
    while (arr.length > want) { const fut = arr.filter(x => x >= today && !hasEntries(x)).sort(); if (!fut.length) break; arr = arr.filter(x => x !== fut[fut.length - 1]); }
    setPlanDays(key, arr);
  }
  const plan = planDays(y, m);
  const goal = plan.length;
  const done = Object.keys(state.logs).filter(d => d.startsWith(key) && hasEntries(d)).length;
  const remaining = last - now.getDate() + (hasEntries(today) ? 0 : 1);
  const need = Math.max(0, goal - done);
  return { y, m, key, last, planned, plan, custom: !!(settings.days && settings.days[key]), goal, done, need, remaining, slack: remaining - need, today };
}

function flash(n, text, kind) { if (!n) return; n.textContent = text || ""; n.className = "note flash " + (kind || "info"); }
function flashAuto(n, text) {
  const t = String(text || "");
  let k = "info";
  if (/^(Não|Erro|Falha|Arquivo inválido|Gere |Cole |Preencha|Digite|Informe|Escolha a data|Você não tem|Dê um nome|O arquivo não tinha|Nenhuma ação)/.test(t)) k = "err";
  else if (/^0 /.test(t)) k = "info";
  else if (/^(Conectado|Backup importado|Token copiado|\d+ lançamento|\d+ cotação|Lançamento adicionado|Banco conectado|Conexão removida)/.test(t)) k = "ok";
  flash(n, t, k);
}
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function dayDetail(iso) {
  const l = state.logs[iso], ids = Object.keys(l.e);
  const order = []; PLAN.forEach(w => w.ex.forEach(x => order.push(x.id)));
  ids.sort((a, b) => (order.indexOf(a) + 1 || 999) - (order.indexOf(b) + 1 || 999));
  const workouts = PLAN.filter(w => w.ex.some(x => ids.includes(x.id))).map(w => w.name);
  const [y, m, d] = iso.split("-").map(Number);
  const box = el("div", "day-detail"); box.id = "cal-detail";
  const head = el("div", "dd-head");
  head.append(el("span", "dd-t", (workouts.join(" + ") || "Treino") + " · " + ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"][new Date(y, m - 1, d).getDay()] + ", " + fmtDate(iso).slice(0, 5)));
  const close = el("button", "linkbtn", "Fechar"); close.type = "button"; close.id = "cal-detail-close";
  close.addEventListener("click", () => { state.calSel = null; renderMain(); });
  head.appendChild(close); box.appendChild(head);
  const ul = el("ul", "dd-list");
  ids.forEach(id => {
    let ex = null; PLAN.forEach(w => w.ex.forEach(x => { if (x.id === id) ex = x; }));
    const li = el("li");
    const top = el("div", "dd-top"); top.append(el("span", "dd-ex", ex ? ex.name : id), el("span", "dd-g", GROUP[id] || ""));
    li.append(top, el("span", "dd-v", entryText(l.e[id])));
    ul.appendChild(li);
  });
  box.appendChild(ul);
  return box;
}

function renderProgress(main) {
  const s = monthStats();
  const head = el("div", "wk-head");
  head.append(el("h2", null, "Progresso"), el("p", null, "Frequência de " + MONTHS[s.m] + " e evolução por grupo muscular."));
  main.appendChild(head);

  const sec = el("section", "guide");
  sec.appendChild(el("h3", null, "Meta de " + MONTHS[s.m]));
  const tiles = el("div", "tiles");

  const tGoal = el("div", "tile");
  tGoal.appendChild(el("span", "tile-label", "Meta do mês"));
  const stepper = el("div", "stepper");
  const minus = el("button", "step", "−"); minus.type = "button"; minus.id = "goal-minus"; minus.setAttribute("aria-label", "Diminuir meta");
  const val = el("span", "tile-num", String(s.goal));
  const plus = el("button", "step", "+"); plus.type = "button"; plus.id = "goal-plus"; plus.setAttribute("aria-label", "Aumentar meta");
  // + marca o próximo dia livre a partir de hoje; − desmarca o último dia marcado que ainda não aconteceu
  plus.addEventListener("click", () => {
    for (let d = new Date().getDate(); d <= s.last; d++) { const iso = ymd(new Date(s.y, s.m, d)); if (!s.plan.includes(iso) && !hasEntries(iso)) { setPlanDays(s.key, s.plan.concat(iso)); renderMain(); return; } }
  });
  minus.addEventListener("click", () => {
    const fut = s.plan.filter(x => x >= s.today && !hasEntries(x)).sort();
    const pick = fut.length ? fut[fut.length - 1] : s.plan.filter(x => !hasEntries(x)).sort().pop();
    if (pick) { setPlanDays(s.key, s.plan.filter(x => x !== pick)); renderMain(); }
  });
  minus.disabled = !s.plan.some(x => !hasEntries(x));
  plus.disabled = !Array.from({ length: s.last - new Date().getDate() + 1 }, (_, i) => ymd(new Date(s.y, s.m, new Date().getDate() + i))).some(x => !s.plan.includes(x) && !hasEntries(x));
  stepper.append(minus, val, plus); tGoal.appendChild(stepper);
  tGoal.appendChild(el("span", "tile-sub", "treinos"));

  const tile = (label, num, sub, mod) => { const t = el("div", "tile" + (mod ? " " + mod : "")); t.append(el("span", "tile-label", label), el("span", "tile-num", String(num)), el("span", "tile-sub", sub)); return t; };
  const slackMod = s.need === 0 ? "good" : s.slack < 0 ? "bad" : s.slack <= 2 ? "warn" : "";
  tiles.append(tGoal,
    tile("Já fui", s.done, s.done === 1 ? "treino" : "treinos", s.need === 0 ? "good" : ""),
    tile("Faltam", s.need, s.need === 1 ? "treino" : "treinos"),
    tile("Posso faltar", s.need === 0 ? "—" : Math.max(0, s.slack), s.slack < 0 ? "meta impossível" : "dias", slackMod));
  sec.appendChild(tiles);

  let msg;
  if (s.need === 0) msg = "Meta do mês batida. Os próximos treinos são bônus.";
  else if (s.slack < 0) msg = "Restam " + s.remaining + " dias no mês e faltam " + s.need + " treinos: mesmo indo todos os dias, a meta não fecha. Ajuste a meta ou foque no próximo mês.";
  else msg = "Restam " + s.remaining + " dias no mês. Você precisa treinar em " + s.need + " deles, então pode faltar em até " + s.slack + ".";
  sec.appendChild(el("p", "note", msg));
  sec.appendChild(el("p", "note muted", "Toque num dia do calendário para marcar ou desmarcar como dia de treino; a meta é o total de dias marcados. Toque num dia em que você treinou para ver o treino. Um dia conta como treino quando você anota pelo menos um exercício nele."));
  if (s.custom) {
    const rs = el("p", "note muted"); rs.append("Este mês está com dias personalizados. ");
    const back = el("button", "linkbtn", "Voltar ao padrão (" + listPt(prof().dow.map(d => DOW_NAMES[d])) + ")"); back.type = "button"; back.id = "plan-reset";
    back.addEventListener("click", () => { delete settings.days[s.key]; delete settings.goals[s.key]; saveSettings(); renderMain(); });
    rs.appendChild(back); sec.appendChild(rs);
  }

  // calendário
  const cal = el("div", "cal");
  ["S", "T", "Q", "Q", "S", "S", "D"].forEach(d => cal.appendChild(el("span", "cal-h", d)));
  const firstDow = (new Date(s.y, s.m, 1).getDay() + 6) % 7;
  for (let i = 0; i < firstDow; i++) cal.appendChild(el("span", "cal-d empty"));
  for (let d = 1; d <= s.last; d++) {
    const iso = s.key + "-" + String(d).padStart(2, "0");
    const isPlan = s.plan.includes(iso), trained = hasEntries(iso);
    let cls = "cal-d";
    if (trained) cls += " done";
    else if (isPlan && iso >= s.today) cls += " plan";
    else if (isPlan) cls += " miss";
    if (iso === s.today) cls += " today";
    if (trained) {
      const tb = el("button", cls + (state.calSel === iso ? " sel" : ""), String(d)); tb.type = "button"; tb.id = "cal-" + iso;
      tb.setAttribute("aria-pressed", String(state.calSel === iso)); tb.setAttribute("aria-label", d + " de " + MONTHS[s.m] + ": treinei, ver o treino");
      tb.addEventListener("click", () => { state.calSel = state.calSel === iso ? null : iso; renderMain(); const dd = document.getElementById("cal-detail"); if (dd) dd.scrollIntoView({ block: "nearest" }); });
      cal.appendChild(tb); continue;
    }
    const b = el("button", cls, String(d)); b.type = "button"; b.id = "cal-" + iso;
    b.setAttribute("aria-pressed", String(isPlan)); b.setAttribute("aria-label", d + " de " + MONTHS[s.m] + (isPlan ? ": dia de treino" : ": sem treino"));
    b.addEventListener("click", () => { setPlanDays(s.key, isPlan ? s.plan.filter(x => x !== iso) : s.plan.concat(iso)); renderMain(); });
    cal.appendChild(b);
  }
  sec.appendChild(cal);
  const legend = el("div", "legend");
  [["done", "Treinei"], ["plan", "Dia planejado"], ["miss", "Planejado, não fui"]].forEach(([c, t]) => { const i = el("span", "lg"); i.append(el("span", "sw " + c), document.createTextNode(t)); legend.appendChild(i); });
  sec.appendChild(legend);
  if (state.calSel && !(state.calSel.startsWith(s.key) && hasEntries(state.calSel))) state.calSel = null;
  if (state.calSel) sec.appendChild(dayDetail(state.calSel));
  main.appendChild(sec);

  // evolução
  const ev = el("section", "guide");
  ev.appendChild(el("h3", null, "Evolução por grupo muscular"));
  const dayGroups = state.calSel ? GROUPS.filter(g => Object.keys(state.logs[state.calSel].e).some(id => GROUP[id] === g)) : null;
  const shown = dayGroups && dayGroups.length ? dayGroups : GROUPS;
  if (!state.group || !shown.includes(state.group)) state.group = shown.find(g => groupSeries(g).length) || shown[0];
  if (dayGroups && dayGroups.length) {
    const nt = el("p", "note muted", "Mostrando só os grupos treinados em " + fmtDate(state.calSel).slice(0, 5) + ". ");
    const all = el("button", "linkbtn", "Ver todos"); all.type = "button"; all.id = "grp-all";
    all.addEventListener("click", () => { state.calSel = null; renderMain(); });
    nt.appendChild(all); ev.appendChild(nt);
  }
  const chips = el("div", "chips");
  shown.forEach(g => {
    const b = el("button", "gchip", g); b.type = "button"; b.id = "grp-" + g;
    b.setAttribute("aria-pressed", String(g === state.group));
    b.addEventListener("click", () => { state.group = g; renderMain(); });
    chips.appendChild(b);
  });
  ev.appendChild(chips);
  const data = groupSeries(state.group);
  if (!data.length) {
    ev.appendChild(el("p", "note muted", "Ainda não há registros de " + state.group.toLowerCase() + ". Anote carga e séries nos treinos para ver a evolução aqui."));
  } else {
    const lastW = data[data.length - 1];
    const parts = [];
    if (lastW.sets != null) parts.push(lastW.sets + " séries na semana de " + fmtDate(lastW.wk).slice(0, 5));
    if (lastW.load != null) parts.push("carga " + (lastW.load >= 0 ? "+" : "") + lastW.load.toFixed(0) + "% em relação ao primeiro registro");
    ev.appendChild(el("p", "note", parts.join(" · ") || "Semana sem séries ou cargas anotadas."));
    ev.appendChild(el("p", "chart-t", "Séries por semana"));
    ev.appendChild(chartBox(barSVG(data)));
    ev.appendChild(el("p", "chart-t", "Carga em relação ao primeiro registro (%)"));
    ev.appendChild(chartBox(lineSVG(data)));
    ev.appendChild(el("p", "note muted", "A carga compara, exercício por exercício, o maior peso da semana com o primeiro peso anotado, e tira a média do grupo. Assim exercícios com pesos diferentes entram na mesma conta. Exercícios sem carga (como as paralelas) contam só nas séries."));
  }
  main.appendChild(ev);
}

function chartBox(svg) { const d = el("div", "chart"); d.innerHTML = svg; return d; }

function weekStart(iso) { const [y, m, d] = iso.split("-").map(Number); const dt = new Date(y, m - 1, d); dt.setDate(dt.getDate() - (dt.getDay() + 6) % 7); return ymd(dt); }

function groupSeries(group) {
  const ids = Object.keys(GROUP).filter(k => GROUP[k] === group);
  const first = {}; const weeks = {};
  Object.keys(state.logs).sort().forEach(date => {
    const l = state.logs[date]; if (!l || !l.e) return;
    ids.forEach(id => {
      const e = l.e[id]; if (!e) return;
      const wk = weekStart(date);
      const w = weeks[wk] || (weeks[wk] = { sets: 0, hasSets: false, max: {} });
      if (e.sets != null) { w.sets += e.sets; w.hasSets = true; }
      if (e.kg > 0) { if (first[id] == null) first[id] = e.kg; w.max[id] = Math.max(w.max[id] || 0, e.kg); }
    });
  });
  return Object.keys(weeks).sort().slice(-12).map(wk => {
    const w = weeks[wk]; const r = Object.keys(w.max).map(id => w.max[id] / first[id]);
    return { wk, sets: w.hasSets ? w.sets : null, load: r.length ? (r.reduce((a, b) => a + b, 0) / r.length - 1) * 100 : null };
  });
}

const CW = 340, CH = 150, PL = 34, PR = 10, PT = 14, PB = 24;
function xLabels(data, xs) {
  const step = Math.ceil(data.length / 6);
  return data.map((p, i) => (i % step === 0 || i === data.length - 1) ? '<text class="ax" x="' + xs(i) + '" y="' + (CH - 6) + '" text-anchor="middle">' + fmtDate(p.wk).slice(0, 5) + '</text>' : "").join("");
}
function barSVG(data) {
  const vals = data.map(p => p.sets || 0); const max = Math.max(4, ...vals);
  const top = Math.ceil(max / 4) * 4;
  const iw = CW - PL - PR, ih = CH - PT - PB, bw = Math.min(26, iw / data.length * 0.6);
  const xs = i => PL + iw * (i + 0.5) / data.length; const ys = v => PT + ih * (1 - v / top);
  let g = "";
  [0, top / 2, top].forEach(v => { g += '<line class="grid" x1="' + PL + '" x2="' + (CW - PR) + '" y1="' + ys(v) + '" y2="' + ys(v) + '"/><text class="ax" x="' + (PL - 6) + '" y="' + (ys(v) + 4) + '" text-anchor="end">' + v + '</text>'; });
  data.forEach((p, i) => {
    if (p.sets == null) return;
    const last = i === data.length - 1;
    g += '<rect class="' + (last ? "bar last" : "bar") + '" x="' + (xs(i) - bw / 2) + '" y="' + ys(p.sets) + '" width="' + bw + '" height="' + (ys(0) - ys(p.sets)) + '" rx="3"/>';
    if (last) g += '<text class="val" x="' + xs(i) + '" y="' + (ys(p.sets) - 4) + '" text-anchor="middle">' + p.sets + '</text>';
  });
  return '<svg viewBox="0 0 ' + CW + ' ' + CH + '" role="img" aria-label="Séries por semana">' + g + xLabels(data, xs) + '</svg>';
}
function lineSVG(data) {
  const pts = data.map((p, i) => ({ i, v: p.load })).filter(p => p.v != null);
  if (!pts.length) return '<p class="note muted">Sem cargas anotadas para este grupo.</p>';
  let lo = Math.min(0, ...pts.map(p => p.v)), hi = Math.max(10, ...pts.map(p => p.v));
  lo = Math.floor(lo / 10) * 10; hi = Math.ceil(hi / 10) * 10;
  const iw = CW - PL - PR, ih = CH - PT - PB;
  const xs = i => PL + iw * (i + 0.5) / data.length; const ys = v => PT + ih * (1 - (v - lo) / (hi - lo));
  let g = "";
  [lo, 0, hi].filter((v, k, a) => a.indexOf(v) === k).forEach(v => { g += '<line class="' + (v === 0 ? "grid zero" : "grid") + '" x1="' + PL + '" x2="' + (CW - PR) + '" y1="' + ys(v) + '" y2="' + ys(v) + '"/><text class="ax" x="' + (PL - 6) + '" y="' + (ys(v) + 4) + '" text-anchor="end">' + (v > 0 ? "+" : "") + v + '%</text>'; });
  const path = pts.map((p, k) => (k ? "L" : "M") + xs(p.i).toFixed(1) + " " + ys(p.v).toFixed(1)).join(" ");
  const area = path + " L" + xs(pts[pts.length - 1].i).toFixed(1) + " " + ys(lo) + " L" + xs(pts[0].i).toFixed(1) + " " + ys(lo) + " Z";
  g += '<path class="area" d="' + area + '"/><path class="line" d="' + path + '"/>';
  pts.forEach((p, k) => { const last = k === pts.length - 1; g += '<circle class="' + (last ? "dot last" : "dot") + '" cx="' + xs(p.i) + '" cy="' + ys(p.v) + '" r="' + (last ? 4.5 : 3) + '"/>'; });
  const lp = pts[pts.length - 1];
  g += '<text class="val" x="' + Math.min(xs(lp.i), CW - PR - 14) + '" y="' + (ys(lp.v) - 8) + '" text-anchor="middle">' + (lp.v >= 0 ? "+" : "") + lp.v.toFixed(0) + '%</text>';
  return '<svg viewBox="0 0 ' + CW + ' ' + CH + '" role="img" aria-label="Carga em relação ao primeiro registro">' + g + xLabels(data, xs) + '</svg>';
}

/* ---------- Inteligência: dados ---------- */
const INTEL_KEY = "stek-intel-v1";
const UNITS = { exercicios: ["exercício", "exercícios"], modulos: ["módulo", "módulos"], aulas: ["aula", "aulas"], licoes: ["lição", "lições"], paginas: ["página", "páginas"], capitulos: ["capítulo", "capítulos"] };
const UNIT_OPTS = [["exercicios", "Exercícios"], ["modulos", "Módulos"], ["aulas", "Aulas"], ["licoes", "Lições"], ["paginas", "Páginas"], ["capitulos", "Capítulos"]];
const INTEL_TABS = [{ id: "estudo", label: "Hoje" }, { id: "estudo-progresso", label: "Progresso" }, { id: "materias", label: "Matérias" }];
let intel = null;
const intelConfirm = new Set();

function loadIntel() {
  try { const v = JSON.parse(localStorage.getItem(INTEL_KEY)); intel = v && Array.isArray(v.subjects) ? v : null; } catch (e) { intel = null; }
  if (intel) { intel.days = intel.days || {}; intel.goals = intel.goals || { week: 2, weekend: 4 }; }
}
function loadIntelDefaults() { if (intel) { intel.days = intel.days || {}; intel.goals = intel.goals || { week: 2, weekend: 4 }; } }
function saveIntel() {
  try { localStorage.setItem(INTEL_KEY, JSON.stringify(intel)); setStatus("Salvo no celular", "ok"); }
  catch (e) { setStatus("Não foi possível salvar neste navegador", "err"); }
}
function createIntel(withPreset) {
  intel = { version: 1, goals: { week: 2, weekend: 4 }, subjects: withPreset ? JSON.parse(JSON.stringify(STUDY_PRESET)) : [], days: {}, timer: null };
  saveIntel();
}
function unitWord(sub, n) { const u = UNITS[sub.unit] || UNITS.exercicios; return n === 1 ? u[0] : u[1]; }
function isWeekend(iso) { const [y, m, d] = iso.split("-").map(Number); const w = new Date(y, m - 1, d).getDay(); return w === 0 || w === 6; }
function goalSec(iso) { return Math.round((isWeekend(iso) ? intel.goals.weekend : intel.goals.week) * 3600); }
function getRec(day, sid) { return (intel.days[day] && intel.days[day][sid]) || { sec: 0, count: 0, theory: false }; }
function dayRec(day, sid) { intel.days[day] = intel.days[day] || {}; return intel.days[day][sid] = intel.days[day][sid] || { sec: 0, count: 0, theory: false }; }
function dayBounds(iso) { const [y, m, d] = iso.split("-").map(Number); const s = new Date(y, m - 1, d).getTime(); return [s, new Date(y, m - 1, d + 1).getTime()]; }
function runningSec(iso, sid) {
  const t = intel && intel.timer; if (!t || (sid && t.sid !== sid)) return 0;
  const [a, b] = dayBounds(iso); const s = Math.max(a, t.startedAt), e = Math.min(b, Date.now());
  return e > s ? Math.floor((e - s) / 1000) : 0;
}
function subjSec(iso, sid) { return getRec(iso, sid).sec + runningSec(iso, sid); }
function daySec(iso) { return intel.subjects.reduce((a, s) => a + subjSec(iso, s.id), 0); }
function subjDoneUpTo(sub, iso) { let n = sub.base || 0; Object.keys(intel.days).forEach(d => { if (!iso || d <= iso) n += getRec(d, sub.id).count || 0; }); return n; }
/* Plano de estudo de cada matéria: cronograma importado (sub.plan) ou meta própria (sub.goal):
   - prazo: terminar o total até uma data, nos dias da semana escolhidos (a meta do dia se ajusta ao que falta);
   - diaria: quantidade fixa por dia de estudo. */
function goalOf(sub) { return !sub.plan && sub.goal && (sub.goal.type === "prazo" || sub.goal.type === "diaria") ? sub.goal : null; }
function hasPlan(sub) { return !!(sub.plan || goalOf(sub)); }
function studyDay(sub, iso) { const g = goalOf(sub); if (!g) return false; const [y, m, d] = iso.split("-").map(Number); return (g.days || [1, 2, 3, 4, 5]).includes(new Date(y, m - 1, d).getDay()); }
function countStudyDays(sub, a, b) { let n = 0; for (let d = a, i = 0; d <= b && i < 1500; d = addDaysISO(d, 1), i++) if (studyDay(sub, d)) n++; return n; }
function goalTarget(sub, iso) {
  const g = goalOf(sub); if (!g || !studyDay(sub, iso) || (g.start && iso < g.start)) return null;
  const before = subjDoneUpTo(sub, addDaysISO(iso, -1));
  if (sub.total && before >= sub.total) return { qty: 0, left: 0, remaining: 0 };
  if (g.type === "diaria") return { qty: Math.max(1, g.qty || 1), remaining: sub.total ? sub.total - before : null };
  if (!sub.total || !g.end || iso > g.end) return null;
  const remaining = sub.total - before, left = countStudyDays(sub, iso, g.end);
  return { qty: Math.ceil(remaining / Math.max(1, left)), left, remaining };
}
function goalFinish(sub, iso) {
  const g = goalOf(sub); if (!g || g.type !== "diaria" || !sub.total) return null;
  let rem = sub.total - subjDoneUpTo(sub, iso), d = iso, i = 0;
  if (rem <= 0) return iso;
  while (rem > 0 && i < 1500) { d = addDaysISO(d, 1); i++; if (studyDay(sub, d)) rem -= Math.max(1, g.qty || 1); }
  return rem > 0 ? null : d;
}
function planFor(sub, iso) {
  if (sub.plan) { const p = sub.plan[iso]; return p ? { qty: p[0], items: p[1], theory: p[2] } : null; }
  const t = goalTarget(sub, iso); if (!t) return null;
  const u = n => n + " " + unitWord(sub, n);
  if (t.qty === 0) return { qty: 0, items: "", theory: "", doneAll: true };
  const g = goalOf(sub);
  const items = g.type === "prazo"
    ? u(t.qty) + " hoje para terminar até " + fmtDate(g.end).slice(0, 5) + ": faltam " + u(t.remaining) + " em " + t.left + (t.left === 1 ? " dia" : " dias") + " de estudo."
    : u(t.qty) + " por dia de estudo" + (t.remaining != null ? "; faltam " + u(t.remaining) + "." : ".");
  return { qty: t.qty, items, theory: "" };
}
function expectedUpTo(sub, iso) {
  if (sub.plan) { let n = sub.base || 0; Object.keys(sub.plan).forEach(d => { if (d <= iso) n += sub.plan[d][0]; }); return n; }
  const g = goalOf(sub); if (!g || !g.start) return subjDoneUpTo(sub, iso);
  const k = iso < g.start ? 0 : countStudyDays(sub, g.start, iso), s0 = g.startDone || 0;
  if (g.type === "diaria") return Math.min(sub.total || Infinity, s0 + k * Math.max(1, g.qty || 1));
  const L = Math.max(1, countStudyDays(sub, g.start, g.end));
  return Math.min(sub.total, Math.round(s0 + (sub.total - s0) * Math.min(k, L) / L));
}
function planRange(sub) {
  if (sub.plan) { const ks = Object.keys(sub.plan).sort(); return ks.length ? [ks[0], ks[ks.length - 1]] : null; }
  const g = goalOf(sub); if (!g || !g.start || !sub.total) return null;
  return [g.start, g.type === "prazo" ? g.end : (goalFinish(sub, todayISO()) || "9999-12-31")];
}
function nextExam(sub, iso) { return (sub.exams || []).filter(d => d >= iso).sort()[0] || null; }
function daysBetween(a, b) { return Math.round((dayBounds(b)[0] - dayBounds(a)[0]) / 86400000); }
function fmtHMS(sec) { const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0"); }
function fmtHM(sec) { const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60); return h ? h + "h" + String(m).padStart(2, "0") : m + " min"; }
function fmtGoal(sec) { const h = sec / 3600; return (Number.isInteger(h) ? h : h.toFixed(1).replace(".", ",")) + "h"; }

function addTime(startMs, endMs, sid) {
  let s = startMs;
  while (s < endMs) {
    const d = new Date(s); const next = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1).getTime();
    const e = Math.min(endMs, next);
    dayRec(ymd(d), sid).sec += Math.round((e - s) / 1000);
    s = e;
  }
}
function startTimer(sid) { if (intel.timer) stopTimer(true); intel.timer = { sid, startedAt: Date.now() }; saveIntel(); }
function stopTimer(silent) { const t = intel.timer; if (!t) return; addTime(t.startedAt, Date.now(), t.sid); intel.timer = null; if (!silent) saveIntel(); }

function subjTask(sub, iso) {
  const p = planFor(sub, iso); if (!p) return null;
  if (p.doneAll) return { done: 1, total: 1, complete: true, label: "Concluído", sub: "Total da matéria concluído." };
  const r = getRec(iso, sub.id);
  const needCount = p.qty > 0, needTheory = !!p.theory;
  const done = (needCount ? Math.min(r.count, p.qty) : 0) + (needTheory && r.theory ? 1 : 0);
  const total = (needCount ? p.qty : 0) + (needTheory ? 1 : 0);
  const complete = (!needCount || r.count >= p.qty) && (!needTheory || r.theory);
  let label = needCount ? Math.min(r.count, p.qty) + "/" + p.qty : (r.theory ? "Feita" : "Teoria");
  if (complete) label = "Concluído";
  const parts = [];
  if (p.theory) parts.push("Teoria: " + p.theory + (r.theory ? " (feita)" : ""));
  if (needCount) parts.push(sub.plan ? p.qty + " " + unitWord(sub, p.qty) + ": " + p.items : p.items);
  return { done, total, complete, label, sub: parts.join(" · ") };
}

function intelTasks() {
  if (!intel) return { setup: true, setupLabel: "Configurar", setupText: "Escolha suas matérias para começar a registrar os estudos.", tasks: [] };
  const iso = todayISO(); const tasks = [];
  const sec = daySec(iso), goal = goalSec(iso);
  tasks.push({ id: "task-tempo", title: "Tempo de estudo", live: "home-time", label: fmtHM(sec) + " / " + fmtGoal(goal),
    sub: (isWeekend(iso) ? "Fim de semana: " : "Dia útil: ") + "meta de " + fmtGoal(goal) + (sec >= goal ? ". Meta batida." : ". Faltam " + fmtHM(goal - sec) + "."),
    pct: Math.min(1, sec / goal), complete: sec >= goal, go: () => enterIntel("estudo") });
  intel.subjects.forEach(s => {
    const t = subjTask(s, iso); if (!t) return;
    tasks.push({ id: "task-" + s.id, title: s.name, label: t.label, sub: t.sub, pct: t.total ? t.done / t.total : 0, complete: t.complete, go: () => enterIntel("estudo", s.id) });
  });
  return { tasks };
}

function studySVG(rows) {
  const hs = rows.map(r => r.sec / 3600), gs = rows.map(r => r.goal / 3600);
  const top = Math.max(4, Math.ceil(Math.max(...hs, ...gs)));
  const iw = CW - PL - PR, ih = CH - PT - PB, n = rows.length, bw = Math.min(16, iw / n * 0.6);
  const xs = i => PL + iw * (i + 0.5) / n, ys = v => PT + ih * (1 - v / top);
  let g = "";
  [0, top / 2, top].forEach(v => { g += '<line class="grid" x1="' + PL + '" x2="' + (CW - PR) + '" y1="' + ys(v) + '" y2="' + ys(v) + '"/><text class="ax" x="' + (PL - 6) + '" y="' + (ys(v) + 4) + '" text-anchor="end">' + v + 'h</text>'; });
  rows.forEach((r, i) => {
    const h = hs[i], metG = r.sec >= r.goal;
    if (h > 0) g += '<rect class="' + (metG ? "bar last" : "bar") + '" x="' + (xs(i) - bw / 2) + '" y="' + ys(h) + '" width="' + bw + '" height="' + (ys(0) - ys(h)) + '" rx="2"/>';
    g += '<line class="goal" x1="' + (xs(i) - bw / 2 - 2) + '" x2="' + (xs(i) + bw / 2 + 2) + '" y1="' + ys(gs[i]) + '" y2="' + ys(gs[i]) + '"/>';
  });
  const step = 2;
  rows.forEach((r, i) => { if (i % step === (n - 1) % step) g += '<text class="ax" x="' + xs(i) + '" y="' + (CH - 6) + '" text-anchor="middle">' + fmtDate(r.iso).slice(0, 5) + '</text>'; });
  return '<svg viewBox="0 0 ' + CW + ' ' + CH + '" role="img" aria-label="Horas de estudo por dia nos últimos 14 dias">' + g + '</svg>';
}

function stBarsSVG(rows, aria) {
  const mx = Math.max(1, ...rows.map(r => Math.max(r.v, r.goal))) * 1.1;
  const top = mx <= 20 ? Math.ceil(mx / 10) * 10 : mx <= 100 ? Math.ceil(mx / 20) * 20 : Math.ceil(mx / 100) * 100;
  const iw = CW - PL - PR, ih = CH - PT - PB, n = rows.length, bw = Math.min(18, iw / n * 0.6);
  const xs = i => PL + iw * (i + 0.5) / n, ys = v => PT + ih * (1 - v / top);
  let g = "";
  [0, top / 2, top].forEach(v => { g += '<line class="grid" x1="' + PL + '" x2="' + (CW - PR) + '" y1="' + ys(v) + '" y2="' + ys(v) + '"/><text class="ax" x="' + (PL - 6) + '" y="' + (ys(v) + 4) + '" text-anchor="end">' + Math.round(v) + '</text>'; });
  rows.forEach((r, i) => {
    if (r.v > 0) g += '<rect class="' + (r.v >= r.goal ? "bar last" : "bar") + '" x="' + (xs(i) - bw / 2) + '" y="' + ys(r.v) + '" width="' + bw + '" height="' + (ys(0) - ys(r.v)) + '" rx="2"/>';
    g += '<line class="goal" x1="' + (xs(i) - bw / 2 - 2) + '" x2="' + (xs(i) + bw / 2 + 2) + '" y1="' + ys(r.goal) + '" y2="' + ys(r.goal) + '"/>';
  });
  const step = n > 8 ? 2 : 1;
  rows.forEach((r, i) => { if (i % step === (n - 1) % step) g += '<text class="ax" x="' + xs(i) + '" y="' + (CH - 6) + '" text-anchor="middle">' + r.label + '</text>'; });
  return '<svg viewBox="0 0 ' + CW + ' ' + CH + '" role="img" aria-label="' + aria + '">' + g + '</svg>';
}

/* ======================= Módulo Graça ======================= */
const GRACA_KEY = "stek-graca-v1";
const GRACA_TABS = [{ id: "gr-hoje", label: "Hoje" }, { id: "gr-progresso", label: "Progresso" }, { id: "gr-rituais", label: "Rituais" }];
const GR_SUGGEST = [["Rezar o Terço", 30, 1, [0, 1, 2, 3, 4, 5, 6]], ["Leitura da Bíblia", 15, 1, [0, 1, 2, 3, 4, 5, 6]], ["Oração da manhã", 10, 1, [0, 1, 2, 3, 4, 5, 6]]];
let graca = null;
const grUI = { msg: "", confirm: null, draft: null, edit: null };
let grLastLeft = null;

function loadGraca() {
  try { const v = JSON.parse(localStorage.getItem(GRACA_KEY)); graca = v && Array.isArray(v.rituals) ? v : null; } catch (e) { graca = null; }
  if (graca) { graca.days = graca.days || {}; }
  settleGraca();
}
function grData() { return graca || { rituals: [], days: {}, timer: null }; }
function ensureGraca() { if (!graca) graca = { version: 1, rituals: [], days: {}, timer: null }; return graca; }
function saveGraca() {
  try { localStorage.setItem(GRACA_KEY, JSON.stringify(graca)); setStatus("Salvo no celular", "ok"); }
  catch (e) { setStatus("Não foi possível salvar neste navegador", "err"); }
}
function ritual(id) { return grData().rituals.find(r => r.id === id); }
function grDow(iso) { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d).getDay(); }
function grScheduled(r, iso) { return (r.days || []).includes(grDow(iso)) && (!r.created || iso >= r.created); }
function grRec(iso, rid) { const d = grData().days[iso]; return (d && d[rid]) || { sec: 0, count: 0, cur: 0 }; }
function grRecW(iso, rid) { const g = ensureGraca(); g.days[iso] = g.days[iso] || {}; return g.days[iso][rid] = g.days[iso][rid] || { sec: 0, count: 0, cur: 0 }; }
function grLimit(r) { return r && r.limit ? Math.round(r.limit * 60) : 0; }
function grCap(t) { const r = ritual(t.rid), L = grLimit(r); return L ? Math.max(0, L - (t.startCur || 0)) : Infinity; }
function grRun(t) { return t ? Math.max(0, Math.min((Date.now() - t.startedAt) / 1000, grCap(t))) : 0; }
function grSec(iso, rid) {
  const t = grData().timer; let s = grRec(iso, rid).sec;
  if (t && t.rid === rid && t.day === iso) s += Math.floor(grRun(t));
  return s;
}
function grTodayPlan(iso) { return grData().rituals.filter(r => grScheduled(r, iso)); }
function grDayStats(iso) {
  const plan = grTodayPlan(iso);
  const need = plan.reduce((a, r) => a + Math.max(1, r.times || 1), 0);
  const done = plan.reduce((a, r) => a + Math.min(Math.max(1, r.times || 1), grRec(iso, r.id).count || 0), 0);
  return { plan, need, done, full: need > 0 && done >= need };
}
function grStreak(iso) {
  const [y, m, d] = iso.split("-").map(Number); let n = 0;
  for (let i = 0; i < 400; i++) {
    const st = grDayStats(ymd(new Date(y, m - 1, d - i)));
    if (!st.need) continue; // dia sem ritual marcado não quebra a sequência
    if (st.full) n++; else if (i === 0) continue; else break;
  }
  return n;
}

/* ---------- sessão (cronômetro) ---------- */
function grStart(rid) {
  const g = ensureGraca(); if (g.timer) grStop(false, true);
  const today = todayISO();
  g.timer = { rid, startedAt: Date.now(), day: today, startCur: grRec(today, rid).cur || 0 };
  grLastLeft = null; stSoundInit(); if (grLimit(ritual(rid))) stWakeOn();
  saveGraca();
}
// finish = true conta uma vez; false só pausa (o tempo fica guardado para continuar)
function grStop(finish, silent) {
  const g = graca, t = g && g.timer; if (!t) return;
  const run = Math.floor(grRun(t)), rec = grRecW(t.day, t.rid);
  rec.sec += run;
  if (finish) { rec.count = (rec.count || 0) + 1; rec.cur = 0; } else rec.cur = (t.startCur || 0) + run;
  g.timer = null; stWakeOff();
  if (!silent) saveGraca();
}
function settleGraca() {
  const t = graca && graca.timer; if (!t || !isFinite(grCap(t))) return false;
  if ((Date.now() - t.startedAt) / 1000 < grCap(t)) return false;
  grStop(true, true); saveGraca(); return true;
}

/* ---------- pendências da tela inicial ---------- */
function gracaTasks() {
  const iso = todayISO(), g = grData();
  if (!g.rituals.length) return { setup: true, setupLabel: "Criar ritual", setupText: "Crie seus rituais (oração, leitura, terço) com tempo, dias e quantas vezes por dia.", setupGo: () => enterGraca("gr-rituais"), tasks: [] };
  return { tasks: grTodayPlan(iso).map(r => {
    const need = Math.max(1, r.times || 1), c = grRec(iso, r.id).count || 0;
    return { id: "task-gr-" + r.id, title: r.name, complete: c >= need, pct: Math.min(1, c / need), live: "gr-home",
      label: c >= need ? "Concluído" : (need > 1 ? Math.min(c, need) + "/" + need : (r.limit ? r.limit + " min" : "Pendente")),
      sub: (r.limit ? r.limit + " min" : "Sem tempo limite") + (need > 1 ? " · " + need + " vezes hoje" : ""), go: () => enterGraca("gr-hoje", r.id) };
  }) };
}

/* ======================= Módulo Missões ======================= */
const MS_KEY = "stek-missoes-v1";
const MS_TABS = [{ id: "ms-hoje", label: "Hoje" }, { id: "ms-lista", label: "Missões" }, { id: "ms-relatorio", label: "Relatório" }];
const MS_PRI = [["alta", "Alta"], ["media", "Média"], ["baixa", "Baixa"]];
const MS_PRI_RANK = { alta: 0, media: 1, baixa: 2 };
const MS_GERAL = "_geral";
const MS_REC = [["", "Não repete"], ["util", "Todo dia útil"], ["diaria", "Todos os dias"], ["semanal", "Toda semana"], ["mensal", "Todo mês"]];
let mis = null;
const msUI = { open: null, closing: null, closeDraft: null, draft: null, period: "semana", proj: "", msg: "", confirm: null, q: "" };

function loadMs() {
  try { const v = JSON.parse(localStorage.getItem(MS_KEY)); mis = v && Array.isArray(v.tasks) ? v : null; } catch (e) { mis = null; }
  if (mis) {
    mis.goal = Object.assign({ hours: 4, days: [1, 2, 3, 4, 5] }, mis.goal); mis.days = mis.days || {};
    if (mis.work == null) mis.work = !!mis.timer;
  }
}
function msData() { return mis || { goal: { hours: 4, days: [1, 2, 3, 4, 5] }, tasks: [], days: {}, timer: null, work: false }; }
function ensureMs() { if (!mis) mis = { version: 1, goal: { hours: 4, days: [1, 2, 3, 4, 5] }, tasks: [], days: {}, timer: null, work: false }; return mis; }
function saveMs() {
  try { localStorage.setItem(MS_KEY, JSON.stringify(mis)); setStatus("Salvo no celular", "ok"); }
  catch (e) { setStatus("Não foi possível salvar neste navegador", "err"); }
}
function msTask(id) { return msData().tasks.find(t => t.id === id); }
function msDow(iso) { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d).getDay(); }
function msWorkDay(iso) { return msData().goal.days.includes(msDow(iso)); }
// a meta de horas só vale a partir do primeiro dia em que você usou o módulo
function msSince() {
  const g = msData(); let first = null;
  g.tasks.forEach(t => { if (t.created && (!first || t.created < first)) first = t.created; });
  Object.keys(g.days).forEach(d => { if (Object.values(g.days[d] || {}).some(v => v > 0) && (!first || d < first)) first = d; });
  if (g.timer) { const d = ymd(new Date(g.timer.startedAt)); if (!first || d < first) first = d; }
  return first || todayISO();
}
function msGoalSec(iso) { return msWorkDay(iso) && iso >= msSince() ? Math.round(msData().goal.hours * 3600) : 0; }
function msRun(iso, tid) {
  const t = msData().timer; if (!t || (tid && t.tid !== tid)) return 0;
  const [a, b] = dayBounds(iso); const s = Math.max(a, t.startedAt), e = Math.min(b, Date.now());
  return e > s ? Math.floor((e - s) / 1000) : 0;
}
function msSec(iso, tid) { const d = msData().days[iso]; return ((d && d[tid]) || 0) + msRun(iso, tid); }
function msDaySec(iso) { const d = msData().days[iso] || {}; return Object.keys(d).reduce((a, k) => a + (d[k] || 0), 0) + msRun(iso); }
function msTaskSec(tid) {
  const g = msData(); let s = Object.keys(g.days).reduce((a, d) => a + ((g.days[d] && g.days[d][tid]) || 0), 0);
  if (g.timer && g.timer.tid === tid) s += Math.floor((Date.now() - g.timer.startedAt) / 1000);
  return s;
}
function msAddTime(a, b, tid) {
  let x = a;
  while (x < b) {
    const dt = new Date(x); const next = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() + 1).getTime(); const e = Math.min(b, next);
    const iso = ymd(dt); mis.days[iso] = mis.days[iso] || {}; mis.days[iso][tid] = (mis.days[iso][tid] || 0) + Math.round((e - x) / 1000); x = e;
  }
}
/* Cronômetros: só um roda por vez.
   - Trabalho (geral) roda enquanto o expediente está ligado (mis.work) e nenhuma missão está rodando.
   - Ao iniciar uma missão, o Trabalho pausa e o tempo passa a contar na missão; ao pausar ou concluir a missão, o Trabalho volta.
   - Pausar o Trabalho encerra o expediente: para tudo até você iniciar de novo (ou iniciar uma missão). */
function msStop(silent) {
  const t = mis && mis.timer; if (!t) return;
  msAddTime(t.startedAt, Date.now(), t.tid); mis.timer = null;
  if (!silent) saveMs();
}
function msResumeWork() { if (mis && mis.work && !mis.timer) mis.timer = { tid: MS_GERAL, startedAt: Date.now() }; }
function msStartMission(tid) {
  const g = ensureMs(); if (g.timer) msStop(true);
  g.work = true; g.timer = { tid, startedAt: Date.now() };
  const t = msTask(tid); if (t && !t.started) { t.started = todayISO(); t.upd = Date.now(); }
  saveMs();
}
function msPauseMission() { msStop(true); msResumeWork(); saveMs(); }
function msWorkStart() { const g = ensureMs(); g.work = true; msResumeWork(); saveMs(); }
function msWorkPause() { const g = ensureMs(); msStop(true); g.work = false; saveMs(); }
function msMissionRunning() { const t = msData().timer; return t && t.tid !== MS_GERAL ? t.tid : null; }

/* ---------- recorrência ---------- */
function msRecMatch(rec, iso) {
  const w = msDow(iso);
  if (rec.type === "util") return w >= 1 && w <= 5;
  if (rec.type === "diaria") return true;
  if (rec.type === "semanal") return (rec.days && rec.days.length ? rec.days : [1]).includes(w);
  if (rec.type === "mensal") { const [y, m, d] = iso.split("-").map(Number); const last = new Date(y, m, 0).getDate(); return d === Math.min(rec.mday || 1, last); }
  return false;
}
function msRecNext(rec, fromIso, inclusive) { let d = inclusive ? fromIso : addDaysISO(fromIso, 1); for (let i = 0; i < 800; i++, d = addDaysISO(d, 1)) if (msRecMatch(rec, d)) return d; return null; }
function msRecLabel(rec) {
  if (!rec || !rec.type) return "";
  if (rec.type === "semanal") return "Toda " + [1, 2, 3, 4, 5, 6, 0].filter(w => (rec.days || [1]).includes(w)).map(w => DOW_SHORT[w]).join(", ");
  if (rec.type === "mensal") return "Todo dia " + (rec.mday || 1);
  return (MS_REC.find(r => r[0] === rec.type) || [, ""])[1];
}
// ao encerrar uma missão recorrente, cria a próxima
function msSpawnNext(x) {
  if (!x.rec || !x.rec.type) return null;
  const base = x.due && x.due > todayISO() ? x.due : todayISO();
  const due = msRecNext(x.rec, base, false); if (!due) return null;
  const n = msNew({ title: x.title, proj: x.proj, setor: x.setor, sol: x.sol, pri: x.pri, est: x.est, notes: x.notes, rec: Object.assign({}, x.rec), due, prev: x.id }, true);
  x.nextId = n.id; return n;
}

function msDueInfo(t, iso) {
  if (!t.due) return null;
  if (t.status === "nao") return null;
  if (t.status !== "aberta") {
    const late = daysBetween(t.due, t.closed || iso);
    return late > 0 ? { cls: "pend", text: "Entregue com " + late + (late === 1 ? " dia" : " dias") + " de atraso" } : { cls: "ok", text: "Entregue no prazo" };
  }
  const dd = daysBetween(iso, t.due), rec = t.rec && t.rec.type;
  if (dd < 0) return { cls: "bad", text: "Atrasada " + (-dd) + (dd === -1 ? " dia" : " dias") };
  if (dd === 0) return { cls: "pend", text: rec ? "Executar hoje" : "Vence hoje" };
  if (dd === 1) return { cls: "", text: rec ? "Executar amanhã" : "Vence amanhã" };
  return { cls: "", text: (rec ? "Executar " : "Prazo ") + fmtDate(t.due).slice(0, 5) };
}
function msSort(a, b) {
  const da = a.due || "9999", db = b.due || "9999";
  return (MS_PRI_RANK[a.pri] ?? 1) - (MS_PRI_RANK[b.pri] ?? 1) || (da < db ? -1 : da > db ? 1 : 0) || (a.created < b.created ? -1 : 1);
}
// Missões do dia: planejadas para o dia, vencendo ou atrasadas (abertas) e as encerradas no próprio dia
function msDayList(iso) {
  const today = todayISO();
  return msData().tasks.filter(t => {
    if (t.status === "aberta") return (t.plan || []).includes(iso) || (iso === today && t.due && t.due <= iso) || (iso > today && t.due === iso);
    return t.closed === iso;
  }).sort((a, b) => (a.status === "aberta" ? 0 : 1) - (b.status === "aberta" ? 0 : 1) || msSort(a, b));
}
function msVals(k) { return [...new Set(msData().tasks.map(t => (t[k] || "").trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, "pt")); }
function msProjects() { return msVals("proj"); }
function msNorm(v) { return String(v || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
function msMatch(x) {

  const list = msDayList(iso);

function msCard(x, n, iso) {

  const meta = el("div", "meta");

  const dinf = msDueInfo(x, open ? iso : x.closed); if (dinf) meta.appendChild(msChip(dinf.text, dinf.cls));
  if (!open) meta.appendChild(msChip(x.status === "feita" ? "Resolvida" : "Não resolvida", x.status === "feita" ? "ok" : "bad"));

    const trow = el("div", "timer-row" + (running ? " running" : ""));
    const td = el("button", "timer ms-timer", fmtHMS(msSec(iso, x.id))); td.type = "button"; td.id = "ms-tmr-" + x.id; td.dataset.tid = x.id;
    td.setAttribute("aria-label", (running ? "Pausar" : "Iniciar") + " o cronômetro de " + x.title);
    if (running) td.dataset.live = "ms-mtime";
    const toggle = () => { if (running) msPauseMission(); else msStartMission(x.id); renderMissoes(); };
    td.addEventListener("click", toggle);
    const tb = el("div", "timer-btns");
    const go = el("button", "btn" + (running ? " stop" : ""), running ? "Pausar" : "▶ Iniciar"); go.type = "button"; go.id = "ms-go-" + x.id;
    go.addEventListener("click", toggle);

  if (running) { tv.dataset.live = "ms-task"; tv.dataset.tid = x.id; tv.dataset.est = String(x.est || 0); }
  line.appendChild(tv);

  card.appendChild(line);
  if (!open && x.closeNote) card.appendChild(el("p", "ex-note", x.closeNote));

  if (open && msUI.closing === x.id) { card.appendChild(msCloseForm(x, iso)); return card; }
  const b = el("div", "btns");

    if (iso <= today) {
      const fin = el("button", "btn", "Concluir"); fin.type = "button"; fin.id = "ms-fin-" + x.id;
      fin.addEventListener("click", () => { msUI.closing = x.id; renderMissoes(); const c = document.getElementById("ms-" + x.id); if (c) c.scrollIntoView({ block: "nearest" }); });
      b.appendChild(fin);
    }
    if ((x.plan || []).includes(iso)) {
      const rm = el("button", "btn ghost", "Tirar do dia"); rm.type = "button"; rm.id = "ms-unplan-" + x.id;
      rm.addEventListener("click", () => { x.plan = (x.plan || []).filter(q => q !== iso); msTouch(x); renderMissoes(); });
      b.appendChild(rm);
    }
  } else {
    const re = el("button", "btn ghost", "Reabrir"); re.type = "button"; re.id = "ms-reopen-" + x.id;
    re.addEventListener("click", () => msReopen(x));
    b.appendChild(re);

  card.appendChild(b);
  return card;
}
function msReopen(x) {
  const g = ensureMs(), today = todayISO();
  // se a próxima ocorrência criada por ela ainda não foi mexida, sai junto
  const nx = x.nextId && msTask(x.nextId);
  if (nx && nx.status === "aberta" && !msTaskSec(nx.id) && !(nx.plan || []).length) g.tasks = g.tasks.filter(q => q.id !== nx.id);

  x.status = "aberta"; delete x.closed; delete x.quality; delete x.rework; delete x.closeNote;

  msTouch(x); renderMissoes();
}

function msPeriod(k) {
  const today = todayISO(), [y, m, d] = today.split("-").map(Number);
  if (k === "mes") return [ymd(new Date(y, m - 1, 1)), today, "Este mês"];
  if (k === "mespass") return [ymd(new Date(y, m - 2, 1)), ymd(new Date(y, m - 1, 0)), "Mês passado"];
  if (k === "30") return [addDaysISO(today, -29), today, "Últimos 30 dias"];
  return [weekStart(today), today, "Esta semana"];
}
function msHoursSVG(rows) {
  const hs = rows.map(r => r.sec / 3600), gs = rows.map(r => r.goal / 3600);
  const top = Math.max(4, Math.ceil(Math.max(...hs, ...gs, 1)));
  const iw = CW - PL - PR, ih = CH - PT - PB, n = rows.length, bw = Math.min(16, iw / n * 0.6);
  const xs = i => PL + iw * (i + 0.5) / n, ys = v => PT + ih * (1 - v / top);
  let g = "";
  [0, top / 2, top].forEach(v => { g += '<line class="grid" x1="' + PL + '" x2="' + (CW - PR) + '" y1="' + ys(v) + '" y2="' + ys(v) + '"/><text class="ax" x="' + (PL - 6) + '" y="' + (ys(v) + 4) + '" text-anchor="end">' + (Number.isInteger(v) ? v : v.toFixed(1).replace(".", ",")) + 'h</text>'; });
  rows.forEach((r, i) => {
    if (hs[i] > 0) g += '<rect class="' + (r.goal && r.sec >= r.goal ? "bar last" : "bar") + '" x="' + (xs(i) - bw / 2) + '" y="' + ys(hs[i]) + '" width="' + bw + '" height="' + (ys(0) - ys(hs[i])) + '" rx="2"/>';
    if (r.goal) g += '<line class="goal" x1="' + (xs(i) - bw / 2 - 2) + '" x2="' + (xs(i) + bw / 2 + 2) + '" y1="' + ys(gs[i]) + '" y2="' + ys(gs[i]) + '"/>';
  });
  const step = Math.max(1, Math.ceil(n / 8));
  rows.forEach((r, i) => { if (i % step === (n - 1) % step) g += '<text class="ax" x="' + xs(i) + '" y="' + (CH - 6) + '" text-anchor="middle">' + fmtDate(r.iso).slice(0, 5) + '</text>'; });
  return '<svg viewBox="0 0 ' + CW + ' ' + CH + '" role="img" aria-label="Horas trabalhadas por dia">' + g + '</svg>';
}

/* ---------- agregados ---------- */
function monthAgg(k) {

    a.n++;

  return ks.sort();

    let est;

/* ---------- investimentos ---------- */
function positions() {
  const pos = {};
  fin.invest.ops.slice().sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0).forEach(o => {
    const p = pos[o.ticker] = pos[o.ticker] || { ticker: o.ticker, qty: 0, cost: 0, bought: 0, divs: 0, realized: 0 };

    else if (o.type === "venda") { const pm = p.qty ? p.cost / p.qty : 0; const q = Math.min(o.qty, p.qty); p.cost -= q * pm; p.qty -= q; p.realized += q * (o.price - pm); }

async function syncOF() {

  const full = (fin.of.v || 1) < 2;
  const from = fin.of.lastTo && !full ? addDaysISO(fin.of.lastTo, -7) : (fin.of.from || ofDefaultFrom());
  try {
    const data = await ofRequest("/transactions?from=" + from);
    const list = (data.transactions || []).filter(t => t.date && typeof t.amount === "number" && t.amount !== 0).map(t => ({
      id: uid(), extId: "pluggy:" + t.id, date: t.date, desc: cleanDesc(t.description), memo: t.description,

const OF_PENDING = "stek-of-pending";
function notePending(id) { try { if (id) localStorage.setItem(OF_PENDING, JSON.stringify({ id, at: Date.now() })); } catch (e) {} }
async function linkItem(id) {

async function resumePendingLink() {

function pluggyErr(err) {

      onEvent: ev => { const it = ev && (ev.item || (ev.data && ev.data.item) || (ev.payload && ev.payload.item)); if (it && it.id) notePending(it.id); },

function finTasks() {
  if (!fin.tx.length && !fin.invest.ops.length) return { setup: true, setupLabel: "Importar extrato", setupText: "Importe o extrato do banco ou da sua planilha para começar a acompanhar seu dinheiro.", tasks: [] };
  const tasks = [];
  const pend = fin.tx.filter(t => t.status !== "done");
  if (pend.length) {
    const tot = pend.filter(t => t.dir === "out").reduce((s, t) => s + t.amount, 0);
    tasks.push({ id: "task-classificar", title: "Classificar lançamentos", label: pend.length + (pend.length === 1 ? " pendente" : " pendentes"), sub: brl(tot) + " em saídas esperando classificação.", pct: 0, complete: false, go: () => enterFin("fin-pendentes") });
  }
  const s = sobraInfo();
  if (s && s.sobra > 0) tasks.push({ id: "task-investir", title: "Investir a sobra de " + monthLabel(s.prev).split("/")[0], label: s.complete ? "Concluído" : brl(s.invested) + " / " + brl(s.sobra), sub: s.flag === "skip" ? "Você decidiu pular este mês." : "Sobrou " + brl(s.sobra) + " no mês passado. Transforme a sobra em aporte.", pct: Math.min(1, s.invested / s.sobra), complete: s.complete, go: () => enterFin("fin-invest") });
  return { tasks, free: !tasks.length, freeText: fin.tx.length ? "Nenhum lançamento para classificar." : "Importe um extrato para começar a acompanhar seu dinheiro." };
}

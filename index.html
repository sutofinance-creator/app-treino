<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STEK</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png?v=4">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=4">
<meta name="theme-color" content="#07040d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="STEK">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Exo+2:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Tema: HUD de RPG escuro. Painéis com cantos chanfrados e brilho azul; uma coluna, celular primeiro. */
:root {
  --bg: #07040d;
  --surface: rgba(17, 10, 33, 0.9);
  --surface-2: rgba(29, 17, 54, 0.92);
  --ink: #efe6ff;
  --muted: #9d8fbd;
  --line: #35245e;
  --accent: #b07cff;
  --accent-soft: rgba(166, 107, 255, 0.12);
  --glow: 0 0 0 1px rgba(166, 107, 255, .55), 0 0 18px rgba(166, 107, 255, .22), inset 0 0 22px rgba(166, 107, 255, .07);
  --good: #3cf0a5;
  --good-soft: rgba(60, 240, 165, 0.12);
  --warn: #ffc24b;
  --bad: #ff5c7a;
  --font-display: "Rajdhani", "Arial Narrow", sans-serif;
  --font-body: "Exo 2", system-ui, -apple-system, "Segoe UI", sans-serif;
  --cut: 12px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
html { background: #07040d; }
body {
  background:
    radial-gradient(900px 500px at 50% -120px, rgba(122, 52, 255, .24), transparent 70%),
    repeating-linear-gradient(0deg, rgba(166, 107, 255, .035) 0 1px, transparent 1px 4px),
    var(--bg);
  background-attachment: fixed;
  color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45;
}
.panel, .card, .guide, .datebar, .banner {
  background: var(--surface);
  clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
  border: 1px solid rgba(166, 107, 255, .38);
  box-shadow: var(--glow);
  position: relative;
}
.card::before, .guide::before {
  content: ""; position: absolute; left: var(--cut); right: 30%; top: 0; height: 2px;
  background: linear-gradient(90deg, var(--accent), transparent);
}
header.top { position: sticky; top: 0; z-index: 5; background: rgba(4, 6, 12, .92); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px 2px; max-width: 720px; margin: 0 auto; }
.brand h1 img { border-radius: 8px; }
.brand h1 { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: .08em; text-transform: uppercase; margin: 0; white-space: nowrap; text-shadow: 0 0 12px rgba(166, 107, 255, .55); }
#status { font-size: 12px; color: var(--muted); white-space: nowrap; letter-spacing: .04em; }
#status.ok { color: var(--good); }
#status.err { color: var(--warn); }
nav.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px 10px; max-width: 720px; margin: 0 auto; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button { flex: 0 0 auto; font: 600 15px var(--font-display); letter-spacing: .08em; text-transform: uppercase; padding: 7px 14px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%); }
nav.tabs button[aria-selected="true"] { color: var(--bg); background: var(--accent); border-color: var(--accent); box-shadow: 0 0 14px rgba(166, 107, 255, .6); }
main { max-width: 720px; margin: 0 auto; padding: 16px 16px calc(48px + env(safe-area-inset-bottom)); display: grid; gap: 14px; }
.banner { padding: 12px 14px; font-size: 14px; }
.wk-head { display: grid; gap: 4px; }
.wk-head h2 { font-family: var(--font-display); font-weight: 700; font-size: 30px; text-transform: uppercase; margin: 0; letter-spacing: .1em; text-wrap: balance; }
.wk-head h2::before { content: "◆ "; color: var(--accent); font-size: .6em; vertical-align: middle; text-shadow: 0 0 8px var(--accent); }
.wk-head p { margin: 0; color: var(--muted); }
.datebar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; }
.datebar label { font-family: var(--font-display); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 14px; }
.datebar input { font: 500 16px var(--font-body); color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); padding: 6px 8px; color-scheme: dark; }
.datebar .hint { font-size: 13px; color: var(--muted); }
.card { padding: 16px 14px 14px; display: grid; gap: 10px; }
.card-top { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; }
.num { font-family: var(--font-display); font-weight: 700; font-size: 24px; color: var(--accent); line-height: 1.05; font-variant-numeric: tabular-nums; text-shadow: 0 0 10px rgba(166, 107, 255, .6); }
.ex-name { font-weight: 600; margin: 0; }
.ex-note { font-size: 13px; color: var(--muted); margin: 2px 0 0; }
.howto { display: inline-block; margin-top: 6px; font: 600 13px var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); text-decoration: none; padding: 4px 10px; border: 1px solid rgba(166, 107, 255, .5); background: var(--accent-soft); }
.howto:active { opacity: .7; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; }
.presc { font-family: var(--font-display); font-weight: 600; font-size: 16px; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.chip { font: 700 12px var(--font-display); letter-spacing: .1em; text-transform: uppercase; padding: 2px 8px; background: var(--good-soft); color: var(--good); border: 1px solid var(--good); box-shadow: 0 0 10px rgba(60, 240, 165, .35); }
.chip::before { content: "▲ "; }
.last { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.last b { color: var(--ink); font-weight: 600; }
.inputs { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 8px; }
.field { display: grid; gap: 4px; }
.field label { font: 600 12px var(--font-display); color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
.field input { width: 100%; font: 600 20px var(--font-body); font-variant-numeric: tabular-nums; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); padding: 8px 10px; }
.field input:focus { border-color: var(--accent); box-shadow: 0 0 12px rgba(166, 107, 255, .4); outline: none; }
.field input:disabled { opacity: .55; }
input:focus-visible, button:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
details summary { cursor: pointer; font: 600 14px var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.hist { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; font-size: 14px; font-variant-numeric: tabular-nums; }
.hist li { display: flex; justify-content: space-between; border-bottom: 1px dashed var(--line); padding: 4px 0; }
.hist li span:first-child { color: var(--muted); }
.guide { padding: 18px 16px 16px; display: grid; gap: 10px; }
.guide h3 { font-family: var(--font-display); font-weight: 700; font-size: 22px; text-transform: uppercase; margin: 0; letter-spacing: .1em; }
.sec-head { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; }
.add-box { display: grid; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.guide p, .guide li { max-width: 65ch; }
.guide ul { margin: 0; padding-left: 18px; display: grid; gap: 8px; }
.guide li::marker { color: var(--accent); }
.week { width: 100%; border-collapse: collapse; font-size: 15px; }
.week td { padding: 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.week td:first-child { font-family: var(--font-display); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); width: 96px; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; }
a.btn { text-decoration: none; display: inline-flex; align-items: center; }
.ms-att { display: grid; gap: 6px; margin: 8px 0; }
.ms-att-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.ms-att-list li { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; border: 1px solid var(--line); padding: 6px 10px; }
.ms-att-link, .ms-att-file { color: var(--accent); text-decoration: underline; word-break: break-word; font-size: 14px; text-align: left; }
.ms-att-sub { color: var(--muted); font-size: 12px; }
.ms-att-rm { margin-left: auto; background: none; border: 1px solid var(--line); color: var(--muted); cursor: pointer; padding: 2px 8px; font: inherit; }
.ms-att-rm:hover { color: var(--bad); border-color: var(--bad); }
.ms-att .note { margin: 0; }
.fcat-list { display: grid; gap: 0; }
.fshare { border: 1px solid var(--line); background: var(--surface); margin: 8px 0; padding: 10px 12px; display: grid; gap: 6px; justify-items: start; }
.fshare-pick { background: none; border: 0; padding: 0; display: grid; gap: 4px; justify-items: start; }
.fshare-pick b { color: var(--ink); font-family: var(--font-display); font-size: 17px; letter-spacing: .05em; text-transform: uppercase; }
.fshare .note { margin: 0; }
.fimp-w { border: 1px solid var(--line); padding: 10px 12px; margin: 10px 0; display: grid; gap: 6px; }
.fimp-w > b { color: var(--accent); font-family: var(--font-display); letter-spacing: .05em; }
.fimp-w .note { margin: 0; }
.fimp-ex { margin: 0; padding-left: 18px; font-size: 13px; display: grid; gap: 3px; }
.pdf-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pdf-btns .btn { justify-content: center; text-align: center; font-size: 13px; letter-spacing: .05em; padding: 10px 8px; display: flex; align-items: center; }
.btn { font: 600 15px var(--font-display); letter-spacing: .08em; text-transform: uppercase; padding: 10px 14px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); cursor: pointer; }
.pick { text-align: left; color: var(--ink); font: inherit; cursor: pointer; width: 100%; }
.pick .chip::before { content: ""; }
.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 560px) { .tiles { grid-template-columns: repeat(4, 1fr); } }
.tile { background: var(--surface-2); border: 1px solid var(--line); padding: 10px 12px; display: grid; gap: 2px; align-content: start; }
.tile-label { font: 600 12px var(--font-display); color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
.tile-num { font-family: var(--font-display); font-weight: 700; font-size: 38px; line-height: 1; font-variant-numeric: tabular-nums; }
.tile-sub { font-size: 13px; color: var(--muted); }
.tile.good { border-color: var(--good); box-shadow: 0 0 12px rgba(60, 240, 165, .25); }
.tile.good .tile-num { color: var(--good); text-shadow: 0 0 10px rgba(60, 240, 165, .5); }
.tile.warn { border-color: var(--warn); }
.tile.warn .tile-num { color: var(--warn); }
.tile.bad { border-color: var(--bad); box-shadow: 0 0 12px rgba(255, 92, 122, .25); }
.tile.bad .tile-num, .tile.bad .tile-sub { color: var(--bad); }
.stepper { display: flex; align-items: center; gap: 8px; }
.step { width: 32px; height: 32px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); font: 700 18px var(--font-body); cursor: pointer; }
.note { margin: 0; font-size: 15px; }
.note.muted { font-size: 13px; color: var(--muted); }
.pdf-days { display: grid; gap: 6px; font-size: 13px; max-height: 320px; overflow: auto; }
.pdf-day { display: grid; grid-template-columns: 46px 1fr; gap: 8px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; }
.pdf-day b { color: var(--accent); font-family: var(--font-display); letter-spacing: .05em; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; max-width: 360px; }
.cal-h { text-align: center; font: 600 12px var(--font-display); color: var(--muted); letter-spacing: .1em; }
.cal-d { text-align: center; font-size: 13px; padding: 6px 0; font-variant-numeric: tabular-nums; border: 1px solid transparent; }
.cal-d.done { background: var(--accent); color: var(--bg); font-weight: 700; box-shadow: 0 0 10px rgba(166, 107, 255, .5); }
.cal-d.plan { border: 1px dashed var(--accent); }
.cal-d.miss { color: var(--bad); opacity: .7; text-decoration: line-through; }
.cal-d.today { outline: 2px solid var(--ink); outline-offset: -2px; }
button.cal-d { appearance: none; font: inherit; font-size: 13px; color: inherit; background: none; cursor: pointer; }
button.cal-d:hover { border-color: var(--accent); }
button.cal-d:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.step:disabled { opacity: .35; cursor: not-allowed; }
.linkbtn { appearance: none; background: none; border: 0; padding: 0; font: inherit; color: var(--accent); text-decoration: underline; cursor: pointer; text-align: left; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 13px; color: var(--muted); }
.lg { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 14px; height: 14px; display: inline-block; border: 1px solid transparent; }
.sw.done { background: var(--accent); }
.sw.plan { border: 1px dashed var(--accent); }
.sw.miss { background: var(--bad); opacity: .6; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.gchip { font: 600 14px var(--font-display); letter-spacing: .06em; text-transform: uppercase; padding: 5px 12px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); cursor: pointer; }
.gchip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 10px rgba(166, 107, 255, .35); }
.chart-t { margin: 6px 0 0; font: 600 13px var(--font-display); letter-spacing: .1em; text-transform: uppercase; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .grid.zero { stroke: var(--muted); stroke-dasharray: 3 3; }
.chart .ax { fill: var(--muted); font: 10px var(--font-body); }
.chart .val { fill: var(--ink); font: 700 12px var(--font-display); }
.chart .bar { fill: var(--accent); opacity: .35; }
.chart .bar.last { opacity: 1; filter: drop-shadow(0 0 6px rgba(166, 107, 255, .8)); }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; filter: drop-shadow(0 0 4px rgba(166, 107, 255, .7)); }
.chart .area { fill: var(--accent); opacity: .1; }
.chart .dot { fill: var(--bg); stroke: var(--accent); stroke-width: 2; }
.chart .dot.last { fill: var(--accent); }
@media (prefers-reduced-motion: no-preference) {
  nav.tabs button, .gchip { transition: background .15s, color .15s, box-shadow .15s; }
  .card, .guide { animation: rise .35s ease both; }
  @keyframes rise { from { transform: translateY(6px); } to { transform: none; } }
}

/* ---------- Tela inicial: módulos ---------- */
.home-btn { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; margin: 0; color: inherit; font: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; }
.crumb { font-size: 15px; color: var(--muted); letter-spacing: .1em; }
.crumb:empty { display: none; }
.mods { display: grid; gap: 14px; }
@media (min-width: 640px) { .mods { grid-template-columns: 1fr 1fr; align-items: start; } }
.module { display: grid; }
.mod-head { display: grid; grid-template-columns: 1fr auto; }
.mod-enter { display: grid; grid-template-columns: 50px 1fr; gap: 14px; align-items: center; padding: 16px 8px 16px 16px; background: none; border: 0; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.mod-enter:disabled { cursor: default; }
.mod-ico { width: 50px; height: 50px; display: grid; place-items: center; border: 1px solid var(--line); background: var(--accent-soft); color: var(--accent); clip-path: polygon(9px 0, 100% 0, 100% calc(100% - 9px), calc(100% - 9px) 100%, 0 100%, 0 9px); }
.mod-ico svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 5px rgba(166, 107, 255, .8)); }
.mod-name { display: block; font: 700 22px var(--font-display); letter-spacing: .12em; text-transform: uppercase; }
.mod-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 4px; font-size: 13px; color: var(--muted); }
.st { font: 700 12px var(--font-display); letter-spacing: .1em; text-transform: uppercase; padding: 2px 8px; border: 1px solid var(--line); color: var(--muted); }
.st.pend { color: var(--warn); border-color: var(--warn); box-shadow: 0 0 10px rgba(255, 194, 75, .3); }
.st.ok { color: var(--good); border-color: var(--good); box-shadow: 0 0 10px rgba(60, 240, 165, .3); }
.mod-toggle { width: 54px; border: 0; border-left: 1px solid var(--line); background: none; color: var(--accent); cursor: pointer; display: grid; place-items: center; }
.mod-toggle svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.mod-toggle[aria-expanded="true"] svg { transform: rotate(180deg); }
.mod-body { border-top: 1px solid var(--line); padding: 12px 16px 16px; display: grid; gap: 10px; }
.mod-body[hidden] { display: none; }
.module.soon .mod-ico { color: var(--muted); }
.module.soon .mod-ico svg { filter: none; }
.module.soon .mod-name { color: var(--muted); }
.task { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; width: 100%; text-align: left; font: inherit; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-left: 3px solid var(--warn); padding: 10px 12px; cursor: pointer; }
.task.done { border-left-color: var(--good); }
.task.opt { border-left-color: var(--muted); }
.task-t { font: 700 17px var(--font-display); letter-spacing: .06em; text-transform: uppercase; }
.task-s { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
.task-n { font: 700 14px var(--font-display); letter-spacing: .06em; color: var(--warn); font-variant-numeric: tabular-nums; }
.task.done .task-n { color: var(--good); }
.task.opt .task-n { color: var(--muted); }
.task-bar { grid-column: 1 / -1; height: 4px; background: var(--bg); border: 1px solid var(--line); overflow: hidden; }
.task-bar > span { display: block; height: 100%; background: var(--warn); }
.task.done .task-bar > span { background: var(--good); }
.task.opt .task-bar > span { background: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .mod-toggle svg { transition: transform .2s ease; } .module { animation: rise .35s ease both; } }

/* ---------- Módulo Inteligência ---------- */
.tiles.tiles-3 { grid-template-columns: repeat(3, 1fr); }
.tiles.tiles-3 .tile-num { font-size: 30px; white-space: nowrap; }
@media (max-width: 460px) { body:not([data-view="home"]) #status { display: none; } .crumb { font-size: 13px; } }
.goalbar { position: relative; height: 10px; background: var(--surface-2); border: 1px solid var(--line); }
.goalbar > span { display: block; height: 100%; background: linear-gradient(90deg, #6a2bff, var(--accent)); box-shadow: 0 0 10px rgba(166, 107, 255, .6); }
.goalbar.thin { height: 6px; }
.goalbar > i { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--ink); }
.timer-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--line); }
.timer-row.running { border-color: var(--accent); box-shadow: 0 0 14px rgba(166, 107, 255, .35); }
.timer { font: 700 34px var(--font-display); letter-spacing: .06em; font-variant-numeric: tabular-nums; line-height: 1; }
.timer-row.running .timer { color: var(--accent); text-shadow: 0 0 12px rgba(166, 107, 255, .6); }
.timer-btns { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.step.wide { width: auto; padding: 0 10px; font: 600 13px var(--font-display); letter-spacing: .06em; }
.btn.stop { background: var(--accent); color: var(--bg); box-shadow: 0 0 14px rgba(166, 107, 255, .6); }
.btn.danger { border-color: var(--bad); color: var(--bad); background: transparent; }
.plan { display: grid; gap: 6px; padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--accent-soft); }
.plan-t { font: 700 12px var(--font-display); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.plan-items { margin: 0; font-size: 15px; }
.theory { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; cursor: pointer; }
.theory input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: #b07cff; flex: 0 0 auto; }
.count-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.field-l { font: 600 13px var(--font-display); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.count-in { width: 64px; text-align: center; font: 700 20px var(--font-body); font-variant-numeric: tabular-nums; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); padding: 4px 6px; }
.subj-prog, .subj-sum { display: grid; gap: 6px; }

/* ---------- Início: hexágono dos atributos ---------- */
.hex-card { padding: 14px 14px 12px; display: grid; gap: 8px; }
.hex-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

.hex-idx { font: 600 13px var(--font-display); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }

.hex-svg { width: 100%; max-width: 440px; height: auto; display: block; margin: 0 auto; }
.hx-ring { fill: none; stroke: var(--line); stroke-width: 1; }

.hx-you { fill: rgba(166, 107, 255, .26); stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; filter: drop-shadow(0 0 6px rgba(166, 107, 255, .8)); }
.hx-dot { fill: var(--bg); stroke: var(--accent); stroke-width: 2; }
.hx-ax.sel .hx-dot { fill: var(--accent); }
.hx-name { font: 700 12px var(--font-display); letter-spacing: .08em; fill: var(--ink); }
.hx-pct { font: 700 14px var(--font-display); fill: var(--accent); font-variant-numeric: tabular-nums; }
.hx-ax.off .hx-name, .hx-ax.off .hx-pct { fill: var(--muted); }

.guide .hex-cap { margin: 0; max-width: none; font-size: 12px; color: var(--muted); text-align: center; }
.hex-more summary { font-size: 13px; }
.hex-rows { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }

.hex-row.off { border-left-color: var(--muted); }

.hex-row-p { font: 700 16px var(--font-display); color: var(--accent); font-variant-numeric: tabular-nums; }

.hex-row-l.you { color: var(--ink); }
.pen-box { padding: 14px; display: grid; gap: 8px; border-color: rgba(255, 92, 122, .6); box-shadow: 0 0 0 1px rgba(255, 92, 122, .45), 0 0 18px rgba(255, 92, 122, .2), inset 0 0 22px rgba(255, 92, 122, .06); }
.pen-box.ok { border-color: rgba(60, 240, 165, .55); box-shadow: 0 0 0 1px rgba(60, 240, 165, .4), 0 0 16px rgba(60, 240, 165, .15); }
.pen-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.pen-box h3 { color: var(--bad); text-shadow: 0 0 10px rgba(255, 92, 122, .45); }
.pen-box.ok h3 { color: var(--good); text-shadow: none; }
.pen-box .note { margin: 0; }
.pen-box .hex-rows { margin-top: 2px; }
.pen-row { border-left-color: var(--bad); }
.pen-row .hex-row-p { color: var(--bad); }
.pen-row.done { border-left-color: var(--good); }
.pen-row.done .hex-row-p { color: var(--good); }
.pen-btns { grid-column: 1 / -1; margin-top: 6px; }
.pen-note { color: var(--bad); }
.pen-note.ok { color: var(--good); }
.xp-card .pen-box { clip-path: none; }
.xp-card .pen-box h3 { font-size: 18px; }
.hex-form { display: grid; gap: 12px; }

/* ---------- Economia: rateio ---------- */
.rat-cta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; border-top: 1px dashed var(--line); padding-top: 10px; }

.rat-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.rat-n { font: 700 15px var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
/* ---------- Rotina ---------- */
.rt-home { padding: 14px 14px 12px; display: grid; gap: 6px; }
.rt-home-l { display: grid; gap: 4px; }
.rt-home-l b { color: var(--accent); font-family: var(--font-display); letter-spacing: .06em; text-transform: uppercase; font-size: 13px; }
.rt-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.rt-mark { font: 600 13px var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 2px 4px; }
.rt-row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 10px; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent); padding: 0 10px 0 0; }
.rt-row.fixed { border-left-color: var(--muted); padding: 10px 12px; grid-template-columns: auto 1fr; grid-template-areas: none; opacity: .8; }

.rt-row.now { border-color: var(--warn); box-shadow: 0 0 14px rgba(255, 194, 75, .3); }
.rt-main { display: grid; grid-template-columns: 66px 26px 1fr; gap: 10px; align-items: start; width: 100%; text-align: left; background: none; border: 0; color: var(--ink); font: inherit; padding: 10px 0 10px 12px; cursor: pointer; }
.rt-time { font: 700 14px var(--font-display); letter-spacing: .04em; color: var(--accent); font-variant-numeric: tabular-nums; padding-top: 2px; }

.rt-ico { width: 26px; height: 26px; display: grid; place-items: center; color: var(--accent); }

.rt-txt { display: grid; gap: 2px; min-width: 0; }
.rt-title { font-weight: 600; overflow-wrap: anywhere; }
.rt-sub { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.rt-now { justify-self: start; margin-top: 4px; }
.rt-skip { font-size: 12px; white-space: nowrap; color: var(--muted); }
.rt-left h3, .rt-day h3, .rt-set h3 { margin: 0; font-size: 18px; }
.rt-foot { display: grid; gap: 6px; }
.rt-day { display: grid; gap: 8px; }
.rt-day.over { border-color: var(--warn); }
.rt-day-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.rt-load { font: 600 13px var(--font-display); letter-spacing: .06em; color: var(--muted); font-variant-numeric: tabular-nums; }
.goalbar.over > span { background: var(--warn); box-shadow: 0 0 10px rgba(255, 194, 75, .5); }
.rt-items { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.rt-it { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; }
.rt-it.opt { opacity: .7; }
.rt-overmsg { color: var(--warn); font-size: 14px; }
.rt-warn { border-color: var(--warn); }
.rt-set { display: grid; gap: 10px; }
.rt-set .field input { font-size: 17px; color-scheme: dark; }
@media (max-width: 420px) { .rt-main { grid-template-columns: 60px 22px 1fr; gap: 8px; } }
.rt-fx-acts { display: flex; gap: 14px; flex-shrink: 0; }
.rt-fx-editing span:first-child { color: var(--accent); }
.rt-fx-h { margin: 4px 0 0; font: 700 14px var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.rt-presets { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.rt-presets .field-l { margin-right: 4px; }
.rt-homesec { display: grid; gap: 12px; }
.rt-homesec .wk-head { margin-bottom: 0; }
.rt-headbtns { margin: 6px 0 4px; }
.rt-row { grid-template-areas: "main conc" "links links" "act skip"; }
.rt-row > .rt-main { grid-area: main; }
.rt-row > .rt-skip { grid-area: skip; justify-self: end; align-self: center; margin-bottom: 12px; }
.rt-row > .rt-conc { grid-area: conc; justify-self: end; align-self: start; margin-top: 12px; }
.rt-conc { font-size: 12px; white-space: nowrap; color: var(--good); }
.rt-links { grid-area: links; display: flex; flex-wrap: wrap; gap: 6px; padding: 0 10px 10px 124px; }
.rt-link { background: var(--surface-2); border: 1px solid var(--line); color: var(--ink); font: inherit; font-size: 13px; padding: 5px 10px; cursor: pointer; text-align: left; }
.rt-link:hover, .rt-link:focus-visible { border-color: var(--accent); color: var(--accent); }
.rt-target { animation: rtflash 2.6s ease-out; }
@keyframes rtflash { 0%, 55% { box-shadow: 0 0 0 2px var(--accent), 0 0 22px rgba(166, 107, 255, .75); } 100% { box-shadow: none; } }
@media (prefers-reduced-motion: reduce) { .rt-target { animation: none; outline: 2px solid var(--accent); } }
@media (max-width: 420px) { .rt-links { padding-left: 110px; } }
.rt-act { grid-area: act; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 2px 10px 12px 124px; }

<body data-view="home">
<header class="top">
  <div class="brand"><h1><button type="button" class="home-btn" id="home-btn" aria-label="Voltar ao início"><img src="logo-s.png" alt="" width="32" height="32">STEK</button><span class="crumb" id="crumb"></span></h1><span class="brand-r"><span id="status" aria-live="polite"></span><button type="button" class="acct" id="acct-btn">Entrar</button></span></div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Treinos do módulo Força"></nav>
</header>
<main id="main"></main>

<script>
// Os planos de treino ficam na conta de cada pessoa ("Meu plano") e no catálogo do servidor; nada de plano no código.
const PROFILES = {};
const NO_PROFILE = { name: "", desc: "", plan: [], dow: [], dayTab: {}, logsKey: "treino-logs-meu-v1", setKey: "treino-settings-meu-v1" };
const PROFILE_KEY = "treino-perfil";
let profileId = null;
let PLAN = [];
function prof() { return PROFILES[profileId] || NO_PROFILE; }
function readProfile() {
  try {
    const v = localStorage.getItem(PROFILE_KEY);
    if (v && PROFILES[v]) return v;
  } catch (e) {}
  return null;
}
function useProfile(id) {
  profileId = id; PLAN = prof().plan;
  try { localStorage.setItem(PROFILE_KEY, id); } catch (e) {}
  buildTabs();
}
let TABS = [];
function buildTabs() { TABS = PLAN.map(w => ({ id: w.id, label: w.short })).concat([{ id: "progresso", label: "Progresso" }, { id: "guia", label: "Guia" }]); }

function todayISO() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
function fmtDate(iso) { const [y, m, d] = iso.split("-"); return d + "/" + m + "/" + y.slice(2); }
function parseNum(v) { if (v == null) return null; const s = String(v).trim().replace(",", "."); if (s === "") return null; const n = Number(s); return isFinite(n) && n >= 0 ? n : null; }
function fmtNum(n) { return n == null ? "" : String(n).replace(".", ","); }
function entryText(e, id) {
  const parts = [];
  if (e.kg != null) { const ld = id ? fLoad(id) : null; parts.push(fmtNum(e.kg) + " kg" + (ld && ld.side ? " por lado" : "")); }
  if (e.sets != null && e.reps != null) parts.push(fmtNum(e.sets) + " × " + fmtNum(e.reps) + " reps");
  else if (e.sets != null) parts.push(fmtNum(e.sets) + " séries");
  else if (e.reps != null) parts.push(fmtNum(e.reps) + " reps");
  return parts.length ? parts.join(" · ") : "—";
}

const state = { tab: null, date: todayISO(), logs: {}, canWrite: true, loaded: true };
let saveTimer = null;
function loadLogs() {
  try { const raw = localStorage.getItem(prof().logsKey); state.logs = raw ? JSON.parse(raw) || {} : {}; }
  catch (e) { state.logs = {}; state.canWrite = false; }
}

function saveLogs() {
  try { localStorage.setItem(prof().logsKey, JSON.stringify(state.logs)); setStatus("Salvo no celular", "ok"); }
  catch (e) { setStatus("Não foi possível salvar neste navegador", "err"); }
}

function defaultTab() {
  const h = location.hash.replace("#", "");
  if (TABS.some(t => t.id === h)) return h;
  return prof().dayTab[new Date().getDay()] || "guia";
}

function setStatus(text, cls) { const el = document.getElementById("status"); el.textContent = text; el.className = cls || ""; }

function renderTabs() {
  const nav = document.getElementById("tabs");
  nav.innerHTML = "";
  const v = state.view;
  const cfg = {
    home: { tabs: HOME_TABS, cur: state.htab, label: "Telas do início", set: id => { state.htab = id; }, draw: () => renderHome() },
    forca: { tabs: TABS, cur: state.tab, label: "Treinos do módulo Força", set: id => { state.tab = id; }, draw: () => renderMain() },
    intel: { tabs: INTEL_TABS, cur: state.itab, label: "Seções do módulo Inteligência", set: id => { state.itab = id; if (id === "estudo") state.idate = todayISO(); }, draw: () => renderIntel() },
    ms: { tabs: MS_TABS, cur: state.mtab, label: "Seções do módulo Missões", set: id => { state.mtab = id; if (id === "ms-hoje") state.mdate = todayISO(); msUI.confirm = null; msUI.open = null; msUI.closing = null; msUI.editing = null; msUI.waiting = null; msUI.timeEdit = null; kbUI.confirm = null; kbUI.editing = null; }, draw: () => renderMissoes() },
    graca: { tabs: GRACA_TABS, cur: state.gtab, label: "Seções do módulo Graça", set: id => { state.gtab = id; if (id === "gr-hoje") state.gdate = todayISO(); grUI.confirm = null; }, draw: () => renderGraca() },
    est: { tabs: STAM_TABS, cur: state.stab, label: "Seções do módulo Estamina", set: id => { state.stab = id; if (id === "est-hoje") state.sdate = todayISO(); }, draw: () => renderStamina() },
    rotina: { tabs: ROT_TABS, cur: state.rtab, label: "Seções da Rotina", set: id => { state.rtab = id; }, draw: () => renderRotina() },
    fin: { tabs: FIN_TABS, cur: state.ftab, label: "Seções do módulo Economia", set: id => { state.ftab = id; finUI.open = null; finUI.confirm = null; finUI.msg = ""; }, draw: () => renderFin() }
  }[v];
  if (!cfg) return;
  nav.setAttribute("aria-label", cfg.label);
  cfg.tabs.forEach(t => {
    const b = document.createElement("button");
    b.type = "button"; b.id = "tab-" + t.id; b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(t.id === cfg.cur));
    b.textContent = t.label;
    b.addEventListener("click", () => { cfg.set(t.id); history.replaceState(null, "", "#" + t.id); renderTabs(); cfg.draw(); window.scrollTo(0, 0); });
    nav.appendChild(b);
  });
  const sel = document.getElementById("tab-" + cfg.cur);
  if (sel) sel.scrollIntoView({ block: "nearest", inline: "nearest" });
}

function entriesFor(exId) {
  return Object.keys(state.logs).sort().reverse()
    .map(date => ({ date, e: state.logs[date] && state.logs[date].e && state.logs[date].e[exId] }))
    .filter(x => x.e && (x.e.kg != null || x.e.reps != null || x.e.sets != null));
}

function renderMain() {
  const main = document.getElementById("main");
  main.innerHTML = "";
  if (!state.canWrite && state.loaded === "none") {
    const b = document.createElement("div"); b.className = "banner";
    b.textContent = "Entre na sua conta do Claude para salvar cargas e repetições. Sem login, o plano fica só para leitura.";
    main.appendChild(b);
  }
  if (state.tab === "guia") { renderGuide(main); return; }
  if (state.tab === "progresso") { renderProgress(main); return; }
  const w = PLAN.find(p => p.id === state.tab);
  const head = document.createElement("div"); head.className = "wk-head";
  const h2 = document.createElement("h2"); h2.textContent = w.name;
  const p = document.createElement("p"); p.textContent = w.focus && !fNm(w.name).includes(fNm(w.focus.replace(/\.$/, ""))) ? w.focus : "";
  head.append(h2, p); main.appendChild(head);

  const bar = document.createElement("div"); bar.className = "datebar";
  const lab = document.createElement("label"); lab.htmlFor = "train-date"; lab.textContent = "Treino do dia";
  const di = document.createElement("input"); di.type = "date"; di.id = "train-date"; di.value = state.date;
  di.addEventListener("change", () => { if (di.value) { state.date = di.value; renderMain(); } });
  const hint = document.createElement("span"); hint.className = "hint";
  hint.textContent = state.date === todayISO() ? "Hoje" : "Editando um treino de outro dia";
  bar.append(lab, di, hint); main.appendChild(bar);

  w.ex.forEach((ex, i) => main.appendChild(buildCard(ex, i + 1)));
}

function buildCard(ex, n) {
  const card = document.createElement("section"); card.className = "card"; card.id = "card-" + ex.id;
  const top = document.createElement("div"); top.className = "card-top";
  const num = document.createElement("div"); num.className = "num"; num.textContent = String(n).padStart(2, "0");
  const box = document.createElement("div");
  const name = document.createElement("p"); name.className = "ex-name"; name.textContent = ex.name;
  box.appendChild(name);
  if (ex.note) { const nt = document.createElement("p"); nt.className = "ex-note"; nt.textContent = ex.note; box.appendChild(nt); }
  const how = document.createElement("a"); how.className = "howto";
  how.href = "https://www.youtube.com/results?search_query=" + encodeURIComponent(ex.howto || (ex.name + " execução")) + "&sp=EgIQAQ%253D%253D";
  how.target = "_blank"; how.rel = "noopener"; how.textContent = "Ver como fazer ↗";
  box.appendChild(how);
  top.append(num, box);

  const meta = document.createElement("div"); meta.className = "meta";
  const pr = document.createElement("span"); pr.className = "presc"; pr.textContent = prescText(ex);
  meta.appendChild(pr);
  const chip = document.createElement("span"); chip.className = "chip"; chip.textContent = "Suba a carga"; chip.hidden = true; chip.dataset.role = "chip";
  meta.appendChild(chip);

  const last = document.createElement("div"); last.className = "last"; last.dataset.role = "last";

  const inputs = document.createElement("div"); inputs.className = "inputs";
  ["kg", "sets", "reps"].forEach(k => {
    const f = document.createElement("div"); f.className = "field";
    const l = document.createElement("label"); l.htmlFor = ex.id + "-" + k; l.textContent = { kg: "Carga (kg)", sets: "Séries", reps: "Reps" }[k];
    const inp = document.createElement("input"); inp.id = ex.id + "-" + k; inp.inputMode = k === "kg" ? "decimal" : "numeric";
    inp.autocomplete = "off"; inp.placeholder = "—"; inp.disabled = !state.canWrite; inp.dataset.field = k;

function importBackup(file, msg) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      const logs = (data && data.logs) || {};
      if (data.fplan && Array.isArray(data.fplan.workouts) && data.fplan.workouts.length && (!fplan || (data.fplan.upd || 0) > (fplan.upd || 0))) { localStorage.setItem(FPLAN_KEY, JSON.stringify(data.fplan)); loadFPlan(); }

      let n = 0;
      Object.keys(logs).forEach(date => {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !logs[date] || !logs[date].e) return;
        const cur = state.logs[date] || { date, e: {} };

      saveLogs();
      let ni = 0;

        if (!intel) { intel = data.intel; intel.timer = null; }
        else {
          data.intel.subjects.forEach(s => { if (!intel.subjects.some(x => x.id === s.id)) intel.subjects.push(s); });
          Object.keys(data.intel.days || {}).forEach(d => { intel.days[d] = intel.days[d] || {}; Object.keys(data.intel.days[d]).forEach(sid => { if (!intel.days[d][sid]) intel.days[d][sid] = data.intel.days[d][sid]; }); });
        }
        loadIntelDefaults(); saveIntel(); ni = Object.keys(data.intel.days || {}).length;
      }
      let nf = 0;
      if (data.fin && Array.isArray(data.fin.tx)) {
        nf = mergeTx(data.fin.tx.map(t => Object.assign({}, t))).added;
        Object.assign(fin.rules, data.fin.rules || {});
        const ids = new Set(fin.invest.ops.map(o => o.id));
        ((data.fin.invest && data.fin.invest.ops) || []).forEach(o => { if (!ids.has(o.id)) fin.invest.ops.push(o); });
        Object.assign(fin.invest.quotes, (data.fin.invest && data.fin.invest.quotes) || {});
        if (!fin.invest.token && data.fin.invest && data.fin.invest.token) fin.invest.token = data.fin.invest.token;
        Object.assign(fin.habit, data.fin.habit || {});
        if (!ofReady() && data.fin.of && data.fin.of.url) fin.of = Object.assign({}, data.fin.of, { last: null });
        saveFin();
      }
      if (data.missoes && Array.isArray(data.missoes.tasks)) {
        const gm = ensureMs();
        data.missoes.tasks.forEach(x => { const i = gm.tasks.findIndex(y => y.id === x.id); if (i < 0) gm.tasks.push(x); else if ((x.upd || 0) > (gm.tasks[i].upd || 0)) gm.tasks[i] = x; });
        Object.keys(data.missoes.days || {}).forEach(d => { gm.days[d] = gm.days[d] || {}; Object.keys(data.missoes.days[d] || {}).forEach(id => { gm.days[d][id] = Math.max(gm.days[d][id] || 0, data.missoes.days[d][id] || 0); }); });
        saveMs();
      }
      if (data.graca && Array.isArray(data.graca.rituals)) {
        const gg = ensureGraca();
        data.graca.rituals.forEach(x => { if (!gg.rituals.some(y => y.id === x.id)) gg.rituals.push(x); });
        Object.keys(data.graca.days || {}).forEach(d => { gg.days[d] = gg.days[d] || {}; Object.keys(data.graca.days[d] || {}).forEach(id => { const v = data.graca.days[d][id], cur = gg.days[d][id]; if (v && (!cur || (v.count || 0) > (cur.count || 0) || (v.sec || 0) > (cur.sec || 0))) gg.days[d][id] = v; }); });
        saveGraca();
      }
      if (data.rotina && typeof data.rotina === "object" && (!rotina || (data.rotina.upd || 0) > (rotina.upd || 0))) { rotina = Object.assign({}, data.rotina); try { localStorage.setItem(ROT_KEY, JSON.stringify(rotina)); } catch (e) {} }
      if (data.perfil && typeof data.perfil === "object" && (!perfil || (data.perfil.upd || 0) > (perfil.upd || 0))) { perfil = Object.assign({}, data.perfil); savePerfil(true); }
      if (data.stamina && data.stamina.days) {
        const st = ensureStamina();
        Object.keys(data.stamina.days).forEach(d => { st.days[d] = st.days[d] || {}; Object.keys(data.stamina.days[d] || {}).forEach(pid => { const v = data.stamina.days[d][pid]; if (v && (!st.days[d][pid] || (v.sec || 0) > (st.days[d][pid].sec || 0))) st.days[d][pid] = v; }); });
        if (!st.age && data.stamina.age) st.age = data.stamina.age;

    } catch (e) { flashAuto(msg, "Arquivo inválido. Escolha um backup gerado por este app."); }
  };
  r.readAsText(file);
}


/* ---------- Aba Progresso ---------- */
const GROUP = {}; // preenchido pelo plano da conta (cada exercício traz o seu grupo muscular)
const GROUPS = ["Peito", "Costas", "Ombros", "Bíceps", "Tríceps", "Quadríceps", "Posteriores", "Glúteos", "Panturrilhas"];
const MONTHS = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
const DOW_NAMES = ["domingos", "segundas", "terças", "quartas", "quintas", "sextas", "sábados"];
function listPt(a) { return a.length > 1 ? a.slice(0, -1).join(", ") + " e " + a[a.length - 1] : a.join(""); }
let settings = { goals: {} };
function loadSettings() { settings = { goals: {} }; try { const s = JSON.parse(localStorage.getItem(prof().setKey)); if (s && typeof s === "object") settings = s; if (!settings.goals) settings.goals = {}; } catch (e) {} }
function saveSettings() { try { localStorage.setItem(prof().setKey, JSON.stringify(settings)); } catch (e) {} }
function ymd(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function hasEntries(date) { const l = state.logs[date]; return !!(l && l.e && Object.keys(l.e).length); }

// Dias de treino do mês: seguem o plano (ex.: seg, ter, qui, sex) até você marcar ou desmarcar dias no calendário.
function defaultPlanDays(y, m) { const last = new Date(y, m + 1, 0).getDate(), out = []; for (let d = 1; d <= last; d++) if (prof().dow.includes(new Date(y, m, d).getDay())) out.push(ymd(new Date(y, m, d))); return out; }
function planDays(y, m) { const key = y + "-" + String(m + 1).padStart(2, "0"); return settings.days && settings.days[key] ? settings.days[key].slice() : defaultPlanDays(y, m); }
function setPlanDays(key, arr) { settings.days = settings.days || {}; settings.days[key] = Array.from(new Set(arr)).sort(); delete settings.goals[key]; saveSettings(); }
function isPlannedDay(iso) { const [y, m] = iso.split("-").map(Number); return planDays(y, m - 1).includes(iso); }
function monthStats() {
  const now = new Date(); const y = now.getFullYear(), m = now.getMonth();
  const key = y + "-" + String(m + 1).padStart(2, "0");
  const last = new Date(y, m + 1, 0).getDate();
  const today = ymd(now);
  const planned = defaultPlanDays(y, m).length;
  // meta antiga (só o número, sem dias): vira dias no calendário, completando a partir de hoje
  if (settings.goals[key] != null && !(settings.days && settings.days[key])) {
    const want = settings.goals[key]; let arr = defaultPlanDays(y, m);
    for (let d = now.getDate(); d <= last && arr.length < want; d++) { const iso = ymd(new Date(y, m, d)); if (!arr.includes(iso)) arr.push(iso); }
    while (arr.length > want) { const fut = arr.filter(x => x >= today && !hasEntries(x)).sort(); if (!fut.length) break; arr = arr.filter(x => x !== fut[fut.length - 1]); }
    setPlanDays(key, arr);
  }
  const plan = planDays(y, m);
  const goal = plan.length;
  const done = Object.keys(state.logs).filter(d => d.startsWith(key) && hasEntries(d)).length;
  const remaining = last - now.getDate() + (hasEntries(today) ? 0 : 1);
  const need = Math.max(0, goal - done);
  return { y, m, key, last, planned, plan, custom: !!(settings.days && settings.days[key]), goal, done, need, remaining, slack: remaining - need, today };
}

function flash(n, text, kind) { if (!n) return; n.textContent = text || ""; n.className = "note flash " + (kind || "info"); }
function flashAuto(n, text) {
  const t = String(text || "");
  let k = "info";
  if (/^(Não|Erro|Falha|Arquivo inválido|Gere |Cole |Preencha|Digite|Informe|Escolha a data|Você não tem|Dê um nome|O arquivo não tinha|Nenhuma ação)/.test(t)) k = "err";
  else if (/^0 /.test(t)) k = "info";
  else if (/^(Conectado|Backup importado|Token copiado|\d+ lançamento|\d+ cotação|Lançamento adicionado|Banco conectado|Conexão removida)/.test(t)) k = "ok";
  flash(n, t, k);
}
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function dayDetail(iso) {

function renderProgress(main) {
  const s = monthStats();
  const head = el("div", "wk-head");
  head.append(el("h2", null, "Progresso"), el("p", null, "Frequência de " + MONTHS[s.m] + " e evolução por grupo muscular."));
  main.appendChild(head);

  const sec = el("section", "guide");
  sec.appendChild(el("h3", null, "Meta de " + MONTHS[s.m]));
  const tiles = el("div", "tiles");

  const tGoal = el("div", "tile");
  tGoal.appendChild(el("span", "tile-label", "Meta do mês"));
  const stepper = el("div", "stepper");
  const minus = el("button", "step", "−"); minus.type = "button"; minus.id = "goal-minus"; minus.setAttribute("aria-label", "Diminuir meta");
  const val = el("span", "tile-num", String(s.goal));
  const plus = el("button", "step", "+"); plus.type = "button"; plus.id = "goal-plus"; plus.setAttribute("aria-label", "Aumentar meta");

  plus.addEventListener("click", () => {
    for (let d = new Date().getDate(); d <= s.last; d++) { const iso = ymd(new Date(s.y, s.m, d)); if (!s.plan.includes(iso) && !hasEntries(iso)) { setPlanDays(s.key, s.plan.concat(iso)); renderMain(); return; } }
  });
  minus.addEventListener("click", () => {
    const fut = s.plan.filter(x => x >= s.today && !hasEntries(x)).sort();
    const pick = fut.length ? fut[fut.length - 1] : s.plan.filter(x => !hasEntries(x)).sort().pop();
    if (pick) { setPlanDays(s.key, s.plan.filter(x => x !== pick)); renderMain(); }
  });
  minus.disabled = !s.plan.some(x => !hasEntries(x));
  plus.disabled = !Array.from({ length: s.last - new Date().getDate() + 1 }, (_, i) => ymd(new Date(s.y, s.m, new Date().getDate() + i))).some(x => !s.plan.includes(x) && !hasEntries(x));
  stepper.append(minus, val, plus); tGoal.appendChild(stepper);
  tGoal.appendChild(el("span", "tile-sub", "treinos"));

  const slackMod = s.need === 0 ? "good" : s.slack < 0 ? "bad" : s.slack <= 2 ? "warn" : "";
  tiles.append(tGoal,
    tile("Já fui", s.done, s.done === 1 ? "treino" : "treinos", s.need === 0 ? "good" : ""),

  else if (s.slack < 0) msg = "Restam " + s.remaining + " dias no mês e faltam " + s.need + " treinos: mesmo indo todos os dias, a meta não fecha. Ajuste a meta ou foque no próximo mês.";
  else msg = "Restam " + s.remaining + " dias no mês. Você precisa treinar em " + s.need + " deles, então pode faltar em até " + s.slack + ".";
  sec.appendChild(el("p", "note", msg));

  if (s.custom) {

    const back = el("button", "linkbtn", "Voltar ao padrão (" + listPt(prof().dow.map(d => DOW_NAMES[d])) + ")"); back.type = "button"; back.id = "plan-reset";
    back.addEventListener("click", () => { delete settings.days[s.key]; delete settings.goals[s.key]; saveSettings(); renderMain(); });
    rs.appendChild(back); sec.appendChild(rs);

  // calendário
  const cal = el("div", "cal");
  ["S", "T", "Q", "Q", "S", "S", "D"].forEach(d => cal.appendChild(el("span", "cal-h", d)));
  const firstDow = (new Date(s.y, s.m, 1).getDay() + 6) % 7;
  for (let i = 0; i < firstDow; i++) cal.appendChild(el("span", "cal-d empty"));
  for (let d = 1; d <= s.last; d++) {
    const iso = s.key + "-" + String(d).padStart(2, "0");
    const isPlan = s.plan.includes(iso), trained = hasEntries(iso);
    let cls = "cal-d";
    if (trained) cls += " done";
    else if (isPlan && iso >= s.today) cls += " plan";

function chartBox(svg) { const d = el("div", "chart"); d.innerHTML = svg; return d; }

function weekStart(iso) { const [y, m, d] = iso.split("-").map(Number); const dt = new Date(y, m - 1, d); dt.setDate(dt.getDate() - (dt.getDay() + 6) % 7); return ymd(dt); }

function groupSeries(group) {
  const ids = Object.keys(GROUP).filter(k => GROUP[k] === group);
  const first = {}; const weeks = {};
  Object.keys(state.logs).sort().forEach(date => {
    const l = state.logs[date]; if (!l || !l.e) return;
    ids.forEach(id => {
      const e = l.e[id]; if (!e) return;
      const wk = weekStart(date);
      const w = weeks[wk] || (weeks[wk] = { sets: 0, hasSets: false, max: {} });
      if (e.sets != null) { w.sets += e.sets; w.hasSets = true; }
      if (e.kg > 0) { if (first[id] == null) first[id] = e.kg; w.max[id] = Math.max(w.max[id] || 0, e.kg); }

    const w = weeks[wk]; const r = Object.keys(w.max).map(id => w.max[id] / first[id]);
    return { wk, sets: w.hasSets ? w.sets : null, load: r.length ? (r.reduce((a, b) => a + b, 0) / r.length - 1) * 100 : null };

}

}

}
function lineSVG(data) {
  const pts = data.map((p, i) => ({ i, v: p.load })).filter(p => p.v != null);

  let lo = Math.min(0, ...pts.map(p => p.v)), hi = Math.max(10, ...pts.map(p => p.v));
  lo = Math.floor(lo / 10) * 10; hi = Math.ceil(hi / 10) * 10;
  const iw = CW - PL - PR, ih = CH - PT - PB;
  const xs = i => PL + iw * (i + 0.5) / data.length; const ys = v => PT + ih * (1 - (v - lo) / (hi - lo));
  let g = "";
  [lo, 0, hi].filter((v, k, a) => a.indexOf(v) === k).forEach(v => { g += '<line class="' + (v === 0 ? "grid zero" : "grid") + '" x1="' + PL + '" x2="' + (CW - PR) + '" y1="' + ys(v) + '" y2="' + ys(v) + '"/><text class="ax" x="' + (PL - 6) + '" y="' + (ys(v) + 4) + '" text-anchor="end">' + (v > 0 ? "+" : "") + v + '%</text>'; });
  const path = pts.map((p, k) => (k ? "L" : "M") + xs(p.i).toFixed(1) + " " + ys(p.v).toFixed(1)).join(" ");
  const area = path + " L" + xs(pts[pts.length - 1].i).toFixed(1) + " " + ys(lo) + " L" + xs(pts[0].i).toFixed(1) + " " + ys(lo) + " Z";
  g += '<path class="area" d="' + area + '"/><path class="line" d="' + path + '"/>';
  pts.forEach((p, k) => { const last = k === pts.length - 1; g += '<circle class="' + (last ? "dot last" : "dot") + '" cx="' + xs(p.i) + '" cy="' + ys(p.v) + '" r="' + (last ? 4.5 : 3) + '"/>'; });
  const lp = pts[pts.length - 1];
  g += '<text class="val" x="' + Math.min(xs(lp.i), CW - PR - 14) + '" y="' + (ys(lp.v) - 8) + '" text-anchor="middle">' + (lp.v >= 0 ? "+" : "") + lp.v.toFixed(0) + '%</text>';
  return '<svg viewBox="0 0 ' + CW + ' ' + CH + '" role="img" aria-label="Carga em relação ao primeiro registro">' + g + xLabels(data, xs) + '</svg>';
}

// O plano importado vira o perfil "meu", com registros próprios. O id de cada exercício vem do nome,

const FPLAN_KEY = "treino-plano-meu-v1";
const F_DAY = ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];
const F_DOWRE = /\b(domingo|segunda|terca|quarta|quinta|sexta|sabado|dom|seg|ter|qua|qui|sex|sab)\b\.?(?:-?feira)?|\b([2-7])a\b/g;

function loadFPlan() {

    if (fplan.src) fplan.src = "app"; if (fplan.from) fplan.from = "legado"; fplan.upd = Date.now();

}
function fDesc(ws) {

  return ws.map(w => w.short).join(", ") + (ds.length ? " · " + listPt(ds.map(d => F_DAY[d].toLowerCase())) : "");
}
function fDays(t) {

    [/panturrilha|gemeos|soleo/, "Panturrilhas"],
    [/gluteo|pelvica|hip ?thrust|abdutora|adutora|ponte/, "Glúteos"],
    [/triceps|testa|frances|coice|mergulho/, "Tríceps"],
    [/rosca|biceps|martelo|scott/, "Bíceps"],
    [/flexora|stiff|romeno|terra|good ?morning|nordic|posterior/, "Posteriores"],
    [/agachamento|leg ?press|extensora|hack|afundo|passada|avanco|bulgaro|belt|sissy|quadriceps|smith/, "Quadríceps"],
    [/remada|puxada|pull ?down|barra fixa|pull ?up|pullover|serrote|graviton|dorsal|costas/, "Costas"],
    [/supino|crucifixo|peck ?deck|voador|cross ?over|flexao de braco|paralela|peito|chest/, "Peito"]];

function fMakeEx(e, used) {
  const name = String(e.name || "").replace(/\s+/g, " ").trim(), r = fReps(e.reps), sm = /(\d+)(?:\s*(?:a|-|–|ou|\/)\s*(\d+))?/.exec(e.sets || "");

}
function fMakeWorkout(w, i) {

  const keep = parts.filter(p => !(fDays(p).length && fOnlyDays(p)));

// sem dia nenhum no PDF: sugere uma divisão comum, que dá para ajustar na prévia

// Modelo do STEK (modelo-plano-de-treino.pdf): lê os campos pelo nome
function fTemplateParse(f) {
  const g = k => String(f[k] == null ? "" : f[k]).replace(/\s+/g, " ").trim(), raw = [];
  for (let t = 1; t <= 12; t++) {
    const P = "stek_f_t" + t + "_"; if (!Object.keys(f).some(k => k.startsWith(P))) continue;
    const ex = [];
    for (let r = 1; r <= 30; r++) { const nm = g(P + "e" + r + "_ex"); if (nm) ex.push({ name: nm, sets: g(P + "e" + r + "_series"), reps: g(P + "e" + r + "_reps"), rest: g(P + "e" + r + "_desc"), obs: g(P + "e" + r + "_obs") }); }
    raw.push({ name: g(P + "nome"), days: g(P + "dias"), focus: g(P + "foco"), ex });
  }

}
// Outros PDFs de treino: títulos ("Treino A", "Segunda-feira"), linhas como "Supino reto 4x10" ou tabela Exercício | Séries | Repetições
function fPlanParse(pages, title) {
  const lines = [];
  pages.forEach(items => {
    const its = items.filter(t => t.s && t.s.trim()).map(t => ({ s: t.s.replace(/\s+/g, " "), x: t.x, y: t.y, h: t.h || 10 }));
    its.sort((a, b) => b.y - a.y || a.x - b.x);
    const pl = [];
    its.forEach(t => { const L = pl.find(l => Math.abs(l.y - t.y) <= Math.max(2, t.h * 0.3)); if (L) L.t.push(t); else pl.push({ y: t.y, t: [t] }); });
    pl.sort((a, b) => b.y - a.y).forEach(l => { l.t.sort((a, b) => a.x - b.x); l.h = Math.max(...l.t.map(t => t.h)); l.text = l.t.map(t => t.s).join(" ").replace(/\s+/g, " ").trim(); if (!/^(p[áa]gina|page) \d+/i.test(l.text)) lines.push(l); });
  });
  const SR = /(\d{1,2})\s*[x×]\s*(\d{1,3}(?:\s*(?:a|-|–|\/|ou)\s*\d{1,3})*\s*(?:s\b|seg\w*|")?|falha|m[áa]x\w*)/i;
  const SD = /(\d{1,2})\s*s[ée]ries?\s*(?:de|x|×|com)?\s*(\d{1,3}(?:\s*(?:a|-|–|\/|ou)\s*\d{1,3})*)\s*(?:repeti\S*|reps?\b)?/i;
  const REST = /(\d+\s*(?:min\w*|m)\s*(?:e\s*)?\d*\s*(?:s|seg\w*)?|\d+\s*(?:s|seg\w*|")|\d+\s*'(?:\s*\d+\s*")?)(?=\W|$)/i;
  const clean = t => String(t || "").replace(/^\s*(?:\d{1,2}\s*[.)\-–º°]|[•·\-–*])\s*/, "").replace(/[\s\-–—:|•·,;]+$/, "").trim();
  const raw = []; let cur = null, cols = null, planName = "", note = "";
  const newW = (name, days) => { cur = { name, days: days || "", focus: "", ex: [] }; raw.push(cur); cols = null; };
  lines.forEach(L => {
    const t = L.text; let m;
    if ((m = /^(?:nome do plano|plano)\s*:\s*(.+)$/i.exec(t))) { planName = m[1]; return; }
    if ((m = /^observa[çc][õo]es\s*:\s*(.+)$/i.exec(t))) { if (!note) note = m[1]; return; }
    if ((m = /^nome\s*:\s*(.*?)\s*(?:dias?\s*:\s*(.*))?$/i.exec(t))) { if (m[1]) newW(m[1], m[2] || ""); else cur = null; return; } // modelo do STEK impresso
    if ((m = /^dias?\s*:\s*(.+)$/i.exec(t)) && cur) { cur.days = m[1]; return; }
    if ((m = /^foco\s*:\s*(.+)$/i.exec(t)) && cur) { cur.focus = m[1]; return; }
    if (/s[ée]ries/i.test(t) && /repeti|\breps?\b/i.test(t)) {
      const cs = L.t.map(it => { const s = fNm(it.s); return { x: it.x, r: /^(exerc|nome|movimento)/.test(s) ? "ex" : /^serie/.test(s) ? "sets" : /^(repet|reps?\b)/.test(s) ? "reps" : /^(descanso|interv|pausa)/.test(s) ? "rest" : /^(obs|tecnica|metodo)/.test(s) ? "obs" : /^(carga|peso)/.test(s) ? "load" : "" }; }).filter(c => c.r);
      if (cs.some(c => c.r === "sets") && cs.some(c => c.r === "reps")) { if (!cs.some(c => c.r === "ex")) cs.unshift({ x: -1e9, r: "ex" }); cols = cs; return; }
    }
    if (!SR.test(t) && !SD.test(t)) {
      if (/^(treino|ficha|dia)\s+[a-z0-9]{1,3}\b|^(treino|ficha)\s*[:\-–]/i.test(t) || (fDays(t).length && t.length < 70 && /^\W*(domingo|segunda|ter[çc]a|quarta|quinta|sexta|s[áa]bado|dom|seg|ter|qua|qui|sex|s[áa]b)\b/i.test(t))) {
        if (fOnlyDays(t) && cur && !cur.ex.length) { cur.days = t; return; } // "Treino A" e, na linha de baixo, "Segunda e quinta"
        newW(t, t); return;
      }
    }
    if ((m = SR.exec(t)) || (m = SD.exec(t))) {
      const name = clean(t.slice(0, m.index)); if (name.length < 3) return;
      let after = t.slice(m.index + m[0].length); const rm = REST.exec(after), rest = rm ? rm[1].trim() : "";
      if (rm) after = after.replace(rm[0], "");
      if (!cur) newW("", "");
      cur.ex.push({ name, sets: m[1], reps: m[2], rest, obs: clean(after.replace(/descanso\s*:?/i, "")) });
      return;
    }
    if (cols) {
      const cell = {};
      L.t.forEach(it => { let c = cols[0]; cols.forEach(cc => { if (it.x >= cc.x - 6) c = cc; }); cell[c.r] = ((cell[c.r] || "") + " " + it.s).trim(); });
      if (cell.ex && cell.sets && /\d/.test(cell.sets) && clean(cell.ex).length >= 3) {
        if (!cur) newW("", "");
        cur.ex.push({ name: clean(cell.ex), sets: cell.sets, reps: cell.reps || "", rest: cell.rest || "", obs: cell.obs || "" });
      }
    }
  });

  const hs = lines.map(l => l.h).sort((a, b) => a - b), body = hs[Math.floor(hs.length / 2)] || 10;
  const big = lines.slice(0, 4).find(l => l.h >= body * 1.3 && !/^(treino|ficha|dia)\s+[a-z0-9]{1,3}\b/i.test(l.text) && !fDays(l.text).length && l.text.length < 60);
  return fFinish(planName || title || (big && big.text), note, raw, false);
}
async function fPdfPick(file, rerender) {
  fImp = { busy: true, fname: file.name }; rerender();
  try {
    if (file.size > 20e6) throw new Error("o arquivo passa de 20 MB");
    const { pages, title, fields } = await pdfReadItems(file);
    const keys = Object.keys(fields);
    if (keys.some(k => /^stek_(materia|d\d+_)/.test(k)) && !keys.some(k => /^stek_f_/.test(k))) throw new Error("esse é o modelo de plano de estudos. Ele é importado na Inteligência, em Matérias");
    let r = keys.some(k => /^stek_f_/.test(k)) ? fTemplateParse(fields) : null;
    if (!r || !r.workouts.length) {
      if (pages.every(p => !p.length)) throw new Error(r ? "o modelo está sem exercícios. Preencha pelo menos um treino e salve o PDF antes de enviar" : "o PDF não tem texto, parece ser uma foto ou um escaneado");
      const g = fPlanParse(pages, title);
      if (g.workouts.length || !r) r = g;
    }
    if (!r.workouts.length) throw new Error(r.tpl ? "o modelo está sem exercícios. Preencha pelo menos um treino e salve o PDF antes de enviar" : "não encontrei exercícios com séries e repetições (como “Supino reto 4x10”) no PDF");
    if (!r.name) r.name = file.name.replace(/\.pdf$/i, "").replace(/[_]+/g, " ").trim() || "Meu plano";
    fImp = { fname: file.name, res: r, name: r.name };
  } catch (e) { fImp = { fname: file.name, err: "Não consegui montar o treino: " + (e && e.message || "erro ao ler o arquivo") + "." }; }
  rerender();
  const sec = document.getElementById("fimp"); if (sec) sec.scrollIntoView({ block: "start" });
}
function fApply() {
  const r = fImp.res;
  r.workouts.forEach(w => { w.optional = !w.days.length; w.day = listPt(w.days.map(d => F_DAY[d])); });
  fplan = { upd: Date.now(), name: (fImp.name || "").trim() || r.name || "Meu plano", note: r.note || "", workouts: r.workouts };
  try { localStorage.setItem(FPLAN_KEY, JSON.stringify(fplan)); } catch (e) {}
  fImp = null; loadFPlan(); fShared.list = null; fSerial(fPublish);
}

// Catálogo de treinos: todo plano importado de PDF entra no catálogo do app (no servidor), para as outras contas escolherem.
// O catálogo só cresce; só o dono do app tira um plano. Vai só o plano: registros de carga e o usuário de quem enviou não aparecem.
const fShared = { list: null, loading: false, err: "", canMod: false, confirm: null, rm: null, q: "", days: 0 };
function fClean(p) {
  const str = (v, n) => String(v == null ? "" : v).replace(/\s+/g, " ").trim().slice(0, n);
  const ws = (Array.isArray(p && p.workouts) ? p.workouts : []).slice(0, 12).map((w, i) => {
    const used = new Set();
    const ex = (Array.isArray(w && w.ex) ? w.ex : []).slice(0, 40).map(x => {
      const e = fMakeEx({ name: str(x && x.name, 80), sets: str(x && x.sets, 10), reps: str(x && x.reps, 30) || [x && x.lo, x && x.hi].filter(v => v != null).join(" a "), rest: str(x && x.rest, 20), obs: str(x && x.note, 160) }, used);
      if (x && x.warm) e.warm = str(x.warm, 20);
      if (x && x.howto) e.howto = str(x.howto, 120);
      return e;
    }).filter(e => e.name);
    const days = [...new Set((Array.isArray(w && w.days) ? w.days : []).map(Number).filter(d => d >= 0 && d <= 6))].sort((a, b) => a - b);
    const name = str(w && w.name, 60) || "Treino " + "ABCDEFGHIJKL"[i], short = str(w && w.short, 14) || name.slice(0, 14);
    return { id: "tr-" + (i + 1), short, name, days, day: listPt(days.map(d => F_DAY[d])), focus: str(w && w.focus, 120), optional: !days.length || !!(w && w.optional), ex };
  }).filter(w => w.ex.length);
  return { name: str(p && p.name, 80), note: String((p && p.note) || "").trim().slice(0, 800), workouts: ws, src: /^app(-[a-z0-9]+)?$/.test(p && p.src) ? "app" : "" };
}
async function fLoadShared(force) {
  if (!loggedIn() || fShared.loading || (fShared.list && !force)) return;
  fShared.loading = true;
  try {
    const r = await cloudFetch("GET", "/plans?kind=treino");
    const seen = new Set(); // o servidor já junta treinos iguais; aqui é só garantia
    fShared.list = (r.plans || []).filter(p => !p.hash || !seen.has(p.hash) && seen.add(p.hash)).map(p => { try { const plan = fClean(JSON.parse(p.data)); return plan.workouts.length ? { id: p.id, mine: !!p.mine, uses: Number(p.uses) || 0, plan } : null; } catch (e) { return null; } }).filter(Boolean);
    fShared.canMod = !!r.canModerate; fShared.err = "";

  } catch (e) {
    if (e.status === 401) cloudExpired();
    fShared.list = []; fShared.err = e.status === 404 ? "O catálogo ainda não está ativo no servidor: falta atualizar o Worker." : "Não deu para carregar os treinos importados agora. Tente de novo mais tarde.";

// publica o plano importado (tenta de novo quando a pessoa entrar na conta ou abrir a escolha de plano)
// envios ao catálogo um de cada vez, para o mesmo treino não entrar duas vezes
let fChain = Promise.resolve();
function fSerial(fn) { const p = fChain.then(() => fn()).catch(() => {}); fChain = p; return p; }
async function fPublish() {

// Contas que ainda usavam um dos planos que antes vinham no código: o plano vem do catálogo (com os mesmos ids de

function fOldLogKeys() { const out = []; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (F_OLDLOGS.test(k) && k !== "treino-logs-meu-v1") out.push(k); } } catch (e) {} return out.sort(); }

  if (p) return p !== "meu" && /^[a-z0-9]{1,20}$/.test(p) ? p : null;

}
function fMigrateLegacy() {

}
async function fLateMigrate() {

function loadIntelDefaults() { if (intel) { intel.days = intel.days || {}; intel.goals = intel.goals || { week: 2, weekend: 4 }; } }

function unitWord(sub, n) { const u = UNITS[sub.unit] || UNITS.exercicios; return n === 1 ? u[0] : u[1]; }
function isWeekend(iso) { const [y, m, d] = iso.split("-").map(Number); const w = new Date(y, m - 1, d).getDay(); return w === 0 || w === 6; }
function goalSec(iso) { return Math.round((isWeekend(iso) ? intel.goals.weekend : intel.goals.week) * 3600); }

function dayRec(day, sid) { intel.days[day] = intel.days[day] || {}; return intel.days[day][sid] = intel.days[day][sid] || { sec: 0, count: 0, theory: false }; }

  const t = intel && intel.timer; if (!t || (sid && t.sid !== sid)) return 0;
  const [a, b] = dayBounds(iso); const s = Math.max(a, t.startedAt), e = Math.min(b, Date.now());
  return e > s ? Math.floor((e - s) / 1000) : 0;
}
function subjSec(iso, sid) { return getRec(iso, sid).sec + runningSec(iso, sid); }
function daySec(iso) { return intel.subjects.reduce((a, s) => a + subjSec(iso, s.id), 0); }

/* Plano de estudo de cada matéria: cronograma importado (sub.plan) ou meta própria (sub.goal):
   - prazo: terminar o total até uma data, nos dias da semana escolhidos (a meta do dia se ajusta ao que falta);
   - diaria: quantidade fixa por dia de estudo. */
function goalOf(sub) { return !sub.plan && sub.goal && (sub.goal.type === "prazo" || sub.goal.type === "diaria") ? sub.goal : null; }

function countStudyDays(sub, a, b) { let n = 0; for (let d = a, i = 0; d <= b && i < 1500; d = addDaysISO(d, 1), i++) if (studyDay(sub, d)) n++; return n; }
function goalTarget(sub, iso) {

  const before = subjDoneUpTo(sub, addDaysISO(iso, -1));

  if (g.type === "diaria") return { qty: Math.max(1, g.qty || 1), remaining: sub.total ? sub.total - before : null };
  if (!sub.total || !g.end || iso > g.end) return null;

}

  const t = goalTarget(sub, iso); if (!t) return null;

  const items = g.type === "prazo"
    ? u(t.qty) + " hoje para terminar até " + fmtDate(g.end).slice(0, 5) + ": faltam " + u(t.remaining) + " em " + t.left + (t.left === 1 ? " dia" : " dias") + " de estudo."

function expectedUpTo(sub, iso) {

  const p = planFor(sub, iso); if (!p) return null;
  if (p.doneAll) return { done: 1, total: 1, complete: true, label: "Concluído", sub: "Total da matéria concluído." };

function studySVG(rows) {
  const hs = rows.map(r => r.sec / 3600), gs = rows.map(r => r.goal / 3600);
  const top = Math.max(4, Math.ceil(Math.max(...hs, ...gs)));
  const iw = CW - PL - PR, ih = CH - PT - PB, n = rows.length, bw = Math.min(16, iw / n * 0.6);
  const xs = i => PL + iw * (i + 0.5) / n, ys = v => PT + ih * (1 - v / top);
  let g = "";
  [0, top / 2, top].forEach(v => { g += '<line class="grid" x1="' + PL + '" x2="' + (CW - PR) + '" y1="' + ys(v) + '" y2="' + ys(v) + '"/><text class="ax" x="' + (PL - 6) + '" y="' + (ys(v) + 4) + '" text-anchor="end">' + v + 'h</text>'; });
  rows.forEach((r, i) => {
    const h = hs[i], metG = r.sec >= r.goal;
    if (h > 0) g += '<rect class="' + (metG ? "bar last" : "bar") + '" x="' + (xs(i) - bw / 2) + '" y="' + ys(h) + '" width="' + bw + '" height="' + (ys(0) - ys(h)) + '" rx="2"/>';
    g += '<line class="goal" x1="' + (xs(i) - bw / 2 - 2) + '" x2="' + (xs(i) + bw / 2 + 2) + '" y1="' + ys(gs[i]) + '" y2="' + ys(gs[i]) + '"/>';
  });
  const step = 2;
  rows.forEach((r, i) => { if (i % step === (n - 1) % step) g += '<text class="ax" x="' + xs(i) + '" y="' + (CH - 6) + '" text-anchor="middle">' + fmtDate(r.iso).slice(0, 5) + '</text>'; });
  return '<svg viewBox="0 0 ' + CW + ' ' + CH + '" role="img" aria-label="Horas de estudo por dia nos últimos 14 dias">' + g + '</svg>';
}

/* ritmo do método no cronômetro: quanto falta para o teste e para a pausa; sinal sonoro na troca */
let imLast = null;
function imPhase() {
  const t = intel && intel.timer; if (!t) return null;
  const c = imCfg(), R = IM_RITMO[c.ritmo], W = R.work * 60, e = Math.max(0, Math.floor((Date.now() - t.startedAt) / 1000));
  const k = Math.floor(e / W), left = W - e % W, test = c.teste && left <= R.test * 60, brk = R.every && (k + 1) % R.every === 0 ? R.long : R.brk;
  return { k, left, test, brk, R };
}
function imLiveText() {
  const p = imPhase(); if (!p) return "";
  return (p.k ? "Bloco " + (p.k + 1) + " · " : "") + (p.test ? "Teste de memória: feche o material e responda sem olhar. " : "") + "Faltam " + fmtMS(p.left) + " para a pausa de " + p.brk + " min (" + p.R.name + ").";
}
/* atualiza o que está contando ao vivo (cronômetro) */
function updateLive() {
  if (!intel || !intel.timer) return;
  const ph = imPhase();
  if (ph) {
    const tag = ph.k + (ph.test ? "t" : "");
    if (imLast != null && imLast !== tag) { if (ph.test) stBeep(660, 300, 1); else stBeep(528, 700, 3); }
    imLast = tag;
    document.querySelectorAll("#im-live").forEach(n => { n.textContent = imLiveText(); });
  }
  const today = todayISO();
  const sec = daySec(today), goal = goalSec(today);
  document.querySelectorAll('[data-live="subj-time"]').forEach(n => { n.textContent = fmtHMS(subjSec(today, n.dataset.sid)); });
  document.querySelectorAll('[data-live="day-time"]').forEach(n => { n.textContent = fmtHM(sec); });
  document.querySelectorAll('[data-live="day-left"]').forEach(n => { n.textContent = sec >= goal ? "—" : fmtHM(goal - sec); });
  document.querySelectorAll('[data-live="day-bar"]').forEach(n => { n.style.width = Math.min(100, sec / goal * 100) + "%"; });
  document.querySelectorAll('[data-live="home-time"]').forEach(n => { n.textContent = fmtHM(sec) + " / " + fmtGoal(goal); });
  document.querySelectorAll('[data-live="running"]').forEach(n => { const s = intel.subjects.find(x => x.id === intel.timer.sid); n.textContent = "▶ " + (s ? s.name : "") + " " + fmtHMS(subjSec(today, intel.timer.sid)); });
}

// tempo livre numa configuração (cfg: ws = acordar X min antes, ss = dormir X min depois, flex = início de cada flexível)
function rtDay(iso, cfg) {
  const B = rtBase(iso); cfg = cfg || {};
  const wake = B.wake - (cfg.ws || 0), sleep = B.sleep + (cfg.ss || 0);
  const busy = B.fixed.map(f => Object.assign({}, f));
  B.flex.forEach(f => {
    const a = f.anchor === "wake" ? wake : f.anchor === "sleep" ? sleep - f.dur : (cfg.flex && cfg.flex[f.id] != null ? cfg.flex[f.id] : f.pos[0]);
    busy.push({ a, b: a + f.dur, name: f.name, id: f.id, flex: f.anchor || "flex", ideal: f.ideal });
  });
  busy.sort((x, y) => x.a - y.a);
  let free = [[wake, sleep]]; busy.forEach(f => { free = rtCut(free, f.a, f.b); });

}
function rtTreinoWin(d) { const p = rt().treino; return p === "manha" ? [d.wake, 720] : p === "tarde" ? [720, 1080] : [1080, d.sleep]; }
function rtWorkout(iso) {
  if (!modAllowed("forca") || !profileId || !strengthDay(iso)) return null;
  const w = PLAN.find(p => p.id === prof().dayTab[rtDow(iso)]);
  const sets = w ? w.ex.reduce((s, x) => s + (parseInt(x.sets, 10) || 3), 0) : 0;
  return { w, name: w ? w.name : "Treino extra", dur: w ? Math.max(30, Math.round((sets * 2.5 + 10) / 5) * 5) : 60 };
}

// Missões da semana: planejadas primeiro; o resto por prazo (o que vence antes vai antes) e prioridade, até encher as horas de trabalho de cada dia
function rtMissionPlan(days) {
  const out = { byDay: {}, late: [], later: [] }; days.forEach(d => { out.byDay[d] = []; });
  if (!modAllowed("missoes") || !mis) return out;
  const today = days[0], last = days[days.length - 1], cap = {};
  days.forEach(d => { cap[d] = Math.round((msGoalSec(d) - (d === today ? msDaySec(d) : 0)) / 60); if (cap[d] < 0) cap[d] = 0; });
  const need = t => Math.max(15, (t.est || 60) - Math.floor(msTaskSec(t.id) / 60));
  const put = (t, d) => { const n = need(t); out.byDay[d].push({ t, need: n }); cap[d] -= n; };
  const rest = [];
  msData().tasks.filter(t => t.status === "aberta").forEach(t => {
    const pl = (t.plan || []).filter(x => x >= today).sort()[0] || ((t.plan || []).some(x => x < today) ? today : null);
    if (pl && out.byDay[pl]) put(t, pl); else if (pl) out.later.push(t); else rest.push(t);
  });
  rest.sort((a, b) => { const da = a.due || "9999", db = b.due || "9999"; return da < db ? -1 : da > db ? 1 : (MS_PRI_RANK[a.pri] ?? 1) - (MS_PRI_RANK[b.pri] ?? 1); });
  rest.forEach(t => {
    const n = need(t), lim = t.due ? (t.due < today ? today : t.due) : null;
    if (lim && lim > last) { const ok = days.filter(d => cap[d] >= n); if (ok.length) put(t, ok[0]); else out.later.push(t); return; }
    const ok = days.filter(d => (!lim || d <= lim) && cap[d] >= n);
    if (ok.length) { put(t, ok[0]); return; }
    if (lim) { const ds = days.filter(d => d <= lim && msWorkDay(d)); put(t, ds.length ? ds.reduce((b, x) => cap[x] > cap[b] ? x : b, ds[0]) : today); out.late.push(t); return; }
    out.later.push(t);
  });
  return out;
}

// O que cada módulo pede no dia (hoje: só o que falta)
function rtDemand(iso, plan, sim) {
  const today = todayISO(), isT = iso === today, c = rt(), d = rtBase(iso), skip = c.skip[iso] || [];

    for (let k = did; k < need; k++) {
      let win, fromEnd = false;
      if (need === 1 || k === 0) win = [d.wake, d.wake + 180];
      else if (k === need - 1) { win = [d.sleep - 180, d.sleep]; fromEnd = true; }

    }

    if (sim && need > 0 && !cp.optional) { if (cp.pid === "x4") sim.x4[ws] = true; sim.eq[ws] = (sim.eq[ws] || 0) + need * (practice(cp.pid).factor || 1); }
    if (need > 0) add({ key: "cardio", mod: "estamina", title: "Cardio: " + practice(cp.pid).name, sub: cp.optional ? "Opcional · " + cp.why : cp.why, dur: Math.max(10, need), optional: !!cp.optional, win: tw, afterForca: !!wo, rank: cp.optional ? 9 : 2, go: () => { enterStamina("est-hoje"); rtFocus("st-cardio"); } });
    else if (have) done.push("Cardio");

  }

}

// Encaixa os itens no tempo livre, do mais fixo ao mais flexível
function rtSchedule(iso, items, from, cfg) {
  const d = rtDay(iso, cfg), dayWin = [d.wake, d.sleep];
  let free = d.free.map(x => x.slice()); if (from != null) free = rtCut(free, -1, from);
  const blocks = [], left = [];
  const cands = (dur, w) => free.map(([a, b]) => [Math.max(a, w[0]), Math.min(b, w[1])]).filter(([a, b]) => b - a >= dur);
  const take = (dur, w, fromEnd, gap) => {
    const c = cands(dur, w); if (!c.length) return null;
    const [a, b] = fromEnd ? c[c.length - 1] : c[0], s = fromEnd ? b - dur : a;
    free = rtCut(free, fromEnd ? s - gap : s, fromEnd ? s + dur : s + dur + gap); return s;
  };
  const one = (it, w, fe) => {
    const gap = it.gapAfter ?? 5;
    let s = take(it.dur, w || it.win || dayWin, fe != null ? fe : it.fromEnd, gap);
    if (s == null) s = take(it.dur, dayWin, it.fromEnd, gap);
    if (s == null) { left.push({ it, min: it.dur }); return null; }
    const b = { s, e: s + it.dur, it }; blocks.push(b); return b;
  };
  // itens longos (trabalho, estudo) viram blocos; "lead" vai colado antes do primeiro bloco (o foco antes do estudo)
  const many = (it, lead) => {
    let rem = it.dur, part = 0; const gap = it.gapAfter ?? 5;
    const fill = w => {
      while (rem > 0) {
        // nenhum bloco menor que o mínimo (estudo: 25 min); o finzinho que sobraria pequeno vai junto do bloco atual
        const mc = it.minChunk || 15, extra = lead ? lead.dur : 0, c = cands(mc + extra, w); if (!c.length) return;
        const [a, b] = c[0], s0 = a + extra, want = rem - it.split < mc ? Math.max(rem, mc) : it.split, ch = Math.min(want, b - s0);
        if (lead) { blocks.push({ s: a, e: s0, it: lead }); lead = null; }
        free = rtCut(free, a, s0 + ch + gap); blocks.push({ s: s0, e: s0 + ch, it, part: part++ }); rem -= ch;
      }
    };
    fill(it.win || dayWin); if (rem > 0) fill(dayWin); if (rem > 0) left.push({ it, min: rem });
    return lead;
  };
  const order = items.slice().sort((a, b) => a.rank - b.rank);
  let foco = order.find(it => it.beforeStudy) || null;
  order.filter(it => !it.optional && !it.beforeStudy).forEach(it => {
    if (it.key === "cardio" && it.afterForca) { const fb = blocks.find(b => b.it.key === "forca"); one(it, fb ? [fb.e, fb.e + 120] : null); return; }
    if (it.key === "estudo") { foco = many(it, foco); return; }
    if (it.split) many(it); else one(it);
  });
  // foco sem estudo hoje (ou sem espaço colado): vai para onde couber

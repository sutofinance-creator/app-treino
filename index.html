let stAudio = null, stWake = null, stLastPhase = null;

function loadStamina() {
  try { const v = JSON.parse(localStorage.getItem(STAM_KEY)); stamina = v && v.days ? v : null; } catch (e) { stamina = null; }
  if (stamina) stamina.goals = Object.assign({ weekMin: 150, focusMin: 10 }, stamina.goals);
  settleStamina();
}
function stam() { return stamina || { goals: { weekMin: 150, focusMin: 10 }, days: {}, timer: null, age: null }; }
function ensureStamina() { if (!stamina) stamina = { version: 1, goals: { weekMin: 150, focusMin: 10 }, days: {}, timer: null, age: null }; return stamina; }
function saveStamina() {
  try { localStorage.setItem(STAM_KEY, JSON.stringify(stamina)); setStatus("Salvo no celular", "ok"); }
  catch (e) { setStatus("Não foi possível salvar neste navegador", "err"); }
}
function practice(id) { return PRACTICES.find(p => p.id === id); }
function capFirst(s) { return s.replace(/^./, c => c.toUpperCase()); }
function sessionLen(pid) { return pid === "x4" ? 2400 : (pid === "med" || pid === "resp") ? Math.round(stam().goals.focusMin * 60) : 0; }
function stCap(t) { const L = sessionLen(t.pid); return L ? L - ((t.startPos || 0) % L) : Infinity; }
function stRec(iso, pid) { const d = stam().days[iso]; return (d && d[pid]) || { sec: 0 }; }
// O cronômetro segue contando depois do fim da sessão (40 min do 4x4, minutos de foco) até você pausar.
// O tempo além da sessão fica em "over": no 4x4 ele conta 1 para 1 (o bônus dos tiros vale só para a sessão de 40 min).
function stRun(iso, pid) {
  const t = stam().timer; if (!t || (pid && t.pid !== pid)) return 0;
  const [a, b] = dayBounds(iso); const s = Math.max(a, t.startedAt), e = Math.min(b, Date.now());
  return e > s ? Math.floor((e - s) / 1000) : 0;
}
function stOver(iso, pid) {
  let o = stRec(iso, pid).over || 0;
  const t = stam().timer;
  if (t && t.pid === pid && isFinite(stCap(t))) { const [a, b] = dayBounds(iso), s = Math.max(a, t.startedAt + stCap(t) * 1000), e = Math.min(b, Date.now()); if (e > s) o += Math.floor((e - s) / 1000); }
  return o;
}
function stSec(iso, pid) { return stRec(iso, pid).sec + stRun(iso, pid); }
function stKindSec(iso, kind) { return PRACTICES.filter(p => p.kind === kind).reduce((a, p) => a + stSec(iso, p.id), 0); }
function stEqMin(iso) { return PRACTICES.reduce((a, p) => { const sec = stSec(iso, p.id), ov = p.factor !== 1 ? Math.min(sec, stOver(iso, p.id)) : 0; return a + (p.factor * (sec - ov) + (p.kind === "cardio" ? ov : 0)) / 60; }, 0); }
function weekRaw(iso) { return weekDays(weekStart(iso)).reduce((a, d) => a + stKindSec(d, "cardio") / 60, 0); }
function weekDays(start) { const [y, m, d] = start.split("-").map(Number); return Array.from({ length: 7 }, (_, i) => ymd(new Date(y, m - 1, d + i))); }
function weekEq(iso, onlyBefore) { return weekDays(weekStart(iso)).filter(d => !onlyBefore || d < iso).reduce((a, d) => a + stEqMin(d), 0); }
function focusStreak(iso) {
  const goal = stam().goals.focusMin * 60, [y, m, d] = iso.split("-").map(Number); let n = 0;
  for (let i = 0; i < 400; i++) { const day = ymd(new Date(y, m - 1, d - i)); if (stKindSec(day, "foco") >= goal) n++; else if (i === 0) continue; else break; }
  return n;
}
function strengthDay(iso) {
  if (!profileId) return null;
  const [y, m, d] = iso.split("-").map(Number);
  if (settings.days && settings.days[iso.slice(0, 7)]) return isPlannedDay(iso);
  const w = prof().dayTab[new Date(y, m - 1, d).getDay()];
  const p = w && PLAN.find(x => x.id === w);
  return !!(p && !p.optional);
}
// dia com musculação: os dias fixos do plano, o treino opcional (ex.: sábado) e qualquer dia com treino registrado na Força
function stTrainDay(iso) {
  if (strengthDay(iso)) return true;
  if (!profileId) return false;
  const [y, m, d] = iso.split("-").map(Number);
  if (prof().dayTab[new Date(y, m - 1, d).getDay()]) return true;
  const lg = state.logs && state.logs[iso];
  return !!(lg && lg.e && Object.keys(lg.e).length);
}
// sel: prática escolhida na tela. Escolher Pós-treino (ou registrar tempo nele) num dia de treino faz 15 min fecharem o cardio.
function cardioPlan(iso, sel) {
  const sd = strengthDay(iso), goal = stam().goals.weekMin;
  const POS_WHY = "Dia de musculação: 15 min de cardio depois do treino já completam o cardio do dia.";
  if (sd) return { pid: "pos", target: 15, optional: true, why: POS_WHY };
  if (stSec(iso, "pos") > 0 || (sel === "pos" && stTrainDay(iso))) return { pid: "pos", target: 15, optional: false, why: POS_WHY };
  const x4done = weekDays(weekStart(iso)).some(d => d < iso && stSec(d, "x4") >= 900);
  const pid = x4done ? "z2" : "x4", opt = weekEq(iso, true) >= goal;
  return { pid, target: practice(pid).target, optional: opt,
    why: (sd === false ? "Dia sem musculação" : "Dia livre") + (pid === "x4" ? ": o intervalado 4x4 da semana ainda não foi feito." : ": cardio leve para somar na meta da semana.") + (opt ? " A meta da semana já foi batida, então hoje é opcional." : "") };
}

/* ---------- cronômetro ---------- */
function stAddTime(a, b, pid, over) {
  let x = a;
  while (x < b) {
    const dt = new Date(x); const next = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() + 1).getTime(); const e = Math.min(b, next);
    const iso = ymd(dt); stamina.days[iso] = stamina.days[iso] || {};
    const r = stamina.days[iso][pid] = stamina.days[iso][pid] || { sec: 0 };
    const sec = Math.round((e - x) / 1000); r.sec += sec; if (over) r.over = (r.over || 0) + sec; x = e;
  }
}
// grava a sessão até "end": a parte dentro da sessão e o tempo extra depois dela
function stCommit(t, end) {
  const c = stCap(t), ce = isFinite(c) ? Math.min(end, t.startedAt + c * 1000) : end;
  stAddTime(t.startedAt, ce, t.pid); if (end > ce) stAddTime(ce, end, t.pid, true);
}
function stStart(pid) {
  cronAsk(); msHoldMission();
  const s = ensureStamina();
  if (s.timer) stStop(true);
  const rc = stRec(todayISO(), pid); s.timer = { pid, startedAt: Date.now(), startPos: Math.max(0, rc.sec - (rc.over || 0)) };
  stLastPhase = null; stSoundInit(); if (sessionLen(pid)) stWakeOn();
  saveStamina();
}
function stStop(silent) {
  const t = stamina && stamina.timer; if (!t) return;
  stCommit(t, Date.now());
  stamina.timer = null; stWakeOff();
  if (!silent) saveStamina();
}
function settleStamina() { return false; } // não para mais sozinho: o fim da sessão só toca o aviso
let stEndRung = null; // início do cronômetro cujo fim de sessão já foi avisado
function stEnded(t) { const c = stCap(t); return isFinite(c) && Date.now() >= t.startedAt + c * 1000; }
function guideState(t) {
  const L = sessionLen(t.pid); if (!L) return null;
  const pos = ((t.startPos || 0) % L) + (Date.now() - t.startedAt) / 1000;
  if (pos >= L) return { i: "extra", name: "Tempo extra", lvl: "leve", left: pos - L, extra: true, next: "Sessão de " + Math.round(L / 60) + " min concluída. O cronômetro continua até você pausar.", pct: 1 };
  if (t.pid === "x4") {
    let acc = 0;
    for (let i = 0; i < X4_PHASES.length; i++) {
      const [name, dur, lvl] = X4_PHASES[i];
      if (pos < acc + dur) return { i, name, lvl, left: acc + dur - pos, next: X4_PHASES[i + 1] ? "Depois: " + X4_PHASES[i + 1][0].toLowerCase() : "Depois: fim da sessão", pct: pos / L };
      acc += dur;
    }
    return { i: X4_PHASES.length, name: "Fim", lvl: "leve", left: 0, next: "", pct: 1 };
  }
  if (t.pid === "resp") { const c = pos % 10, inh = c < 5; return { i: Math.floor(pos / 5), name: inh ? "Inspire" : "Solte", lvl: inh ? "in" : "out", left: (inh ? 5 : 10) - c, next: "Faltam " + fmtMS(L - pos), pct: pos / L }; }
  return { i: 0, name: "Atenção na respiração", lvl: "med", left: L - pos, next: "O sino toca no fim", pct: pos / L };
}
function fmtMS(sec) { sec = Math.max(0, Math.ceil(sec)); return String(Math.floor(sec / 60)).padStart(2, "0") + ":" + String(sec % 60).padStart(2, "0"); }
function stSoundInit() { try { stAudio = stAudio || new (window.AudioContext || window.webkitAudioContext)(); if (stAudio.state === "suspended") stAudio.resume(); } catch (e) { stAudio = null; } }
function stBeep(freq, ms, times) {
  try { if (navigator.vibrate) navigator.vibrate(times > 1 ? [180, 120, 180] : 300); } catch (e) {}
  if (!stAudio) return;
  try {
    for (let k = 0; k < (times || 1); k++) {
      const o = stAudio.createOscillator(), g = stAudio.createGain(), t0 = stAudio.currentTime + k * (ms + 140) / 1000;
      o.type = "sine"; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.35, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + ms / 1000);
      o.connect(g); g.connect(stAudio.destination); o.start(t0); o.stop(t0 + ms / 1000 + 0.05);
    }
  } catch (e) {}
}
async function stWakeOn() { try { if ("wakeLock" in navigator && document.visibilityState === "visible") stWake = await navigator.wakeLock.request("screen"); } catch (e) { stWake = null; } }
function stWakeOff() { try { if (stWake) stWake.release(); } catch (e) {} stWake = null; }

/* ---------- pendências da tela inicial ---------- */
function staminaTasks() {
  const iso = todayISO(), s = stam();
  const plan = cardioPlan(iso), csec = stKindSec(iso, "cardio"), ct = plan.target * 60;
  const fsec = stKindSec(iso, "foco"), fg = s.goals.focusMin * 60;
  return { tasks: [
    { id: "task-cardio", title: "Cardio: " + practice(plan.pid).name, optional: plan.optional, complete: csec >= ct, pct: Math.min(1, csec / ct), live: "st-home",
      label: csec >= ct ? "Concluído" : (plan.optional ? "Opcional · " : "") + Math.floor(csec / 60) + "/" + plan.target + " min",
      sub: plan.why + " Semana: " + Math.round(weekEq(iso)) + " de " + s.goals.weekMin + " min.", go: () => enterStamina("est-hoje", "cardio") },
    { id: "task-foco", title: "Foco: " + s.goals.focusMin + " min", complete: fsec >= fg, pct: Math.min(1, fsec / fg), live: "st-home",
      label: fsec >= fg ? "Concluído" : Math.floor(fsec / 60) + "/" + s.goals.focusMin + " min",
      sub: fsec >= fg ? "Prática de foco feita hoje." : "Meditação ou respiração lenta. Um bom momento é logo antes de estudar.", go: () => enterStamina("est-hoje", "foco") }
  ] };
}

/* ---------- telas ---------- */
function enterStamina(tab, focus) {
  if (!modAllowed("estamina")) { goHome(); return; }
  state.view = "est"; document.body.dataset.view = "est";
  document.getElementById("crumb").textContent = "/ Estamina";
  state.sdate = todayISO();
  state.stab = STAM_TABS.some(t => t.id === tab) ? tab : "est-hoje";
  history.replaceState(null, "", "#" + state.stab);
  renderTabs(); renderStamina();
  const target = focus && document.getElementById("st-" + focus);
  if (target) target.scrollIntoView({ block: "start" }); else window.scrollTo(0, 0);
}
function renderStamina() {
  const main = document.getElementById("main"); main.innerHTML = "";
  if (state.stab === "est-progresso") renderStProgress(main);
  else if (state.stab === "est-praticas") renderStPraticas(main);
  else renderStHoje(main);
}
function stTile(label, num, sub, mod, live) { const t = el("div", "tile" + (mod ? " " + mod : "")); const n = el("span", "tile-num", String(num)); if (live) n.dataset.live = live; t.append(el("span", "tile-label", label), n, el("span", "tile-sub", sub)); return t; }

function renderStHoje(main) {
  const iso = state.sdate, today = todayISO(), s = stam();
  const [y, m, d] = iso.split("-").map(Number); const sd = strengthDay(iso);
  head2(main, iso === today ? "Estamina" : "Outro dia", capFirst(WEEKDAYS[new Date(y, m - 1, d).getDay()]) + ", " + d + " de " + MONTHS[m - 1] + ". " +
    (sd ? "Dia de musculação." : sd === false ? "Dia sem musculação." : "Escolha um plano no módulo Força para o app saber seus dias de musculação."));
  const bar = el("div", "datebar");
  const lab = el("label", null, "Dia"); lab.htmlFor = "st-date";
  const di = el("input"); di.type = "date"; di.id = "st-date"; di.value = iso;
  di.addEventListener("change", () => { if (di.value) { state.sdate = di.value; stUI.cardio = null; stUI.foco = null; renderStamina(); } });
  bar.append(lab, di, el("span", "hint", iso === today ? "Hoje" : "Outro dia: ajuste os minutos com os botões de 5 min"));
  main.appendChild(bar);

  const wk = Math.round(weekEq(iso)), goal = s.goals.weekMin, fmin = Math.floor(stKindSec(iso, "foco") / 60), streak = focusStreak(iso);
  const g = el("section", "guide");
  g.appendChild(el("h3", null, "Semana"));
  const tiles = el("div", "tiles tiles-3");
  tiles.append(stTile("Cardio", wk, "de " + goal + " min na semana", wk >= goal ? "good" : "", "st-week"),
    stTile("Foco", fmin, "de " + s.goals.focusMin + " min no dia", fmin >= s.goals.focusMin ? "good" : "", "st-focus"),
    stTile("Sequência", streak, streak === 1 ? "dia de foco na meta" : "dias de foco na meta", streak ? "good" : ""));
  g.appendChild(tiles);
  const pb = el("div", "goalbar"); const pf = el("span"); pf.style.width = Math.min(100, wk / goal * 100) + "%"; pf.dataset.live = "st-weekbar"; pb.appendChild(pf); g.appendChild(pb);
  g.appendChild(el("p", "note muted", "Cardio em minutos equivalentes (" + Math.floor(weekRaw(iso)) + " min no relógio nesta semana): os minutos vigorosos contam em dobro, como na recomendação da OMS. No 4x4, são os 16 min de tiros (40 min valem 56)."));
  main.appendChild(g);
  if (stUI.msg) { const f = el("p", "note"); flash(f, stUI.msg, "ok"); main.appendChild(f); stUI.msg = ""; }

  const plan = cardioPlan(iso, stUI.cardio), base = cardioPlan(iso);
  main.appendChild(stCard("cardio", 1, iso, base.pid, iso === today ? plan.why : "Registre o cardio deste dia.", plan.target));
  main.appendChild(stCard("foco", 2, iso, "med", iso === today ? "Meditação ou respiração lenta, " + s.goals.focusMin + " min. Um bom momento é logo antes de estudar." : "Registre a prática de foco deste dia.", s.goals.focusMin));
}

function stCard(kind, n, iso, suggested, intro, targetMin) {
  const today = todayISO(), s = stam(), t = s.timer;
  const running = t && practice(t.pid).kind === kind && iso === today ? t.pid : null;
  const pid = running || stUI[kind] || suggested; const p = practice(pid);
  const card = el("section", "card st-card"); card.id = "st-" + kind;
  const top = el("div", "card-top"); const box = el("div");
  box.append(el("p", "ex-name", kind === "cardio" ? "Cardio" : "Foco"), el("p", "ex-note", intro));
  top.append(el("div", "num", String(n).padStart(2, "0")), box); card.appendChild(top);

  const chips = el("div", "chips"); chips.setAttribute("role", "group"); chips.setAttribute("aria-label", "Prática");
  PRACTICES.filter(x => x.kind === kind && (!x.trainOnly || stTrainDay(iso) || stSec(iso, x.id) > 0 || x.id === pid)).forEach(x => {
    const c = el("button", "gchip", x.name + (x.id === suggested && iso === today ? " ★" : "")); c.type = "button"; c.id = "stp-" + x.id;
    c.setAttribute("aria-pressed", String(x.id === pid));
    if (running && running !== x.id) c.disabled = true;
    c.addEventListener("click", () => { stUI[kind] = x.id; renderStamina(); });
    chips.appendChild(c);
  });
  card.appendChild(chips);
  const desc = el("div", "plan");
  desc.append(el("span", "plan-t", p.tag), el("p", "plan-items", p.how));
  if (p.yt) { const a = el("a", "howto", "Ver como fazer ↗"); a.href = "https://www.youtube.com/results?search_query=" + encodeURIComponent(p.yt) + "&sp=EgIQAQ%253D%253D"; a.target = "_blank"; a.rel = "noopener"; desc.appendChild(a); }
  const isRun = running === pid;
  if (!isRun) card.appendChild(desc);

  const trow = el("div", "timer-row" + (isRun ? " running" : ""));
  const td = el("span", "timer", fmtHMS(stSec(iso, pid))); td.id = "st-tmr-" + kind; if (isRun) { td.dataset.live = "st-time"; td.dataset.pid = pid; }
  const tb = el("div", "timer-btns");
  if (iso === today) {
    const go = el("button", "btn" + (isRun ? " stop" : ""), isRun ? "Pausar" : "Iniciar"); go.type = "button"; go.id = "st-go-" + kind;
    go.addEventListener("click", () => { if (isRun) stStop(); else { stUI[kind] = pid; stStart(pid); } renderStamina(); });
    tb.appendChild(go);
  }
  const adj = (delta, txt) => { const b = el("button", "step wide", txt); b.type = "button"; b.id = "st-adj" + (delta > 0 ? "p" : "m") + "-" + kind; b.setAttribute("aria-label", (delta > 0 ? "Somar " : "Tirar ") + "5 minutos de " + p.name);
    b.addEventListener("click", () => { const st = ensureStamina(); st.days[iso] = st.days[iso] || {}; const r = st.days[iso][pid] = st.days[iso][pid] || { sec: 0 }; r.sec = Math.max(0, r.sec + delta); saveStamina(); renderStamina(); }); return b; };
  tb.append(adj(-300, "−5 min"), adj(300, "+5 min"));
  trow.append(td, tb); card.appendChild(trow);

  if (isRun && sessionLen(pid)) card.appendChild(buildGuide(t));
  else if (isRun) card.appendChild(el("p", "ex-note", "Cronômetro rodando. Ele continua contando mesmo se você fechar o app."));

  const done = PRACTICES.filter(x => x.kind === kind && stSec(iso, x.id) >= 60).map(x => x.name + " " + fmtHM(stSec(iso, x.id)));
  const tot = Math.floor(stKindSec(iso, kind) / 60);
  const line = el("div", "meta");
  line.append(el("span", "presc", tot + " de " + targetMin + " min"), el("span", "st " + (tot >= targetMin ? "ok" : "pend"), tot >= targetMin ? "Meta do dia feita" : "Faltam " + (targetMin - tot) + " min"));
  if (done.length) line.appendChild(el("span", "last", done.join(" · ")));
  card.appendChild(line);
  if (kind === "cardio" && (pid === "z2" || pid === "mod")) card.appendChild(el("p", "note muted", "Dica: 20 a 30 min de cardio moderado logo antes de estudar melhoram o foco por cerca de meia hora."));
  return card;
}

function buildGuide(t) {
  const gs = guideState(t);
  const w = el("div", "guide-run lvl-" + gs.lvl); w.id = "st-guide";
  if (t.pid === "resp") {
    const b = el("div", "breath " + gs.lvl); b.id = "st-breath";
    b.append(el("span", "breath-dot"), el("span", "breath-t", gs.name));
    w.appendChild(b);
  } else w.appendChild(el("span", "gr-phase", gs.name));
  const left = el("span", "gr-left", (gs.extra ? "+" : "") + fmtMS(gs.left)); left.id = "st-gleft";
  const nx = el("span", "gr-next", gs.next); nx.id = "st-gnext";
  const pb = el("div", "goalbar thin"); const pf = el("span"); pf.id = "st-gbar"; pf.style.width = Math.min(100, gs.pct * 100) + "%"; pb.appendChild(pf);
  w.append(left, nx, pb);
  if (t.pid === "x4") w.appendChild(el("p", "note muted", "Deixe a tela ligada e o som alto: o app avisa com bipes a cada troca de fase."));
  stLastPhase = gs.i;
  return w;
}

function updateStaminaLive() {
  const t = stamina && stamina.timer; if (!t) return;
  if (stEnded(t) && stEndRung !== t.startedAt) {
    const first = stEndRung === null && Date.now() - (t.startedAt + stCap(t) * 1000) > 5000; // já tinha acabado quando o app abriu: sem bipe
    stEndRung = t.startedAt;
    if (!first) { stBeep(t.pid === "x4" ? 660 : 528, 900, 2); stUI.msg = practice(t.pid).name + ": sessão concluída. O cronômetro continua contando até você pausar."; }
    if (state.view === "est") renderStamina();
    return;
  }
  const today = todayISO();
  document.querySelectorAll('[data-live="st-time"]').forEach(n => { n.textContent = fmtHMS(stSec(today, n.dataset.pid)); });
  document.querySelectorAll('[data-live="st-running"]').forEach(n => { n.textContent = "▶ " + practice(t.pid).name + " " + fmtHMS(stSec(today, t.pid)); });
  if (state.view === "est" && state.stab === "est-hoje" && state.sdate === today) {
    const wk = Math.round(weekEq(today)), fmin = Math.floor(stKindSec(today, "foco") / 60);
    document.querySelectorAll('[data-live="st-week"]').forEach(n => { n.textContent = String(wk); });
    document.querySelectorAll('[data-live="st-focus"]').forEach(n => { n.textContent = String(fmin); });
    document.querySelectorAll('[data-live="st-weekbar"]').forEach(n => { n.style.width = Math.min(100, wk / stam().goals.weekMin * 100) + "%"; });
  }
  if (state.view === "home") staminaTasks().tasks.forEach(k => { const n = document.querySelector("#" + k.id + ' [data-live="st-home"]'); if (n) n.textContent = k.label; });
  const gw = document.getElementById("st-guide"); if (!gw) return;
  const gs = guideState(t); if (!gs) return;
  const set = (id, v) => { const n = document.getElementById(id); if (n && n.textContent !== v) n.textContent = v; };
  set("st-gleft", (gs.extra ? "+" : "") + fmtMS(gs.left)); set("st-gnext", gs.next);
  const gb = document.getElementById("st-gbar"); if (gb) gb.style.width = Math.min(100, gs.pct * 100) + "%";
  if (gs.i !== stLastPhase) {
    const first = stLastPhase == null; stLastPhase = gs.i;
    gw.className = "guide-run lvl-" + gs.lvl;
    const ph = gw.querySelector(".gr-phase"); if (ph) ph.textContent = gs.name;
    const br = document.getElementById("st-breath"); if (br) { br.className = "breath " + gs.lvl; br.querySelector(".breath-t").textContent = gs.name; }
    if (!first && !gs.extra && t.pid === "x4") { if (gs.lvl === "forte") stBeep(880, 260, 3); else stBeep(520, 400, 1); }
  }

function stBarsSVG(rows, aria) {
  const mx = Math.max(1, ...rows.map(r => Math.max(r.v, r.goal))) * 1.1;
  const top = mx <= 20 ? Math.ceil(mx / 10) * 10 : mx <= 100 ? Math.ceil(mx / 20) * 20 : Math.ceil(mx / 100) * 100;
  const iw = CW - PL - PR, ih = CH - PT - PB, n = rows.length, bw = Math.min(18, iw / n * 0.6);
  const xs = i => PL + iw * (i + 0.5) / n, ys = v => PT + ih * (1 - v / top);
  let g = "";
  [0, top / 2, top].forEach(v => { g += '<line class="grid" x1="' + PL + '" x2="' + (CW - PR) + '" y1="' + ys(v) + '" y2="' + ys(v) + '"/><text class="ax" x="' + (PL - 6) + '" y="' + (ys(v) + 4) + '" text-anchor="end">' + Math.round(v) + '</text>'; });
  rows.forEach((r, i) => {
    if (r.v > 0) g += '<rect class="' + (r.v >= r.goal ? "bar last" : "bar") + '" x="' + (xs(i) - bw / 2) + '" y="' + ys(r.v) + '" width="' + bw + '" height="' + (ys(0) - ys(r.v)) + '" rx="2"/>';
    g += '<line class="goal" x1="' + (xs(i) - bw / 2 - 2) + '" x2="' + (xs(i) + bw / 2 + 2) + '" y1="' + ys(r.goal) + '" y2="' + ys(r.goal) + '"/>';
  });
  const step = n > 8 ? 2 : 1;
  rows.forEach((r, i) => { if (i % step === (n - 1) % step) g += '<text class="ax" x="' + xs(i) + '" y="' + (CH - 6) + '" text-anchor="middle">' + r.label + '</text>'; });
  return '<svg viewBox="0 0 ' + CW + ' ' + CH + '" role="img" aria-label="' + aria + '">' + g + '</svg>';
}

/* ======================= Módulo Graça ======================= */
const GRACA_KEY = "stek-graca-v1";
const GRACA_TABS = [{ id: "gr-hoje", label: "Hoje" }, { id: "gr-progresso", label: "Progresso" }, { id: "gr-rituais", label: "Rituais" }];
const GR_SUGGEST = [["Rezar o Terço", 30, 1, [0, 1, 2, 3, 4, 5, 6]], ["Leitura da Bíblia", 15, 1, [0, 1, 2, 3, 4, 5, 6]], ["Oração da manhã", 10, 1, [0, 1, 2, 3, 4, 5, 6]]];
let graca = null;
const grUI = { msg: "", confirm: null, draft: null, edit: null, newOpen: false };
let grLastLeft = null;

function loadGraca() {
  try { const v = JSON.parse(localStorage.getItem(GRACA_KEY)); graca = v && Array.isArray(v.rituals) ? v : null; } catch (e) { graca = null; }
  if (graca) { graca.days = graca.days || {}; }
  settleGraca();
}
function grData() { return graca || { rituals: [], days: {}, timer: null }; }
function ensureGraca() { if (!graca) graca = { version: 1, rituals: [], days: {}, timer: null }; return graca; }
function saveGraca() {
  try { localStorage.setItem(GRACA_KEY, JSON.stringify(graca)); setStatus("Salvo no celular", "ok"); }
  catch (e) { setStatus("Não foi possível salvar neste navegador", "err"); }
}
function ritual(id) { return grData().rituals.find(r => r.id === id); }
function grDow(iso) { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d).getDay(); }
function grScheduled(r, iso) { return (r.days || []).includes(grDow(iso)) && (!r.created || iso >= r.created); }
function grRec(iso, rid) { const d = grData().days[iso]; return (d && d[rid]) || { sec: 0, count: 0, cur: 0 }; }
function grRecW(iso, rid) { const g = ensureGraca(); g.days[iso] = g.days[iso] || {}; return g.days[iso][rid] = g.days[iso][rid] || { sec: 0, count: 0, cur: 0 }; }
function grLimit(r) { return r && r.limit ? Math.round(r.limit * 60) : 0; }
function grCap(t) { const r = ritual(t.rid), L = grLimit(r); return L ? Math.max(0, L - (t.startCur || 0)) : Infinity; }
// o tempo do ritual é a meta: ao chegar nele toca o sino e o cronômetro continua até você pausar ou concluir
function grRun(t) { return t ? Math.max(0, (Date.now() - t.startedAt) / 1000) : 0; }
function grEnded(t) { const c = grCap(t); return isFinite(c) && grRun(t) >= c; }
let grEndRung = null;
function grSec(iso, rid) {
  const t = grData().timer; let s = grRec(iso, rid).sec;
  if (t && t.rid === rid && t.day === iso) s += Math.floor(grRun(t));
  return s;
}
function grTodayPlan(iso) { return grData().rituals.filter(r => grScheduled(r, iso)); }
function grDayStats(iso) {
  const plan = grTodayPlan(iso);
  const need = plan.reduce((a, r) => a + Math.max(1, r.times || 1), 0);
  const done = plan.reduce((a, r) => a + Math.min(Math.max(1, r.times || 1), grRec(iso, r.id).count || 0), 0);
  return { plan, need, done, full: need > 0 && done >= need };
}
function grStreak(iso) {
  const [y, m, d] = iso.split("-").map(Number); let n = 0;
  for (let i = 0; i < 400; i++) {
    const st = grDayStats(ymd(new Date(y, m - 1, d - i)));
    if (!st.need) continue; // dia sem ritual marcado não quebra a sequência
    if (st.full) n++; else if (i === 0) continue; else break;
  }
  return n;
}

/* ---------- sessão (cronômetro) ---------- */
function grStart(rid) {
  cronAsk(); msHoldMission();
  const g = ensureGraca(); if (g.timer) grStop(false, true);
  const today = todayISO();
  g.timer = { rid, startedAt: Date.now(), day: today, startCur: grRec(today, rid).cur || 0 };
  grLastLeft = null; stSoundInit(); if (grLimit(ritual(rid))) stWakeOn();
  saveGraca();
}
// finish = true conta uma vez; false só pausa (o tempo fica guardado para continuar)
function grStop(finish, silent) {
  const g = graca, t = g && g.timer; if (!t) return;
  const run = Math.floor(grRun(t)), rec = grRecW(t.day, t.rid);
  rec.sec += run;
  const L = grLimit(ritual(t.rid));
  if (finish || (L && (t.startCur || 0) + run >= L)) { rec.count = (rec.count || 0) + 1; rec.cur = 0; } else rec.cur = (t.startCur || 0) + run; // pausar depois do tempo completo já conta como feito
  g.timer = null; stWakeOff();
  if (!silent) saveGraca();
}
function settleGraca() { return false; } // não para mais sozinho

/* ---------- pendências da tela inicial ---------- */
function gracaTasks() {
  const iso = todayISO(), g = grData();
  if (!g.rituals.length) return { setup: true, setupLabel: "Criar ritual", setupText: "Crie seus rituais (oração, leitura, terço) com tempo, dias e quantas vezes por dia.", setupGo: () => { grUI.newOpen = true; enterGraca("gr-rituais"); }, tasks: [] };
  return { tasks: grTodayPlan(iso).map(r => {
    const need = Math.max(1, r.times || 1), c = grRec(iso, r.id).count || 0;
    return { id: "task-gr-" + r.id, title: r.name, complete: c >= need, pct: Math.min(1, c / need), live: "gr-home",
      label: c >= need ? "Concluído" : (need > 1 ? Math.min(c, need) + "/" + need : (r.limit ? r.limit + " min" : "Pendente")),
      sub: (r.limit ? r.limit + " min" : "Sem tempo limite") + (need > 1 ? " · " + need + " vezes hoje" : ""), go: () => enterGraca("gr-hoje", r.id) };
  }) };
}

  if (grEnded(t) && grEndRung !== t.startedAt) {
    const first = grEndRung === null && grRun(t) - grCap(t) > 5;
    grEndRung = t.startedAt;
    if (!first) { const r = ritual(t.rid); stBeep(528, 1200, 3); grUI.msg = (r ? r.name : "Ritual") + ": tempo completo. O cronômetro continua contando até você pausar ou concluir."; }
    if (state.view === "graca") renderGraca();
    return;
  }
  const today = todayISO();
  document.querySelectorAll('[data-live="gr-time"]').forEach(n => { n.textContent = fmtHMS(grSec(today, n.dataset.rid)); });
  document.querySelectorAll('[data-live="gr-running"]').forEach(n => { const r = ritual(t.rid); n.textContent = "▶ " + (r ? r.name : "") + " " + fmtHMS(grSec(today, t.rid)); });
  document.querySelectorAll('[data-live="gr-daytime"]').forEach(n => { n.textContent = fmtHM(grData().rituals.reduce((a, r) => a + grSec(today, r.id), 0)); });
  const r = ritual(t.rid), L = grLimit(r);
  if (L) {
    const pos = (t.startCur || 0) + grRun(t);
    const gl = document.getElementById("gr-gleft"); if (gl) gl.textContent = pos >= L ? "+" + fmtMS(pos - L) : fmtMS(L - pos);
    const gn = document.getElementById("gr-gnext"); if (gn) { const v = pos >= L ? "Tempo completo. Continua contando até você pausar ou concluir." : "Um sino toca quando o tempo acabar"; if (gn.textContent !== v) gn.textContent = v; }
    const gb = document.getElementById("gr-gbar"); if (gb) gb.style.width = Math.min(100, pos / L * 100) + "%";
  }
}

/* ======================= Módulo Missões ======================= */
const MS_KEY = "stek-missoes-v1";
const MS_TABS = [{ id: "ms-hoje", label: "Hoje" }, { id: "ms-lista", label: "Missões" }, { id: "ms-relatorio", label: "Relatório" }, { id: "ms-base", label: "Base de conhecimento" }];
const MS_PRI = [["alta", "Alta"], ["media", "Média"], ["baixa", "Baixa"]];
const MS_PRI_RANK = { alta: 0, media: 1, baixa: 2 };
const MS_GERAL = "_geral";
const MS_REC = [["", "Não repete"], ["util", "Todo dia útil"], ["diaria", "Todos os dias"], ["semanal", "Toda semana"], ["mensal", "Todo mês"]];
let mis = null;
const msUI = { open: null, closing: null, closeDraft: null, draft: null, period: "semana", proj: "", msg: "", confirm: null, q: "", newAtt: [], attOpen: null, newOpen: false, dayNewOpen: false, editing: null, waiting: null, timeEdit: null, timeDraft: null };
// fecha o formulário de missão nova; arquivos já enviados para o rascunho saem do servidor
function msCloseNew() { const a = msUI.newAtt; msUI.newAtt = []; msUI.newOpen = false; msDropFiles(a); }

function loadMs() {
  try { const v = JSON.parse(localStorage.getItem(MS_KEY)); mis = v && Array.isArray(v.tasks) ? v : null; } catch (e) { mis = null; }
  if (mis) {
    mis.goal = Object.assign({ hours: 4, days: [1, 2, 3, 4, 5] }, mis.goal); mis.days = mis.days || {};
    if (mis.work == null) mis.work = !!mis.timer;
  }
}
function msData() { return mis || { goal: { hours: 4, days: [1, 2, 3, 4, 5] }, tasks: [], days: {}, timer: null, work: false }; }
function ensureMs() { if (!mis) mis = { version: 1, goal: { hours: 4, days: [1, 2, 3, 4, 5] }, tasks: [], days: {}, timer: null, work: false }; return mis; }
function saveMs() {
  try { localStorage.setItem(MS_KEY, JSON.stringify(mis)); setStatus("Salvo no celular", "ok"); }
  catch (e) { setStatus("Não foi possível salvar neste navegador", "err"); }
}
function msTask(id) { return msData().tasks.find(t => t.id === id); }
function msDow(iso) { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d).getDay(); }
function msWorkDay(iso) { return msData().goal.days.includes(msDow(iso)); }
// a meta de horas só vale a partir do primeiro dia em que você usou o módulo
function msSince() {
  const g = msData(); let first = null;
  g.tasks.forEach(t => { if (t.created && (!first || t.created < first)) first = t.created; });
  Object.keys(g.days).forEach(d => { if (Object.values(g.days[d] || {}).some(v => v > 0) && (!first || d < first)) first = d; });
  if (g.timer) { const d = ymd(new Date(g.timer.startedAt)); if (!first || d < first) first = d; }
  return first || todayISO();
}
function msGoalSec(iso) { return msWorkDay(iso) && iso >= msSince() ? Math.round(msData().goal.hours * 3600) : 0; }
function msRun(iso, tid) {
  const t = msData().timer; if (!t || (tid && t.tid !== tid)) return 0;
  const [a, b] = dayBounds(iso); const s = Math.max(a, t.startedAt), e = Math.min(b, Date.now());
  return e > s ? Math.floor((e - s) / 1000) : 0;
}
function msSec(iso, tid) { const d = msData().days[iso]; return ((d && d[tid]) || 0) + msRun(iso, tid); }
function msDaySec(iso) { const d = msData().days[iso] || {}; return Object.keys(d).reduce((a, k) => a + (d[k] || 0), 0) + msRun(iso); }
function msTaskSec(tid) {
  const g = msData(); let s = Object.keys(g.days).reduce((a, d) => a + ((g.days[d] && g.days[d][tid]) || 0), 0);
  if (g.timer && g.timer.tid === tid) s += Math.floor((Date.now() - g.timer.startedAt) / 1000);
  return s;
}
function msAddTime(a, b, tid) {
  let x = a;
  while (x < b) {
    const dt = new Date(x); const next = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() + 1).getTime(); const e = Math.min(b, next);
    const iso = ymd(dt); mis.days[iso] = mis.days[iso] || {}; mis.days[iso][tid] = (mis.days[iso][tid] || 0) + Math.round((e - x) / 1000); x = e;
  }
}
/* Cronômetros: só um roda por vez.
   - Trabalho (geral) roda enquanto o expediente está ligado (mis.work) e nenhuma missão está rodando.
   - Ao iniciar uma missão, o Trabalho pausa e o tempo passa a contar na missão; ao pausar ou concluir a missão, o Trabalho volta.
   - Pausar o Trabalho encerra o expediente: para tudo até você iniciar de novo (ou iniciar uma missão). */
function msStop(silent) {
  const t = mis && mis.timer; if (!t) return;
  msAddTime(t.startedAt, Date.now(), t.tid); mis.timer = null;
  if (!silent) saveMs();
}
function msResumeWork() { if (mis && mis.work && !mis.timer) mis.timer = { tid: MS_GERAL, startedAt: Date.now() }; }
/* O trabalho geral pode rodar junto com estudo, Estamina e Graça (tempo ocioso no trabalho).
   A missão específica não: o tempo dela precisa ser só dela. Iniciar uma missão pausa os outros
   cronômetros; iniciar outro cronômetro pausa a missão (e o trabalho geral volta a contar). */
function msHoldMission() { if (mis && mis.timer && mis.timer.tid !== MS_GERAL) msPauseMission(); }
function msStartMission(tid) {
  cronAsk();
  if (intel && intel.timer) stopTimer();
  if (stamina && stamina.timer) stStop();
  if (graca && graca.timer) grStop(false);
  const g = ensureMs(); if (g.timer) msStop(true);
  g.work = true; g.timer = { tid, startedAt: Date.now() };
  const t = msTask(tid); if (t && !t.started) { t.started = todayISO(); t.upd = Date.now(); }
  saveMs();
}
function msPauseMission() { msStop(true); msResumeWork(); saveMs(); }
/* ---------- Ajustar o tempo da missão (esqueceu o cronômetro) ---------- */
// aceita "40", "40min", "1h", "1h20", "1:20", "1,5h" → minutos
function parseDurMin(v) {
  const t = String(v || "").trim().toLowerCase().replace(/\s+/g, ""); if (!t) return null; let m;
  if ((m = t.match(/^(\d+):(\d{1,2})$/))) return +m[1] * 60 + +m[2];
  if ((m = t.match(/^(\d+(?:[.,]\d+)?)h(?:(\d{1,2})(?:m|min)?)?$/))) return Math.round(parseFloat(m[1].replace(",", ".")) * 60) + (m[2] ? +m[2] : 0);
  if ((m = t.match(/^(\d+)(?:m|min)?$/))) return +m[1];
  return null;
}
function fmtDurIn(sec) { const m = Math.round(sec / 60), h = Math.floor(m / 60); return h ? h + "h" + (m % 60 ? String(m % 60).padStart(2, "0") : "") : m + "min"; }
// deixa o total da missão em "sec": a diferença entra (ou sai) no dia "iso". Ao somar, pode tirar do trabalho geral do mesmo dia,
// para não contar duas vezes o tempo em que o cronômetro geral estava rodando.
function msSetTaskTime(x, sec, iso, fromGeral) {
  const g = ensureMs();
  if (g.timer && (g.timer.tid === x.id || (fromGeral && g.timer.tid === MS_GERAL))) { msStop(true); msResumeWork(); }
  const diff = Math.round(sec) - msTaskSec(x.id); if (!diff) return 0;
  g.days[iso] = g.days[iso] || {};
  if (diff > 0) {
    if (fromGeral) { const take = Math.min(diff, g.days[iso][MS_GERAL] || 0); if (take) g.days[iso][MS_GERAL] -= take; }
    g.days[iso][x.id] = (g.days[iso][x.id] || 0) + diff;
  } else {
    let left = -diff;
    const ds = Object.keys(g.days).filter(d => g.days[d] && g.days[d][x.id]).sort((a, b) => a === iso ? -1 : b === iso ? 1 : b.localeCompare(a));
    for (const d of ds) { const v = g.days[d][x.id], cut = Math.min(v, left); g.days[d][x.id] = v - cut; if (!g.days[d][x.id]) delete g.days[d][x.id]; left -= cut; if (!left) break; }
  }
  x.upd = Date.now(); saveMs();
  return diff;
}
// campo "Tempo que levou" + opção de descontar do trabalho geral do dia; st guarda o que foi digitado

}

function msWorkStart() { cronAsk(); const g = ensureMs(); g.work = true; msResumeWork(); saveMs(); }

/* ---------- recorrência ---------- */
function msRecMatch(rec, iso) {

/* ---------- pendências da tela inicial ---------- */
function missoesTasks() {
  const iso = todayISO(), tasks = [];
  const sec = msDaySec(iso), goal = msGoalSec(iso);
  if (goal) tasks.push({ id: "task-ms-tempo", title: "Trabalho", live: "ms-home", label: fmtHM(sec) + " / " + fmtGoal(goal), pct: Math.min(1, sec / goal), complete: sec >= goal,
    sub: "Meta mínima de " + fmtGoal(goal) + " hoje" + (sec >= goal ? ". Meta batida." : ". Faltam " + fmtHM(goal - sec) + "."), go: () => enterMissoes("ms-hoje") });
  const list = msDayList(iso);
  list.slice(0, 6).forEach(t => {
    const di = msDueInfo(t, iso), done = t.status !== "aberta";
    const pri = MS_PRI.find(p => p[0] === t.pri);
    // pendente = atrasada ou com prazo hoje (sem prazo e marcada para hoje também vale); prazo mais à frente não pesa, mesmo planejada para hoje
    const later = !done && t.due && t.due > iso && !msCobrar(t, iso);
    tasks.push({ id: "task-ms-" + t.id, title: t.title, complete: done, pct: done ? 1 : 0, optional: later,
      label: done ? (t.status === "feita" ? "Entregue" : "Não resolvida") : msCobrar(t, iso) ? "Cobrar" : later ? "Prazo " + fmtDate(t.due).slice(0, 5) : di && di.cls === "bad" ? "Atrasada" : di && di.cls === "pend" ? (t.rec && t.rec.type ? "Hoje" : "Vence hoje") : "Hoje",
      sub: [t.proj, t.setor, t.sol, pri && "prioridade " + pri[1].toLowerCase(), t.est ? "est. " + fmtHM(t.est * 60) : ""].filter(Boolean).join(" · "),
      go: () => enterMissoes("ms-hoje", t.id) });
  });
  if (list.length > 6) tasks.push({ id: "task-ms-mais", title: "E mais " + (list.length - 6) + " missões hoje", optional: true, complete: false, pct: 0, label: "Ver", sub: "", go: () => enterMissoes("ms-hoje") });
  // pendência do dia = só o que vence hoje, está atrasado ou foi escolhido para hoje.
  // Missão em andamento com prazo mais à frente aparece só como informação (não conta como pendente).
  const andamento = msData().tasks.filter(t => t.status === "aberta" && !list.includes(t)).sort(msSort);
  if (andamento.length) {
    const nx = andamento.find(t => t.due) || andamento[0];
    tasks.push({ id: "task-ms-andamento", title: andamento.length + (andamento.length === 1 ? " missão em andamento" : " missões em andamento"), optional: true, complete: false, pct: 0, label: "Ver",
      sub: (nx.due ? "Próximo prazo: " + nx.title + " · " + fmtDate(nx.due).slice(0, 5) + "." : nx.title + ", sem prazo.") + " Não conta como pendência; planeje para hoje se quiser adiantar.", go: () => enterMissoes("ms-lista") });
  } else if (!list.length) tasks.push({ id: "task-ms-nova", title: "Registrar missões", optional: true, complete: false, pct: 0, label: "Criar", sub: "Nenhuma missão cadastrada ainda. Anote as demandas para acompanhar prazos e entregas.", go: () => { msUI.newOpen = true; enterMissoes("ms-lista"); const n = document.getElementById("msn-title"); if (n) { n.scrollIntoView({ block: "center" }); n.focus(); } } });
  return { tasks };
}

function msPeriod(k) {

  if (k === "mes") return [ymd(new Date(y, m - 1, 1)), today, "Este mês"];

function msHoursSVG(rows) {
  const hs = rows.map(r => r.sec / 3600), gs = rows.map(r => r.goal / 3600);
  const top = Math.max(4, Math.ceil(Math.max(...hs, ...gs, 1)));
  const iw = CW - PL - PR, ih = CH - PT - PB, n = rows.length, bw = Math.min(16, iw / n * 0.6);
  const xs = i => PL + iw * (i + 0.5) / n, ys = v => PT + ih * (1 - v / top);
  let g = "";
  [0, top / 2, top].forEach(v => { g += '<line class="grid" x1="' + PL + '" x2="' + (CW - PR) + '" y1="' + ys(v) + '" y2="' + ys(v) + '"/><text class="ax" x="' + (PL - 6) + '" y="' + (ys(v) + 4) + '" text-anchor="end">' + (Number.isInteger(v) ? v : v.toFixed(1).replace(".", ",")) + 'h</text>'; });
  rows.forEach((r, i) => {
    if (hs[i] > 0) g += '<rect class="' + (r.goal && r.sec >= r.goal ? "bar last" : "bar") + '" x="' + (xs(i) - bw / 2) + '" y="' + ys(hs[i]) + '" width="' + bw + '" height="' + (ys(0) - ys(hs[i])) + '" rx="2"/>';
    if (r.goal) g += '<line class="goal" x1="' + (xs(i) - bw / 2 - 2) + '" x2="' + (xs(i) + bw / 2 + 2) + '" y1="' + ys(gs[i]) + '" y2="' + ys(gs[i]) + '"/>';
  });
  const step = Math.max(1, Math.ceil(n / 8));
  rows.forEach((r, i) => { if (i % step === (n - 1) % step) g += '<text class="ax" x="' + xs(i) + '" y="' + (CH - 6) + '" text-anchor="middle">' + fmtDate(r.iso).slice(0, 5) + '</text>'; });
  return '<svg viewBox="0 0 ' + CW + ' ' + CH + '" role="img" aria-label="Horas trabalhadas por dia">' + g + '</svg>';
}

/* ---------- sugestões (aprende com o que você já classificou) ---------- */
function cleanDesc(s) {

  return true;
}

/* ---------- importação ---------- */
function parseMoney(v) {

}

  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/); if (m) { const y = m[3].length === 2 ? "20" + m[3] : m[3]; return y + "-" + m[2].padStart(2, "0") + "-" + m[1].padStart(2, "0"); }

}

    else if (c === '"') q = true;

    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;

}
function mapOldTipo(tipo) {

  return { dir: "out", kind: "gasto", nat: fixo ? "fixo" : "variavel", freq: fixo ? "recorrente" : "esporadico", ess: desn ? "superfluo" : "necessario" };
}
function rowsFromCSV(text) {
  const rows = parseCSV(text.replace(/^﻿/, "")); if (rows.length < 2) return [];
  const h = rows[0].map(normTxt);

  const out = [];
  const iBenef = col("BENEFICIARIO"), iTipo = col("TIPO"), iTag = col("TAG", "CATEGORIA");
  if (iBenef > -1) { // planilha Gestão (Extrato)

    rows.slice(1).forEach(r => {
      const v = parseMoney(r[iV]), d = parseDateAny(r[iD]), desc = (r[iBenef] || "").trim();
      if (!d || isNaN(v) || !desc) return;
      const m = mapOldTipo(r[iTipo]); const tag = (r[iTag] || "").trim();
      const t = { id: uid(), date: d, desc, amount: Math.abs(v), dir: m ? m.dir : (v < 0 ? "in" : "out"), bank: (r[iBank] || "").trim(), method: (r[iF] || "").trim(), source: "planilha", item: (iDesc > -1 ? r[iDesc] || "" : "").trim() };
      if (m && tag) { Object.assign(t, m, { cat: tag, status: "done" }); } else t.status = "pending";
      out.push(t);
    });

  }
  const iTitle = col("TITLE"), iAmount = col("AMOUNT");
  const iData = col("DATA", "DATE"), iValor = iAmount > -1 ? iAmount : col("VALOR"), iId = col("IDENTIFICADOR", "ID");
  const iDesc = iTitle > -1 ? iTitle : col("DESCRICAO", "HISTORICO", "LANCAMENTO", "MEMO");
  if (iData < 0 || iValor < 0 || iDesc < 0) return null;

function rowsFromOFX(text) {

function txKey(t) { return t.date + "|" + t.dir + "|" + t.amount.toFixed(2) + "|" + normTxt(t.desc); }

  list.forEach(t => {

    if (!list.length) { done("O arquivo não tinha lançamentos válidos."); return; }

/* ---------- agregados ---------- */
function monthAgg(k) {
  const a = { k, recebido: 0, gastos: 0, aportes: 0, byCat: {}, catCount: {}, catNat: {}, byEss: {}, byFreq: {}, byNat: {}, daily: {}, n: 0, pending: 0, recCat: {}, byCatEss: {}, catCountEss: {} };
  finFlat().forEach(t => {
    if (monthKey(t.date) !== k) return;
    if (t.status !== "done") { a.pending++; return; }
    a.n++;
    if (t.kind === "receita") { a.recebido += t.amount; a.recCat[t.cat] = (a.recCat[t.cat] || 0) + t.amount; }
    else if (t.kind === "investimento") a.aportes += t.amount;
    else if (t.kind === "gasto") {
      a.gastos += t.amount;
      a.byCat[t.cat] = (a.byCat[t.cat] || 0) + t.amount; a.catCount[t.cat] = (a.catCount[t.cat] || 0) + 1;
      a.catNat[t.cat] = t.nat;
      const ce = a.byCatEss[t.ess] = a.byCatEss[t.ess] || {}, cn = a.catCountEss[t.ess] = a.catCountEss[t.ess] || {};
      ce[t.cat] = (ce[t.cat] || 0) + t.amount; cn[t.cat] = (cn[t.cat] || 0) + 1;
      a.byEss[t.ess] = (a.byEss[t.ess] || 0) + t.amount; a.byFreq[t.freq] = (a.byFreq[t.freq] || 0) + t.amount; a.byNat[t.nat] = (a.byNat[t.nat] || 0) + t.amount;
      const d = Number(t.date.slice(8, 10)); a.daily[d] = (a.daily[d] || 0) + t.amount;
    }
  });
  a.saldo = a.recebido - a.gastos;
  return a;
}
function finMonths() {
  const ks = [...new Set(fin.tx.map(t => monthKey(t.date)))].sort();
  const cur = monthKey(todayISO()); if (!ks.includes(cur)) ks.push(cur);
  return ks.sort();
}
function estimateNext(k) {
  const cur = monthKey(todayISO()), partial = k === cur, dim = daysInMonth(k), elapsed = partial ? Number(todayISO().slice(8, 10)) : dim;
  const win = [k, addMonths(k, -1), addMonths(k, -2)].map(monthAgg).filter(a => a.n > 0);
  const cats = {}; win.forEach(a => Object.keys(a.byCat).forEach(c => { cats[c] = true; }));
  let gastos = 0; const rows = [];
  Object.keys(cats).forEach(c => {
    const src = win.find(a => a.catNat[c]); const nat = src ? src.catNat[c] : "variavel";
    let est;
    if (nat === "fixo") { const closed = win.filter(a => !(partial && a.k === k) && a.byCat[c]); est = Math.max(closed.length ? closed[0].byCat[c] : 0, (win[0] && win[0].k === k && win[0].byCat[c]) || 0); }
    else est = win.reduce((s, a) => s + (a.byCat[c] || 0) * (partial && a.k === k ? dim / elapsed : 1), 0) / Math.max(1, win.length);
    gastos += est; rows.push({ cat: c, est });

/* ---------- investimentos ---------- */
function positions() {
  const pos = {};
  fin.invest.ops.slice().sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0).forEach(o => {
    const p = pos[o.ticker] = pos[o.ticker] || { ticker: o.ticker, qty: 0, cost: 0, bought: 0, divs: 0, realized: 0 };
    if (o.type === "compra") { p.qty += o.qty; p.cost += o.qty * o.price; p.bought += o.qty * o.price; }
    else if (o.type === "venda") { const pm = p.qty ? p.cost / p.qty : 0; const q = Math.min(o.qty, p.qty); p.cost -= q * pm; p.qty -= q; p.realized += q * (o.price - pm); }
    else if (o.type === "dividendo") p.divs += o.value;
  });
  return Object.values(pos).map(p => {
    const q = fin.invest.quotes[p.ticker]; const price = q ? q.price : null;
    const pm = p.qty ? p.cost / p.qty : 0, value = price != null ? p.qty * price : null;
    const gain = value != null ? value - p.cost : null;
    return Object.assign(p, { pm, price, value, gain, gainPct: gain != null && p.cost ? gain / p.cost : null, total: gain != null ? gain + p.divs + p.realized : null, quoteAt: q ? q.at : null });
  }).sort((a, b) => (b.value || b.cost) - (a.value || a.cost));
}
function investedInMonth(k) {
  const compras = fin.invest.ops.filter(o => o.type === "compra" && monthKey(o.date) === k).reduce((s, o) => s + o.qty * o.price, 0);
  const aportes = finFlat().filter(t => t.status === "done" && t.kind === "investimento" && monthKey(t.date) === k).reduce((s, t) => s + t.amount, 0);
  return Math.max(compras, aportes);
}
function sobraInfo() {
  const cur = monthKey(todayISO()), prev = addMonths(cur, -1), a = monthAgg(prev);
  if (!a.n) return null;
  const inv = investedInMonth(cur), flag = fin.habit[cur];
  return { cur, prev, sobra: a.saldo, invested: inv, flag, complete: a.saldo <= 0 || inv >= a.saldo || !!flag };
}
async function refreshQuotes(msgEl) {
  const tickers = positions().filter(p => p.qty > 0).map(p => p.ticker);
  if (!tickers.length) { flashAuto(msgEl, "Nenhuma ação na carteira."); return; }
  flashAuto(msgEl, "Buscando cotações…");
  try {
    const url = "https://brapi.dev/api/quote/" + tickers.join(",") + (fin.invest.token ? "?token=" + encodeURIComponent(fin.invest.token) : "");
    const res = await fetch(url); const data = await res.json();
    if (!res.ok || !data.results) throw new Error(data && data.message ? data.message : "HTTP " + res.status);
    let n = 0; data.results.forEach(r => { if (r.symbol && typeof r.regularMarketPrice === "number") { fin.invest.quotes[r.symbol.toUpperCase()] = { price: r.regularMarketPrice, at: new Date().toISOString(), src: "brapi" }; n++; } });
    saveFin(); renderFin();
    const m = document.getElementById("quote-msg"); if (m) flashAuto(m, n + " cotação(ões) atualizada(s) pela brapi (podem ter atraso de até 15 min).");
  } catch (e) {
    flashAuto(msgEl, "Não consegui buscar as cotações (" + e.message + "). Confira o token da brapi ou digite o preço manualmente.");
  }
}

function exerciseDone(r) { return !!(r && (r.kg != null || r.sets != null || r.reps != null)); }

function forcaTasks() {
  if (!profileId) return { setup: true, setupLabel: "Escolha seu plano", setupText: "Escolha seu plano de treino para ver as tarefas de cada dia.", tasks: [] };
  const tabId = prof().dayTab[new Date().getDay()];
  const w = tabId && PLAN.find(p => p.id === tabId);
  if (!w) return { free: true, freeText: "Hoje é dia livre no seu plano. Nada pendente.", tasks: [] };
  const rec = (state.logs[todayISO()] && state.logs[todayISO()].e) || {};
  const done = w.ex.filter(x => exerciseDone(rec[x.id])).length, total = w.ex.length, complete = done === total;
  return { tasks: [{ id: "task-" + w.id, title: w.name, optional: !!w.optional, complete, pct: done / total,
    label: complete ? "Concluído" : (w.optional ? "Opcional · " : "") + done + "/" + total,
    sub: complete ? "Todos os exercícios registrados hoje." : (w.focus ? w.focus + " " : "") + "Faltam " + (total - done) + " de " + total + " exercícios.",
    go: () => enterForca(w.id) }] };
}

function moduleTasks(id) {
  const r = id === "forca" ? forcaTasks() : id === "inteligencia" ? intelTasks() : id === "financas" ? finTasks() : id === "estamina" ? staminaTasks() : id === "graca" ? gracaTasks() : id === "missoes" ? missoesTasks() : { tasks: [] };
  if (!r.setup && modOn(id)) { const pt = penTasks(id); if (pt.length) r.tasks = pt.concat(r.tasks || []); }
  return r;
}
function enterModule(id, tab) { if (id === "forca") enterForca(tab); else if (id === "inteligencia") enterIntel(tab); else if (id === "financas") enterFin(tab); else if (id === "estamina") enterStamina(tab); else if (id === "graca") enterGraca(tab); else if (id === "missoes") enterMissoes(tab); }

function moduleStatus(m) {
  if (!m.ready) return { cls: "", text: "Em breve" };
  const f = moduleTasks(m.id);
  if (f.setup) return { cls: "", text: "Não configurado" }; // opcional: sem cobrança até a pessoa começar a usar
  const pend = f.tasks.filter(t => !t.complete && !t.optional).length;
  if (pend) return { cls: "pend", text: pend + (pend === 1 ? " pendente" : " pendentes") };
  if (f.tasks.some(t => t.complete && !t.optional)) return { cls: "ok", text: "Concluído hoje" };
  return { cls: "ok", text: "Sem pendências" };
}

// O dia "ideal": acordar, dormir, compromissos fixos e os flexíveis (refeições, cuidados) com a janela em que podem mudar.

// Missões da semana: planejadas primeiro; o resto por prazo (o que vence antes vai antes) e prioridade, até encher as horas de trabalho de cada dia
function rtMissionPlan(days) {
  const out = { byDay: {}, late: [], later: [] }; days.forEach(d => { out.byDay[d] = []; });
  if (!modOn("missoes") || !mis) return out;
  const today = days[0], last = days[days.length - 1], cap = {};
  days.forEach(d => { cap[d] = Math.round((msGoalSec(d) - (d === today ? msDaySec(d) : 0)) / 60); if (cap[d] < 0) cap[d] = 0; });
  const need = t => Math.max(15, (t.est || 60) - Math.floor(msTaskSec(t.id) / 60));
  const put = (t, d) => { const n = need(t); out.byDay[d].push({ t, need: n }); cap[d] -= n; };
  const rest = [];
  msData().tasks.filter(t => t.status === "aberta").forEach(t => {
    if (t.wait) { const d = t.wait.until <= today ? today : t.wait.until; if (out.byDay[d]) { out.byDay[d].push({ t, need: 15, cobrar: true }); cap[d] -= 15; } return; }
    const pl = (t.plan || []).filter(x => x >= today).sort()[0] || ((t.plan || []).some(x => x < today) ? today : null);
    if (pl && out.byDay[pl]) put(t, pl); else if (pl) out.later.push(t); else rest.push(t);

  rest.sort((a, b) => { const da = a.due || "9999", db = b.due || "9999"; return da < db ? -1 : da > db ? 1 : (MS_PRI_RANK[a.pri] ?? 1) - (MS_PRI_RANK[b.pri] ?? 1); });
  rest.forEach(t => {
    const n = need(t), lim = t.due ? (t.due < today ? today : t.due) : null;
    if (lim && lim > last) { const ok = days.filter(d => cap[d] >= n); if (ok.length) put(t, ok[0]); else out.later.push(t); return; }

    if (ok.length) { put(t, ok[0]); return; }
    if (lim) { const ds = days.filter(d => d <= lim && msWorkDay(d)); put(t, ds.length ? ds.reduce((b, x) => cap[x] > cap[b] ? x : b, ds[0]) : today); out.late.push(t); return; }
    out.later.push(t);

  return out;
}

// Encaixa os itens no tempo livre, do mais fixo ao mais flexível
function rtSchedule(iso, items, from, cfg) {
  const d = rtDay(iso, cfg), dayWin = [d.wake, d.sleep];
  let free = d.free.map(x => x.slice()); if (from != null) free = rtCut(free, -1, from);
  const blocks = [], left = [];
  const cands = (dur, w) => free.map(([a, b]) => [Math.max(a, w[0]), Math.min(b, w[1])]).filter(([a, b]) => b - a >= dur);
  const take = (dur, w, fromEnd, gap) => {
    const c = cands(dur, w); if (!c.length) return null;
    const [a, b] = fromEnd ? c[c.length - 1] : c[0], s = fromEnd ? b - dur : a;
    free = rtCut(free, fromEnd ? s - gap : s, fromEnd ? s + dur : s + dur + gap); return s;
  };
  const one = (it, w, fe) => {
    const gap = it.gapAfter ?? 5;
    let s = take(it.dur, w || it.win || dayWin, fe != null ? fe : it.fromEnd, gap);
    if (s == null) s = take(it.dur, dayWin, it.fromEnd, gap);
    if (s == null) { left.push({ it, min: it.dur }); return null; }
    const b = { s, e: s + it.dur, it }; blocks.push(b); return b;
  };
  // itens longos (trabalho, estudo) viram blocos; "lead" vai colado antes do primeiro bloco (o foco antes do estudo)
  // once: só o bloco de agora (a tarefa com cronômetro rodando); o resto entra depois, na ordem normal
  const prog = new Map();
  const many = (it, lead, w0, once) => {
    const pr = prog.get(it) || { rem: it.dur, part: 0 }; prog.set(it, pr);
    let rem = pr.rem, part = pr.part; const gap = it.gapAfter ?? 5;
    const fill = w => {
      while (rem > 0) {
        // nenhum bloco menor que o mínimo (estudo: 25 min); o finzinho que sobraria pequeno vai junto do bloco atual
        const mc = it.minChunk || 15, extra = lead ? lead.dur : 0, c = cands(mc + extra, w); if (!c.length) return;
        const [a, b] = c[0], s0 = a + extra, want = rem - it.split < mc ? Math.max(rem, mc) : it.split, ch = Math.min(want, b - s0);
        if (lead) { blocks.push({ s: a, e: s0, it: lead }); lead = null; }
        const gp = it.longEvery && (part + 1) % it.longEvery === 0 ? it.longGap : gap;
        free = rtCut(free, a, s0 + ch + gp); blocks.push({ s: s0, e: s0 + ch, it, part: part++ }); rem -= ch;
        if (once) return;
      }
    };
    fill(w0 || it.win || dayWin); if (rem > 0 && !(once && part > pr.part)) fill(dayWin);
    if (!once && rem > 0) left.push({ it, min: rem });
    pr.rem = rem; pr.part = part;
    return lead;
  };
  // com o cronômetro rodando, a tarefa fica agora, antes das outras
  const order = items.slice().sort((a, b) => a.rank - b.rank);
  let base = null;
  order.filter(it => it.running).sort((a, b) => (b.key === "trabalho") - (a.key === "trabalho")).forEach(it => {
    if (!base) { const n = blocks.length; if (it.split) many(it, null, dayWin, true); else one(it, dayWin, false); base = blocks[n] || null; return; }
    // rodando junto (ex.: estudar no tempo ocioso do trabalho): mesmo horário, sem ocupar mais tempo do dia
    const pr = prog.get(it) || { rem: it.dur, part: 0 }; prog.set(it, pr);
    const ch = it.split ? Math.min(it.split, pr.rem) : it.dur;
    blocks.push({ s: base.s, e: base.s + ch, it, part: it.split ? pr.part++ : undefined }); pr.rem -= ch;
  });
  let foco = order.find(it => it.beforeStudy && !it.running) || null;
  order.filter(it => !(it.running && !it.split) && !it.optional && !it.beforeStudy).forEach(it => {
    if (it.key === "cardio" && it.afterForca) { const fb = blocks.find(b => b.it.key === "forca"); one(it, fb ? [fb.e, fb.e + 120] : null); return; }
    if (it.key === "estudo") { foco = many(it, foco); return; }
    if (it.split) many(it); else one(it);
  });
  // foco sem estudo hoje (ou sem espaço colado): vai para onde couber
  if (foco) one(foco);

  if (ROT_TABS.some(t => t.id === h)) { if (state.view !== "rotina" || h !== state.rtab) enterRotina(h); return; }
  if (profileId && TABS.some(t => t.id === h) && (state.view !== "forca" || h !== state.tab)) enterForca(h);
});
cronBusy = true; // até ver se houve "Pausar" pela notificação (senão a sessão com tempo fecharia cheia)
loadCloud();
loadIntel();
loadFin();
loadStamina();
loadGraca();
loadMs();
loadPerfil();
loadRotina();
loadFPlan();
fMigrateLegacy();
const savedProfile = readProfile();
if (savedProfile) loadProfile(savedProfile);
const startHash = location.hash;
state.htab = HOME_TABS.some(t => "#" + t.id === startHash) ? startHash.slice(1) : HOME_DEF;
history.replaceState(null, "", "#" + state.htab);
renderHome();
if (startHash.startsWith("#tarefa-")) rtGoTaskHash(startHash);
else if (startHash.startsWith("#abrir-")) cronOpen(startHash);
cronBusy = true; cronApplyPauses().then(cronHide);
updateAcct();
cloudStartup().then(() => { fLateMigrate(); fSerial(fPublish); });
if ("serviceWorker" in navigator) {
  // Atualização: confere se há versão nova ao abrir e ao voltar para o app; quando a nova assume, recarrega uma vez.
  const hadController = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(reg => {
      reg.update().catch(() => {});
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(() => {}); });
    }).catch(() => {});
  });
}
